{
  id: 'interview-debrief',
  title: `Yesterday's Debrief — Ownership & Architecture Depth`,
  tag: 'PRIORITY',
  items: [
    { q: `Yesterday's interviewer kept probing "did you build this, or did someone else" across Terraform, AWS Organization, IAM, networking, security, Helm, and databases — why does that matter even more for tomorrow?`,
      a: `Real operational depth came through clearly, but design/architecture ownership consistently sat with "the platform team" — across almost every major area. Tomorrow's role is explicitly architect-level: "you will be a key leader... responsible for defining and driving the architectural vision." That exact question is very likely to resurface, probably earlier and more directly than yesterday.
      <br><br>The fix isn't overclaiming ownership you didn't have — it's two things: (1) have at least one genuine example per area below where you went deeper than pure operation, and (2) use the reframe in the next card for everything else, instead of a flat "I didn't do that."` },
    { q: `What's the specific reframe for talking about things you operated rather than designed?`,
      a: `Yesterday's feedback flagged this directly. Instead of "I didn't do that" or "platform team handled that," try: <em>"The platform team owned the initial design; my role was operating, troubleshooting, and evolving it — for example, [specific instance]."</em> Honest — it doesn't claim ownership you didn't have — but it leads with what you actually did rather than what you didn't, and gives the interviewer something concrete to engage with instead of a dead end.
      <br><br>Prepare this phrasing in advance for each area below so it comes out naturally rather than improvised live. Also flagged specifically: reduce filler words ("uh", "basically", "like"), and lead answers with a one-line summary before adding detail — both called out as areas to tighten.` },
    { q: `Terraform specifically — what's your ready answer if asked "did you design this, or work with what existed"?`,
      a: `Yesterday you said "I didn't design it, I worked with existing Terraform" — the feedback noted this landed fine because it was honest, not because it was strategically framed. For tomorrow, go one level further: name the <strong>specific</strong> parts of that existing Terraform you actually modified, extended, or troubleshot — a module you added, a state issue you resolved, a variable pattern you standardized.
      <br><br>If you genuinely have zero hands-on modification experience beyond plan/apply, say so plainly and pivot immediately to what you do understand deeply (see the new Terraform ownership questions added to the IaC section below) — a clear "here's what I haven't done, here's what I understand deeply" reads stronger than a vague deflection either way.` },
    { q: `Same pattern for AWS Organization / multi-account setup, IAM architecture, and networking — how do you prepare a ready answer for each without overclaiming?`,
      a: `For each, spend a few minutes tonight recalling one specific moment you went beyond pure operation — a permission boundary you had to reason through and adjust, a routing or connectivity issue you diagnosed and fixed at the VPC/subnet level, an account you helped provision, a policy you actually wrote even if someone else owned the overall design.
      <br><br>If nothing comes to mind for one of these, that's useful information too — it tells you exactly where to spend tonight's remaining prep time conceptually (the IAM & Networking sections above) rather than hoping it doesn't come up.` },
    { q: `Same again for Security (Security Hub/GuardDuty), Helm charts, and database architecture — why are these three worth extra attention specifically?`,
      a: `Same technique — one concrete example of going deeper than pure operation, or a clean "I understand this conceptually, haven't owned the design" if nothing comes to mind. These three specifically are worth extra attention because they weren't in your original prep at all until now — new questions have been added to the IAM/Security section, and a new Kubernetes-depth section below covers Helm directly, so at minimum you won't be starting from zero if they come up.` }
  ]
},
{
  id: 'system-design-walkthroughs',
  title: 'System Design Walkthroughs & Troubleshooting Scenarios',
  tag: 'SCENARIOS',
  items: [
    { q: `Design a secure, highly-available 3-tier web application on AWS — walk me through the full architecture.`,
      a: `This is close to exactly what was asked yesterday, and it's a standard architect-interview pattern — very likely to recur in some form. Lead with a clean high-level flow, then be ready to drill into any layer when asked — yesterday's interviewer "gradually extracted" the design rather than asking for everything upfront, and that's the more natural way to actually deliver this.
      <br><br><strong>High-level flow:</strong> Client → Route 53 (DNS) → CloudFront (CDN/edge) → WAF → Application Load Balancer → Auto Scaling group of EC2 or EKS pods → RDS (Multi-AZ) for relational data, S3 for static/object storage.
      <br><br><strong>Layer in when asked:</strong> Networking — VPC with public subnets (ALB, NAT Gateway) and private subnets (compute, database), Internet Gateway for public egress, NAT Gateway for private outbound-only access. Security — IAM roles (never long-lived keys) for compute to reach other services, Secrets Manager for DB credentials, security groups scoped per tier. Observability — CloudWatch metrics/alarms/dashboards, CloudTrail for audit. Resilience — Multi-AZ everywhere it matters, a backup strategy for RDS/S3, DR posture if asked.
      <br><br><strong>The delivery habit worth rehearsing:</strong> state the client-to-database flow in one breath first (8-10 words per hop), then offer "happy to go deeper on security, scaling, or resilience — where would you like me to start" rather than front-loading every detail unprompted. That's closer to how it was actually asked yesterday, and it reads as confidence rather than a memorized diagram.` },
    { q: `Walk through troubleshooting: an EC2 instance in one VPC can't connect to an RDS instance.`,
      a: `Work outward systematically rather than guessing: same VPC, or peered/Transit-Gateway-connected? Security group on the RDS instance actually allowing inbound from the EC2 instance's security group (SG-to-SG references are the more maintainable pattern versus CIDR ranges, worth mentioning). NACLs at the subnet boundary not blocking it. Route tables on both subnets actually routing to each other. DNS resolving the RDS endpoint correctly.
      <br><br>And confirm the RDS instance itself isn't paused, in a maintenance window, or has exhausted max connections — sometimes the network path is fine and the database itself is the actual blocker.` },
    { q: `A production database's CPU is spiking — walk through your triage.`,
      a: `Check Performance Insights or CloudWatch for what's actually driving it — a specific slow query, a spike in connection count, or lock contention look very different and need different fixes. Check for a recent deploy or schema change correlating with the onset.
      <br><br>Check connection count against the instance's max — a connection leak from an application not releasing connections properly is one of the most common real-world causes, often mistaken for "the database needs to be bigger" when it's actually an application-side bug. If it's genuinely query load, check for a missing index or a newly-inefficient query plan (often after a data volume change) before reaching for a bigger instance class.` },
    { q: `How would you design a zero-downtime schema change for a production RDS database?`,
      a: `Additive-first changes (add a new column as nullable, backfill it, only make it required in a later deploy) rather than a single blocking migration that locks the table. For genuinely large tables, an online schema-change approach (building a shadow table and cutting over) rather than an in-place ALTER that locks for the duration.
      <br><br>Application code deployed to tolerate both the old and new schema during the transition window (read/write compatibility on both sides), so the schema change and the application deploy don't have to be perfectly simultaneous.` },
    { q: `Walk through connection pooling — why it matters, and how you'd diagnose a connection pool exhaustion issue.`,
      a: `Databases have a hard cap on concurrent connections, each with real memory/resource cost — without pooling, a burst of application instances or threads can exhaust that cap directly, or waste it on mostly-idle connections. A pooler (RDS Proxy, PgBouncer, or an application-level pool) multiplexes many logical application connections onto fewer actual database connections.
      <br><br>Diagnosing exhaustion: check current connection count against max, check for connections stuck idle-in-transaction (a common leak — a transaction opened and never committed/rolled back), and check whether a recent traffic spike or a change in application instance count is the actual driver before assuming the pool itself is misconfigured.` },
    { q: `Route 53 — weighted routing, failover routing, and traffic shifting — walk through when you'd use each and how you'd set it up.`,
      a: `<strong>Weighted routing</strong> for gradual traffic shifting between versions/environments — assign each record a relative weight, adjust over time for a canary-style rollout at the DNS layer. <strong>Failover routing</strong> for active-passive DR — a primary record with associated health checks, and a secondary record Route 53 automatically starts serving if the primary's health check fails. <strong>Weighted + latency-based combined</strong> for multi-region active-active wanting both geographic optimization and controlled traffic distribution.
      <br><br>Worth mentioning explicitly: health checks are what make failover routing actually work — a failover policy with no real health check behind it doesn't actually fail over, it just sits there.` }
  ]
},
{
  id: 'aws-core',
  title: 'AWS Core Compute, Storage & Serverless',
  tag: 'CORE AWS',
  items: [
    { q: `How would you decide between Lambda, ECS/EKS, and EC2 for a given workload when architecting a new service?`,
      a: `<strong>Lambda</strong> for event-driven, short-duration (≤15 min), stateless work with unpredictable/spiky traffic — pay per invocation, zero infra management, but cold starts and the time limit rule it out for long-running or highly latency-sensitive synchronous work.
      <br><br><strong>ECS/EKS</strong> for containerized services needing more runtime control or longer-running processes — ECS for AWS-native simplicity without managing a control plane, EKS for Kubernetes portability/ecosystem. <strong>EC2</strong> when you need full OS-level control or licensing tied to instance identity. Most modern architectures end up a mix — Lambda for glue, ECS/EKS for core services, EC2 for special cases.` },
    { q: `Walk through designing a REST API on API Gateway backed by Lambda — what are the key architectural decisions?`,
      a: `<strong>Integration type</strong> (Lambda proxy integration is the common default — passes the full request through, your function handles routing/parsing). <strong>Authorization</strong> (IAM auth, Cognito authorizer, or a custom Lambda authorizer for OAuth/JWT). <strong>Stage strategy</strong> (dev/staging/prod stages, canary deployments for safer rollouts). <strong>Throttling/usage plans</strong> (protecting backend Lambda concurrency, API keys for third-party rate-limiting). <strong>Request validation</strong> at the Gateway level — catching malformed requests before they even invoke Lambda.` },
    { q: `How would you architect EC2 for a workload that needs to be highly available across a region?`,
      a: `Auto Scaling Group spanning multiple AZs (never single-AZ for anything production-critical), behind an ALB/NLB distributing traffic and health-checking instances, with <strong>launch templates</strong> (not launch configurations) for a consistent, reproducible config.
      <br><br>Scaling policies tied to actual demand signals (target tracking on CPU/request count, or a custom CloudWatch metric closer to real load), and instance refresh capability for rolling out AMI updates without a big-bang cutover.` },
    { q: `What's your approach to S3 architecture for an enterprise platform — bucket structure, security, cost management?`,
      a: `Bucket-per-purpose or a well-namespaced prefix structure depending on how many teams/environments need genuinely separate access boundaries. <strong>Security:</strong> block public access at the account level by default, bucket policies plus IAM, SSE-KMS for anything sensitive, versioning plus MFA delete for anything that can't tolerate accidental deletion.
      <br><br><strong>Cost:</strong> lifecycle policies transitioning cold data to IA/Glacier automatically, and Storage Lens/Cost Explorer to see where spend actually concentrates.` },
    { q: `ECS vs. EKS specifically — what would push you toward one over the other for a new containerized platform?`,
      a: `<strong>ECS</strong> when the org is AWS-native without existing Kubernetes investment — simpler control plane, Fargate removes even node management, generally faster to production without deep K8s expertise. <strong>EKS</strong> when you need Kubernetes-ecosystem portability (multi-cloud, existing Helm charts/operators) or the team is already K8s-centric.
      <br><br>For a role architecting across enterprise clients with varying existing investment, being able to make and justify this call per-engagement matters more than a fixed default.` },
    { q: `What's Fargate, and when would you choose it over EC2 launch type for ECS/EKS?`,
      a: `Serverless compute for containers — no EC2 instances to provision, patch, or scale yourself; billed per task/pod resource allocation. Choose it when operational simplicity matters more than fine-grained cost optimization or specialized instance requirements (GPU workloads, high-density bin-packing still often favor self-managed EC2 node groups).
      <br><br>Common pattern: Fargate for most general services, EC2 node groups reserved for workloads with specific compute needs Fargate doesn't support well.` },
    { q: `How would you design ECR into a broader CI/CD and deployment architecture?`,
      a: `Private repositories per service/team with push permissions restricted to CI/CD service roles (not broad developer push access), <strong>image scanning enabled</strong> gating promotion of vulnerable images, lifecycle policies expiring untagged/old images automatically, and <strong>immutable tags</strong> for anything deployed to production — so a tag can't be silently overwritten after the fact, a real audit/reproducibility concern.` }
  ]
},
{
  id: 'networking',
  title: 'Networking & Hybrid Connectivity',
  tag: 'NETWORK',
  items: [
    { q: `Walk through your approach to VPC architecture for a new enterprise platform — subnet design, routing.`,
      a: `Multi-AZ subnet design with clear tiering — public subnets for internet-facing resources (load balancers, NAT gateways), private subnets for application compute, often a further-isolated data subnet tier for databases with no internet route at all.
      <br><br>Route tables scoped per tier (public → internet gateway, private → outbound via NAT, data → no outbound internet route). <strong>CIDR planning up front</strong> matters more than expected — undersizing a VPC's address space is genuinely painful to fix later, especially once peering/Transit Gateway attachments exist.` },
    { q: `When would you use Transit Gateway versus VPC peering for connecting multiple VPCs?`,
      a: `<strong>VPC peering</strong> for a small, stable number of point-to-point connections — simple, no extra cost beyond data transfer, but no transitive routing (each pair needs its own connection — an unmanageable mesh past a handful of VPCs).
      <br><br><strong>Transit Gateway</strong> beyond a few VPCs, or for hub-and-spoke connectivity across many VPCs and on-prem networks — centralized routing, transitive routing support, and the natural hub for connecting Direct Connect/VPN cleanly into a multi-VPC environment.` },
    { q: `Direct Connect vs. Site-to-Site VPN — how would you decide which to recommend to a client for hybrid connectivity?`,
      a: `<strong>Direct Connect</strong> for consistent, high-bandwidth, low-latency needs — a dedicated physical connection bypassing the public internet, right for latency-sensitive workloads or substantial predictable bandwidth (large migrations, real-time hybrid traffic).
      <br><br><strong>VPN</strong> for faster setup, lower cost, when volume/latency sensitivity doesn't justify Direct Connect's cost and lead time (provisioning a circuit can take weeks). Common pattern: VPN as interim connectivity while DX provisions, and as a DX failover path even after.` },
    { q: `How would you use PrivateLink in an architecture connecting to third-party or ERP systems?`,
      a: `PrivateLink exposes a service via a private endpoint inside your VPC, so traffic never traverses the public internet — directly relevant given this JD's ERP integration (SAP/Oracle/BaaN) and third-party connectivity scope, where keeping that traffic off the public internet is often a real security/compliance requirement.
      <br><br>Where the ERP/third party doesn't natively support PrivateLink, the alternative is routing through Direct Connect/VPN to reach it privately, or a VPC endpoint service if you're exposing an internal service to a partner.` },
    { q: `How would you architect Route 53 and DNS for a multi-region or hybrid environment?`,
      a: `Public hosted zones with routing policy matched to the need — latency-based for global multi-region services, failover for active-passive DR, weighted for canary/blue-green traffic shifting. Private hosted zones for internal-only resolution, associated with the specific VPCs that need them.
      <br><br>For hybrid environments, <strong>Route 53 Resolver</strong> (inbound/outbound endpoints) lets on-prem DNS and VPC DNS resolve each other's names — frequently needed but easy to overlook when integrating with on-prem ERP systems.` },
    { q: `What's your approach to load balancer selection — ALB vs NLB vs Gateway Load Balancer — for different parts of this kind of platform?`,
      a: `<strong>ALB</strong> for HTTP/HTTPS needing Layer 7 features — path/host-based routing, WebSocket support, native integration with API-style microservices and ECS/EKS target groups. <strong>NLB</strong> for ultra-low-latency, high-throughput TCP/UDP, or when you need a static/Elastic IP for the load balancer (common when a partner system needs to allowlist a fixed IP — relevant again for ERP/third-party connectivity). <strong>Gateway Load Balancer</strong> specifically for inserting third-party virtual appliances transparently into the traffic path.` },
    { q: `How would you design network security (security groups, NACLs) for a platform integrating with sensitive third-party/ERP systems?`,
      a: `Security groups as the primary, stateful control — scoped tightly per tier (LB SG allows inbound from internet on 443 only, app-tier SG allows inbound only from the LB SG, data-tier SG allows inbound only from the app-tier SG) rather than broad CIDR rules. NACLs as a coarser, stateless secondary layer at the subnet boundary.
      <br><br>For third-party/ERP connectivity specifically, <strong>egress rules deserve the same scrutiny as ingress</strong> — an app tier that can reach anywhere outbound is a real data-exfiltration risk if compromised.` }
  ]
},
{
  id: 'iam-security',
  title: 'IAM & Security Governance',
  tag: 'IAM',
  items: [
    { q: `Walk through the difference between IAM Roles, Policies, and Permission Boundaries, and how they compose in a real architecture.`,
      a: `A <strong>Policy</strong> is the actual permission document (JSON allow/deny statements). A <strong>Role</strong> is an identity that can be assumed, with policies attached — the mechanism for temporary, scoped credentials rather than long-lived access keys. A <strong>Permission Boundary</strong> sets the maximum permissions a role/user can ever have regardless of what's directly attached — lets a team create its own roles within a safe ceiling.
      <br><br>They compose as layers: effective permissions are the <em>intersection</em> of what the identity policy grants AND what the permission boundary allows.` },
    { q: `How would you design cross-account access for an enterprise client with multiple AWS accounts (dev/staging/prod, or per-business-unit)?`,
      a: `Role-based cross-account access — a role in the target account with a trust policy naming the specific source account/role allowed to assume it, never shared long-lived credentials. For human access, federated through <strong>IAM Identity Center</strong> against a central identity source, no per-account local IAM users.
      <br><br>For service-to-service cross-account access, scope the trust policy as tightly as possible (specific role ARN, not a whole account) — <strong>external ID conditions</strong> add protection for third-party cross-account access specifically, mitigating the "confused deputy" problem.` },
    { q: `What are Service Control Policies, and how do they differ from IAM policies?`,
      a: `SCPs apply at the AWS Organizations level (an OU or account) and set the <strong>maximum</strong> permissions available within that account — they don't grant permissions, only restrict what IAM policies can ever allow, no matter how permissive.
      <br><br>Classic use: an SCP denying the ability to disable CloudTrail or leave an approved region, applied org-wide — a guardrail that survives individual account misconfiguration, which is the point of them living at the organization layer rather than relying on every account's IAM being perfect.` },
    { q: `How would you design an enterprise IAM strategy from scratch for a new AWS Organization supporting multiple business units?`,
      a: `Multi-account structure (Organizations/Control Tower) separating environments and business units rather than one account with everything — blast-radius containment is the core reasoning. Centralized identity via IAM Identity Center federated to the enterprise's existing IdP.
      <br><br>SCPs at the OU level for org-wide guardrails, standardized permission-set/role naming conventions for consistent access requests and audits, and a clear review process for new roles/policies — least-privilege as policy, not aspiration.` },
    { q: `How do you actually design least-privilege IAM policies in practice, rather than starting broad and "tightening later" (which rarely happens)?`,
      a: `Start from the specific actions the workload actually needs (CloudTrail logs of what a similar existing workload calls, or IAM Access Analyzer's policy generation from observed activity) rather than a broad managed policy with a promise to narrow later.
      <br><br>Scope resource ARNs specifically rather than <code>*</code> where avoidable, add condition keys (source IP, MFA presence, tags) where they add real protection, and run <strong>IAM Access Analyzer continuously</strong> — not just at initial design — since environments drift.` },
    { q: `What's your approach to managing secrets and encryption keys — Secrets Manager vs. SSM Parameter Store vs. KMS — when do you use which?`,
      a: `<strong>KMS</strong> is the encryption key layer underneath the other two (and used directly for S3/EBS/RDS encryption at rest). <strong>Secrets Manager</strong> for secrets needing automatic rotation (DB credentials, API keys to third-party ERP/RPA systems) — rotation Lambda integration is the differentiator justifying its cost over Parameter Store.
      <br><br><strong>SSM Parameter Store</strong> for config values and secrets that don't need rotation — a very common cost pattern is Parameter Store for the bulk of config, Secrets Manager reserved specifically for rotating credentials.` },
    { q: `How would you architect KMS key usage and key policies for a multi-account, multi-team environment?`,
      a: `Customer-managed keys (not AWS-managed defaults) for anything needing control over key policy, rotation schedule, and cross-account grants — a default key can't be shared cleanly cross-account, which matters here. Key policies scoped per use case.
      <br><br>For cross-account access to encrypted resources, <strong>both the resource's IAM policy AND the KMS key policy</strong> need to grant access — a very common real-world gotcha where someone grants S3 access cross-account but forgets the key policy, and access silently fails.` },
    { q: `Walk through how you'd design secure connectivity and authentication for integrating with third-party systems and ERP platforms (SAP, Oracle, BaaN) specifically.`,
      a: `Credentials in Secrets Manager (never hardcoded or plaintext config), retrieved at runtime by a role narrowly scoped to just that secret. Network path secured via PrivateLink, Direct Connect, or VPN rather than traversing the open internet.
      <br><br>For the AWS-side identity the third party might authenticate back to, a dedicated IAM role/API Gateway authorizer scoped to exactly what that integration needs — <strong>never reuse a broad internal service role</strong> for an external-facing integration point, so a compromised third-party credential's blast radius stays as small as possible.` },
    { q: `What's Amazon Cognito, and how would you use it for authentication in an architecture like this JD describes (API Gateway plus third-party integration)?`,
      a: `Cognito provides two related pieces: <strong>User Pools</strong> (a managed user directory with sign-up/sign-in, MFA, and OAuth/OIDC token issuance — for actual end-user authentication) and <strong>Identity Pools</strong> (federate an authenticated identity, from a User Pool or an external IdP, into temporary AWS IAM credentials — for authorizing direct access to AWS resources).
      <br><br>For an API Gateway-fronted architecture, a Cognito User Pool authorizer is a common pattern: users authenticate against the pool, get a JWT, API Gateway validates it natively without custom authorizer code for the common case. For the ERP/third-party integration side of this JD specifically, Cognito is less likely to be the mechanism — that's more OAuth-client-credentials/API-key territory — Cognito's fit here is actual end-user-facing authentication, if this platform has one.` },
    { q: `What does GuardDuty actually detect, and how would you respond operationally to a finding?`,
      a: `A managed threat-detection service analyzing VPC Flow Logs, CloudTrail, and DNS logs for suspicious patterns — compromised credentials making unusual API calls, an EC2 instance communicating with a known-malicious IP, reconnaissance-style behavior — without you having to build or maintain the detection logic yourself.
      <br><br>Operationally: findings should route into the same centralized alerting/ticketing path as other security signals, triaged by severity, with a defined response runbook per finding type — isolate the resource, rotate the credential, investigate further — rather than each finding handled ad hoc the first time someone notices it.` },
    { q: `How does Security Hub aggregate findings, and how would you use it as part of ongoing security governance?`,
      a: `Security Hub aggregates findings from GuardDuty, Config, Inspector, and other AWS/partner security tools into one normalized view, and runs automated checks against standards (CIS AWS Foundations, PCI DSS, AWS Foundational Security Best Practices) to give a continuous compliance score rather than a point-in-time audit.
      <br><br>Operationally: a regular review cadence (weekly, or event-driven via EventBridge for high-severity findings), findings routed to the owning team rather than one person triaging everything, and tracking the compliance score trend over time as a genuine governance metric — not a dashboard nobody looks at until an audit is imminent.` }
  ]
}
,
{
  id: 'api-integration',
  title: 'API Architecture & Third-Party Integration',
  tag: 'API',
  items: [
    { q: `How would you design API lifecycle management for a platform serving both internal consumers and external/third-party clients?`,
      a: `Versioning strategy decided upfront (URI versioning like <code>/v1/</code> is simplest to reason about/cache; header-based is more "correct" REST but harder to debug) with a defined deprecation policy communicated ahead of removal, not discovered via a breaking change. Separate API Gateway stages or gateways for internal vs. external consumers — they typically need different throttling, auth, and monitoring policies.
      <br><br>Documentation (OpenAPI/Swagger) generated from or validated against the actual API definition so it can't silently drift from what's deployed.` },
    { q: `OAuth vs. JWT vs. API Keys — walk through when you'd use each for securing an API.`,
      a: `<strong>API Keys</strong> for simple identification/rate-limiting of known consumers where the security bar is low — identify who's calling, not really authorize what they can do. <strong>JWT</strong> for stateless auth where the token carries claims (identity, scopes) the API validates without a database round-trip — common for service-to-service and SPA-backend scenarios.
      <br><br><strong>OAuth 2.0</strong> (client credentials for service-to-service, authorization code for user-delegated access) when you need a proper standardized token issuance/refresh flow — especially relevant integrating with third-party systems that already speak OAuth, directly applicable to this JD's ERP/RPA integration scope.` },
    { q: `How would you design an integration architecture orchestrating flows between an upstream RPA process, a backend application, and downstream ERP/consumer systems?`,
      a: `Event-driven where possible rather than tight synchronous coupling — the RPA process completing a task publishes an event (EventBridge or SNS/SQS) rather than calling the next system directly, so each system processes at its own pace and a downstream outage doesn't block the upstream process.
      <br><br>An orchestration layer (<strong>Step Functions</strong> is a natural fit) coordinating the multi-step flow explicitly, with defined error handling/retry/DLQ behavior per step. API Gateway as the front door for synchronous pieces, the async event backbone handling everything else.` },
    { q: `How do you handle secure, reliable connectivity to legacy or on-prem ERP systems (SAP, Oracle, BaaN) that weren't designed with modern API patterns in mind?`,
      a: `If the ERP exposes any API (increasingly common even for legacy SAP via OData/RFC-based interfaces, or Oracle's REST APIs), wrap it behind your own API Gateway layer so downstream consumers get a consistent modern interface regardless of what's underneath — also a single place to add auth, rate-limiting, and monitoring the legacy system itself can't provide.
      <br><br>Where no API exists, an integration platform/middleware translating between the ERP's native protocol and your event/API layer, network path secured via Direct Connect/VPN/PrivateLink since these systems are often on-prem.` },
    { q: `What's your approach to handling failures/retries in an integration flow spanning multiple systems with different reliability characteristics?`,
      a: `<strong>Idempotency</strong> built into each step (a retried operation shouldn't duplicate a downstream side effect — critical for anything touching financial/ERP transactions), exponential backoff with jitter against systems with their own rate limits, and DLQs capturing anything that exhausts retries so it's investigated rather than silently dropped.
      <br><br>Circuit-breaker behavior for a consistently-failing downstream dependency, so the whole pipeline doesn't back up waiting on a system that's genuinely down — fail fast, queue for reprocessing once it recovers.` },
    { q: `How would you approach securing third-party API connectivity where you don't control the third party's security posture?`,
      a: `Treat the integration boundary as its own trust boundary regardless of what the third party claims — validate/sanitize everything received from them, scope credentials exchanged as narrowly as possible in both directions, and monitor that specific integration's traffic patterns separately from general platform monitoring, since a compromised or misbehaving third-party integration is a realistic attack/failure vector generic monitoring might not surface quickly.` }
  ]
},
{
  id: 'enterprise-integration',
  title: 'Enterprise Platform Integration (ERP / RPA / Event-Driven)',
  tag: 'INTEGRATION',
  items: [
    { q: `Given the JD mentions "upstream RPA processes" and an "AR tool backend" specifically — how would you architect around an RPA system as an upstream data source?`,
      a: `RPA tools (UiPath, Automation Anywhere, Power Automate) typically complete a task and need to hand off structured output somewhere — a clean API or event-based handoff point (rather than the RPA tool reaching deep into your backend database directly) keeps the integration maintainable and lets your platform evolve independently of the RPA tool's specifics.
      <br><br>RPA processes can be more failure-prone than native code (UI-automation style breaking on interface changes), so the receiving side should assume occasional malformed or duplicate submissions and validate/dedupe accordingly rather than trusting the upstream blindly.` },
    { q: `What's an Accounts Receivable (AR) tool integration likely to need architecturally, and what would you prioritize getting right?`,
      a: `Financial data raises the bar on <strong>idempotency, auditability, and data integrity</strong> specifically — every transaction/record needs a traceable path (which system originated it, when, what transformed it at each step), since financial discrepancies get investigated and need to be explainable months later.
      <br><br><strong>Reconciliation logic</strong> (does what left the RPA/upstream match what landed downstream) is worth building in explicitly rather than assuming the happy path — silent data loss or duplication in a financial pipeline has real business consequences, not just an engineering inconvenience.` },
    { q: `How would you design an event-driven architecture connecting multiple internal services and external systems, and what are the tradeoffs versus a more traditional synchronous/orchestrated approach?`,
      a: `Event-driven (publish to EventBridge/SNS, consumers react independently) decouples producers from consumers — a new downstream consumer can be added without touching the upstream system, and individual outages don't cascade synchronously. Tradeoff: harder to see the end-to-end flow at a glance, and eventual consistency needs to be an accepted design constraint.
      <br><br>A hybrid is common: event-driven for decoupled async parts, explicit orchestration (Step Functions) where a defined sequence/rollback genuinely matters — like a financial transaction pipeline.` },
    { q: `How would you evaluate whether a given integration point should be synchronous (API call) versus asynchronous (event/queue)?`,
      a: `Synchronous when the caller genuinely needs an immediate response to proceed and downstream latency/availability can support that. Asynchronous when the caller doesn't need to wait for completion, downstream processing might exceed a reasonable timeout, or you want to protect the downstream from the upstream's traffic spikes.
      <br><br>Financial/ERP integrations specifically often favor async with a separate status-check mechanism, since ERP systems can be slow and you don't want an RPA process or API caller blocked waiting on them.` },
    { q: `What's your approach to data transformation/mapping when integrating systems that don't share a common data model (e.g. an RPA tool's output format versus an ERP's expected input format)?`,
      a: `A dedicated transformation/mapping layer (a Lambda, or a proper integration platform if complexity justifies it) rather than scattering transformation logic across services — centralizing means an ERP schema update touches one place, not a hunt through the codebase.
      <br><br>Schema validation at the boundary on both sides (validate RPA output before transforming; validate transformed output before sending to the ERP) catches mismatches early with a clear error, rather than the ERP rejecting a malformed request with a cryptic downstream failure.` },
    { q: `How would you monitor and gain visibility into a multi-system integration flow so you can actually tell where something broke?`,
      a: `A <strong>correlation/trace ID</strong> generated at flow start and threaded through every system and queue/event it touches, so one ID reconstructs the full path across CloudWatch Logs/X-Ray/whatever each system logs to. Step-level status tracking (received → transformed → sent to ERP → confirmed) persisted somewhere queryable, so "where is transaction X" is a lookup, not an investigation.
      <br><br>Alerting on <em>stuck</em> transactions (stalled in one status far longer than normal) as a leading indicator, not just hard failures.` }
  ]
},
{
  id: 'messaging',
  title: 'Messaging & Event-Driven Architecture',
  tag: 'MESSAGING',
  items: [
    { q: `SNS vs. SQS vs. EventBridge — walk through when you'd use each.`,
      a: `<strong>SQS</strong> for point-to-point queuing where one consumer (or group) processes each message — decoupling with built-in visibility timeout and DLQ support. <strong>SNS</strong> for pub/sub fan-out where multiple independent consumers all need to react to the same event.
      <br><br><strong>EventBridge</strong> for sophisticated content-based event routing (rules matching on event patterns, not just topic subscription) — the natural choice integrating with SaaS/third-party event sources, or when you want schema registry and more structured event governance than raw SNS/SQS provides.` },
    { q: `How would you design a fan-out architecture where one event needs to trigger multiple independent downstream processes?`,
      a: `SNS topic as the fan-out point, each downstream process subscribing via its <strong>own SQS queue</strong> (the "fan-out to SQS" pattern) rather than subscribing Lambda functions directly — the intermediate queue gives buffering, retry, and DLQ handling per-consumer that direct Lambda subscription doesn't provide as cleanly.
      <br><br>Each consumer processes independently; if one is temporarily down, its queue simply buffers rather than the fan-out event being lost or blocking others.` },
    { q: `When would you reach for Kafka/MSK instead of native AWS messaging (SNS/SQS/EventBridge)?`,
      a: `When you need features native AWS messaging doesn't provide well — very high-throughput streaming with consumer <strong>replay</strong> (re-reading historical events, which SQS's delete-on-consume model doesn't support natively), strict ordering at scale across partitions, or existing significant Kafka investment/expertise and multi-cloud portability needs.
      <br><br>MSK removes the operational burden of running Kafka yourself while keeping its specific capabilities — the tradeoff being a heavier, more operationally complex piece than SNS/SQS for teams that don't genuinely need Kafka-specific features.` },
    { q: `How do you handle message ordering and exactly-once processing requirements in an SQS-based architecture?`,
      a: `SQS standard queues don't guarantee order and can deliver more than once — for strict ordering needs, <strong>FIFO queues</strong> provide ordering within a message group and exactly-once processing (dedup within a 5-minute window).
      <br><br>Tradeoff: FIFO has lower throughput limits, so the use case needs genuine ordering/dedup requirements to justify it — many assumed-FIFO cases actually just need idempotent consumers with standard queues, simpler and higher-throughput.` },
    { q: `What's your approach to dead-letter queue strategy across a messaging-heavy architecture?`,
      a: `Every queue that matters gets a DLQ with a defined max-receive-count before routing there, rather than indefinite retries or silent disappearance after exhaustion. Critically, a DLQ needs <strong>actual monitoring/alerting</strong> — a message landing there should generate a signal someone sees — plus a defined next step (automated reprocessing after a fix, or manual investigation for anything financial/sensitive). A DLQ nobody looks at is just where failed messages go to be forgotten.` }
  ]
}

{
  id: 'iac',
  title: 'Infrastructure as Code',
  tag: 'IAC',
  items: [
    { q: `Terraform vs. CloudFormation vs. CDK — how would you decide which to standardize on for this kind of platform, and could you justify supporting more than one?`,
      a: `<strong>Terraform</strong> for multi-cloud consistency and its large module ecosystem. <strong>CloudFormation</strong> for pure-AWS shops wanting native, no-extra-tooling integration (sometimes ahead of Terraform provider support for newer services) and native StackSets for multi-account deployment. <strong>CDK</strong> when you want infrastructure defined in a real language (Python/TypeScript) — genuinely useful for complex, parameterized, reusable platform modules where CFN YAML/JSON gets unwieldy, since CDK synthesizes to CloudFormation underneath.
      <br><br>For a consulting/platform role serving multiple enterprise clients, fluency in more than one is realistic — client environments vary, and this JD lists all three explicitly.` },
    { q: `How would you design reusable platform modules/reference architectures for IaC that multiple teams or client engagements can consume?`,
      a: `Modules scoped to a coherent unit of infrastructure ("secure VPC", "standard ECS service") with sensible defaults but genuinely configurable inputs for real variance — not so rigid every consumer forks it, not so configurable it's just raw resources with extra steps.
      <br><br><strong>Versioned</strong> (semantic versioning on the module) so consumers pin to a known-good version and upgrade deliberately, via a private module registry or tagged Git releases rather than everyone copy-pasting module code around — which is exactly how drift and unpatched issues accumulate silently.` },
    { q: `What's your approach to managing Terraform state safely in a team/enterprise environment?`,
      a: `<strong>Remote state</strong> (S3 backend with DynamoDB for locking is the classic AWS-native pattern, or Terraform Cloud) — never local state for anything beyond solo experimentation, since local state can't be safely shared and is a single point of data loss.
      <br><br>State locking is non-negotiable for team use — without it, concurrent applies corrupt state. Separate state files per logical environment/component (not one monolithic state) limits blast radius and speeds up plan/apply for teams working on one piece.` },
    { q: `How would you structure a CI/CD pipeline specifically for Terraform/IaC changes, including the governance/approval piece?`,
      a: `Plan-then-apply as separate stages, plan output posted somewhere reviewable (a PR comment, a pipeline artifact) before a human approves the apply — nobody should be surprised by what an apply actually changes.
      <br><br><strong>Policy-as-code</strong> (Sentinel for TFC/E, or OPA/Checkov as tool-agnostic options) scanning the plan for violations (unencrypted resources, overly permissive security groups, missing tags) automatically before human review. Separate pipelines/permissions per environment so a dev change doesn't share prod's apply credentials.` },
    { q: `How do you handle drift between what's declared in IaC and what actually exists in the AWS environment?`,
      a: `Regular drift detection (a scheduled <code>terraform plan</code> with no intended changes, checked for unexpected diffs — or CloudFormation's native drift detection) rather than discovering it only when the next real plan looks surprising.
      <br><br>When found, the investigation matters as much as the fix — an emergency manual change during an incident should be reconciled back into IaC promptly; recurring drift reveals the module doesn't actually control everything it should. Worth a hard rule: no manual console changes to IaC-managed resources outside a genuine break-glass emergency.` },
    { q: `How would you approach IaC for a multi-account/multi-region enterprise deployment — is it one big configuration, or something more modular?`,
      a: `Modular by account/environment/region, composed from shared reusable modules, rather than one giant configuration expressing the whole enterprise topology at once — operationally risky (a single apply touching everything) and slow to plan.
      <br><br>A higher-level orchestration layer (Terraform workspaces, a CI/CD pipeline matrix, or CDK Pipelines/StackSets) coordinates deploying the modular pieces to each target account/region in order, with account/region-specific variables layered on shared module defaults.` },
    { q: `Walk through Terraform state file management in detail — where it's stored, how locking works, what you'd do if it got corrupted or out of sync with reality.`,
      a: `State lives in the configured backend (S3 with DynamoDB locking is the standard AWS-native pattern) as a JSON representation of every resource Terraform manages and its last-known attributes. Locking (via the DynamoDB table) prevents two concurrent applies from corrupting it simultaneously — a lock left stuck after a crashed run is a real, if rare, operational annoyance (<code>terraform force-unlock</code> after confirming no run is actually in progress).
      <br><br>If state gets out of sync with reality (a manual change, or state lost/corrupted): <code>terraform plan</code> surfaces the drift; for lost state specifically, <code>terraform import</code> rebuilds state entries for existing resources one at a time — tedious but recoverable, which is exactly why remote state with S3 versioning enabled matters, so you can roll back to a last-known-good state file as a last resort.` },
    { q: `How would you design a Terraform backend and workspace strategy for a multi-account AWS Organization specifically?`,
      a: `Separate state files per account/environment — not Terraform workspaces sharing one backend config for genuinely different environments, since workspaces suit smaller variations within one environment better than isolating production from dev. A dedicated shared-services account often hosts the S3 backend bucket and DynamoDB lock table that all other accounts' pipelines write to, with cross-account bucket policies granting each account's CI/CD role write access only to its own state path/prefix.` },
    { q: `How does Terraform assume cross-account IAM roles to provision resources across multiple AWS accounts — walk through the mechanics?`,
      a: `A provider block (or multiple aliased provider blocks, one per target account) configured with <code>assume_role</code>, pointing at a role ARN in the target account. The identity actually running Terraform (typically a CI/CD pipeline's role) needs <code>sts:AssumeRole</code> permission on that target role, and the target role's trust policy needs to explicitly allow being assumed by that specific source role/account.
      <br><br>For many-account setups, this is usually generated/templated rather than hand-written per account, so onboarding a new account is a config addition, not a bespoke Terraform change.` },
    { q: `If you've mostly worked with existing Terraform rather than designing it from scratch, how do you talk about that experience convincingly rather than defensively?`,
      a: `Be specific about what "working with existing Terraform" actually involved — reading and understanding module structure well enough to safely extend it, resolving a real state or plan-diff issue, adding a new resource within an established pattern, reviewing colleagues' changes. That's genuine, demonstrable skill even without having authored the original module design.
      <br><br>The honest framing is "I've operated within and extended an existing Terraform codebase" — not overclaiming greenfield design experience, and not underselling real hands-on skill as "I just ran commands" either.` }
  ]
},
{
  id: 'cicd-devsecops',
  title: 'CI/CD & DevSecOps',
  tag: 'CI/CD',
  items: [
    { q: `How would you design an enterprise CI/CD pipeline incorporating automated testing, security scanning, and deployment governance — walk through the stages.`,
      a: `Source → build/unit test → static/security scanning (SAST, dependency/SCA, IaC scanning if infra changes are included) → artifact publish (ECR/Artifactory) → deploy to a lower environment → automated integration/smoke tests → a governance gate (automated policy checks plus human approval for production) → deploy to production, ideally progressive (canary/blue-green) rather than a single big-bang cutover.
      <br><br>Each stage should fail fast with actionable feedback — a security scan that just says "failed" with no specifics gets ignored or routed around.` },
    { q: `GitHub Actions vs. Jenkins vs. GitLab CI vs. AWS CodePipeline — how would you decide which fits a given client engagement?`,
      a: `<strong>GitHub Actions/GitLab CI</strong> when source control is already there and native integration matters most, without standing up separate CI infra. <strong>Jenkins</strong> for existing investment/expertise or genuinely complex custom pipeline needs, at the cost of Jenkins itself now being infrastructure you own. <strong>CodePipeline</strong> when deep native AWS integration matters most (CodeBuild/CodeDeploy/CloudFormation, IAM-based permissions instead of separate CI credentials) and the org is comfortable being AWS-native for pipeline tooling too.
      <br><br>As with IaC, a consulting/platform role realistically needs fluency across more than one given varying client environments.` },
    { q: `How would you integrate security scanning into a CI/CD pipeline without it becoming a bottleneck developers route around?`,
      a: `Gate on new/high-severity findings introduced by the current change rather than blocking every build on the entire legacy backlog, run scans in parallel with other stages where possible, and make findings actionable — specific file/line, clear remediation guidance, not a wall of undifferentiated output.
      <br><br>A defined exception/waiver process for genuine false positives or accepted risk, reviewed and time-boxed, so legitimate edge cases don't quietly train people to distrust or bypass the scanner.` },
    { q: `What does "deployment governance" mean concretely in a pipeline, and how would you implement it?`,
      a: `Explicit approval gates for production (who can approve, logged/auditable), environment-specific credentials so a pipeline against dev genuinely cannot deploy to production without the proper stage, deployment windows/freeze periods enforced where the business needs them, and a complete audit trail — what was deployed, by whom/what process, when, and what the previous version was for rollback.` },
    { q: `How would you design a rollback strategy as part of the CI/CD pipeline itself, not as an afterthought?`,
      a: `A deployment strategy with rollback built in from the start — blue-green (instant traffic cutover back) or canary (halt and revert before full rollout on bad early signals) rather than in-place rolling updates that make "what does rollback even mean here" a harder question mid-incident.
      <br><br>Automated rollback triggers tied to concrete health signals (error rate, latency) post-deployment, not solely relying on a human noticing — the first few minutes after a deploy are exactly when automated safety nets matter most.` },
    { q: `How would you handle CI/CD pipeline design differently for infrastructure changes (Terraform/CloudFormation) versus application code changes?`,
      a: `Infrastructure changes warrant a more conservative gate — a human-reviewed plan/preview step is closer to mandatory, given the blast radius of a bad infra change (potentially the networking/security posture underneath many services at once, versus one service for a bad app deploy).
      <br><br>Application pipelines can lean more toward progressive automated rollout with fast automated rollback, since the blast radius per bad deploy is more contained and rolling back a container image is faster and lower-risk than reversing an infrastructure change.` }
  ]
},
{
  id: 'monitoring',
  title: 'Monitoring, Observability & Logging',
  tag: 'OBSERVABILITY',
  items: [
    { q: `How would you design a CloudWatch-centric monitoring strategy for an enterprise integration platform spanning API Gateway, Lambda, ECS, and third-party connectivity?`,
      a: `Per-service dashboards from the relevant golden signals (API Gateway: 4xx/5xx, latency; Lambda: invocations, errors, duration, throttles, concurrency; ECS: task health, CPU/memory), plus a higher-level <strong>"integration health"</strong> dashboard rolling up end-to-end flow status — stuck transactions, ERP connectivity status — since a stakeholder or on-call engineer needs the business-level view, not twelve dashboards to mentally correlate themselves.` },
    { q: `What would you actually use CloudTrail for operationally, beyond just "it's required for compliance"?`,
      a: `Security investigation (who did what, when, from where — essential for any incident involving unexpected changes or suspicious access), operational troubleshooting (a resource was deleted or a config changed and nobody remembers — CloudTrail answers definitively rather than relying on tribal memory), and as an input to automated detection — CloudTrail events feeding EventBridge rules that alert on sensitive actions (an SCP modified, logging disabled, a new admin IAM user created) near-real-time rather than discovered days later in a log review.` },
    { q: `How would you design centralized logging across a multi-account, multi-service architecture?`,
      a: `A dedicated logging/security account receiving CloudTrail and CloudWatch Logs from all member accounts (cross-account log delivery, or a centralized S3 bucket with appropriate policies) rather than logs scattered per-account, where a compromised or accidentally-deleted account could destroy its own audit trail.
      <br><br><strong>Structured logging</strong> (JSON, not free-text) from applications specifically, so downstream tooling — CloudWatch Logs Insights, or an external platform like Splunk/OpenSearch/Datadog — can actually query and correlate rather than grep-and-hope.` },
    { q: `When would you bring in a third-party observability platform (Grafana, Prometheus, Datadog, Splunk, OpenSearch) on top of native CloudWatch, rather than staying CloudWatch-native?`,
      a: `When you need one pane of glass across multiple clouds or cloud + on-prem (relevant again given hybrid ERP connectivity), when CloudWatch's dashboarding/query capability genuinely falls short (Grafana's dashboarding and PromQL are considerably more flexible), or when the org already has organizational investment in one of these and consistency across their broader estate matters more than being purely AWS-native.
      <br><br>The tradeoff is real operational cost — running Prometheus, or Datadog/Splunk licensing — that needs to be justified by an actual gap CloudWatch doesn't close.` },
    { q: `How would you design alerting so the right people get paged for the right things across a platform this broad?`,
      a: `Alert routing tied to actual ownership (the team/rotation that can act on a given alert, not a single catch-all channel everyone half-monitors), severity-tiered (page for business-impacting, ticket for degraded-but-functioning, dashboard-only for informational), and — specifically for an integration-heavy platform — alerts that distinguish <strong>"our infrastructure is unhealthy"</strong> from <strong>"a third-party/ERP dependency is unhealthy,"</strong> since the response and owning team likely differ even though both look like "the integration is failing" naively.` },

{
  id: 'containers',
  title: 'Containers, Kubernetes & Helm',
  tag: 'K8S / HELM',
  items: [
    { q: `How would you approach service mesh adoption (if at all) for a microservices architecture on ECS/EKS?`,
      a: `A service mesh (App Mesh, or Istio/Linkerd on EKS) adds real value for consistent mTLS between services, fine-grained traffic control (canary routing, circuit breaking) at the network layer, and unified cross-service observability — but it's genuine operational complexity that isn't justified for a handful of services.
      <br><br>Reasonable default: don't reach for one until the number of services and the specific cross-cutting need — not "microservices" as a buzzword — actually justifies the operational cost of running and understanding it.` },
    { q: `What's your approach to container image security for a platform running many microservices?`,
      a: `Standardized, minimal base images (distroless/slim variants reduce attack surface) maintained centrally rather than each team choosing its own, scanning integrated into CI/CD and the registry (ECR scanning), and running containers as <strong>non-root by default</strong> — worth enforcing as a standard even on ECS/EKS, where it isn't forced by the platform the way it is on OpenShift.` },
    { q: `How would you design service-to-service communication and discovery for a microservices architecture on ECS/EKS?`,
      a: `ECS Service Connect or Cloud Map for service discovery on ECS, Kubernetes-native DNS-based discovery on EKS — either way, services discover each other by logical name, never hardcoded IPs, so scaling/rescheduling doesn't break connectivity. For synchronous calls, an internal ALB or the service mesh (if adopted) handles load balancing and can add retry/timeout/circuit-breaking consistently rather than each service reinventing its own.` },
    { q: `How would you decide whether a given piece of functionality should be a new microservice versus added to an existing one?`,
      a: `Genuine independent scaling/deployment needs, a clear bounded-context boundary, or a distinct reliability/security profile are real reasons to split. "It felt like it should be its own service" without one of those concrete drivers usually just adds operational overhead (another thing to deploy, monitor, secure) without a corresponding benefit — premature microservice-ing is a common architecture mistake worth explicitly guarding against.` },
    { q: `What's Helm, and how would you use it to manage application deployments on EKS specifically?`,
      a: `Helm is Kubernetes' package manager — a <strong>chart</strong> packages a set of Kubernetes manifests (Deployments, Services, ConfigMaps, etc.) as a templated, versioned, reusable unit, with values overridden per environment rather than maintaining separate copies of raw YAML per environment.
      <br><br>On EKS specifically: charts typically live in a chart repository (or a Git repo with a defined structure), deployed via <code>helm upgrade --install</code> from CI/CD rather than manually, with <code>helm rollback</code> giving a fast, tested rollback path tied to release history — genuinely useful during an incident, not just a deployment convenience.` },
    { q: `Walk through Kubernetes Service types — ClusterIP, NodePort, LoadBalancer — when do you use each?`,
      a: `<strong>ClusterIP</strong> (the default) for internal-only service-to-service communication within the cluster — the vast majority of services in a typical setup. <strong>NodePort</strong> exposes a service on a static port on every node's IP — rarely used directly in production on EKS, mostly a building block. <strong>LoadBalancer</strong> provisions an actual cloud load balancer (an ALB/NLB via the AWS Load Balancer Controller) — the standard way to expose a service externally, usually fronted further by Ingress for HTTP-layer routing across multiple services sharing one load balancer.` },
    { q: `How does Ingress work on EKS, and how would you design it for multiple applications sharing a cluster?`,
      a: `Ingress defines HTTP(S) routing rules (host/path-based) to internal Services, implemented by an Ingress Controller — on EKS, typically the AWS Load Balancer Controller, which provisions and manages an ALB satisfying the Ingress resource's routing rules.
      <br><br>For multiple applications sharing a cluster: one shared ALB with path/host-based routing to each application's Service (cost-efficient, one load balancer) versus one ALB per application (more isolation, more cost) — the choice depends on how much traffic-management/security isolation each application genuinely needs versus just minimizing load balancer sprawl.` },
    { q: `What's CNI, and why does it matter for network policy enforcement in Kubernetes?`,
      a: `The Container Network Interface is the plugin layer responsible for actually wiring up pod networking — assigning IPs, setting up routing so pods can reach each other and external services. On EKS, the default is the <strong>Amazon VPC CNI</strong>, which assigns pods real VPC IP addresses rather than an overlay network — which is why pod IP exhaustion in a subnet is a real, distinctive EKS capacity-planning concern most generic Kubernetes advice doesn't mention.
      <br><br>It matters for NetworkPolicy specifically because <strong>not every CNI enforces NetworkPolicy</strong> — the base VPC CNI historically needed an add-on (or a different CNI like Calico) to actually enforce the policies you define, versus accepting them silently and doing nothing. Worth knowing this distinction if asked whether NetworkPolicies "just work" on EKS.` },
    { q: `How do you manage configuration (ConfigMaps and Secrets) across environments in Kubernetes?`,
      a: `ConfigMaps for non-sensitive config (feature flags, environment-specific URLs, log levels), Secrets for sensitive values — though raw Kubernetes Secrets are only base64-encoded, not encrypted, by default, so for anything genuinely sensitive, integrating with a real secrets manager (AWS Secrets Manager or Parameter Store via the External Secrets Operator, syncing into Kubernetes Secrets) is more defensible than storing sensitive values as raw K8s Secrets checked into a values file.
      <br><br>Per-environment values layered through Helm's values files (or Kustomize overlays) rather than maintaining fully separate manifest sets per environment, so the actual application definition stays single-sourced.` },
    { q: `Walk through troubleshooting a pod that can't reach another service in the same cluster — where do you look, in order?`,
      a: `Confirm the target Service and its Endpoints actually exist and have healthy pod IPs behind them (<code>kubectl get endpoints</code> — a Service with zero endpoints because its label selector doesn't match any running pod is one of the most common causes and easy to miss). Confirm DNS resolution of the service name from inside the calling pod. Check NetworkPolicy — if one exists and the CNI actually enforces it (see above) but doesn't explicitly allow this traffic, it's silently dropped rather than erroring clearly.
      <br><br>Then the target pod's own readiness — a pod that's Running but failing its readiness probe gets pulled out of the Service's endpoints entirely, which looks identical to a networking problem from the caller's side.` }
  ]
},

let masteryState = {};

function toggleCard(id) {
  const card = document.getElementById('card-' + id);
  if (card) card.classList.toggle('open');
}

async function loadMastery() {
  try {
    const res = await window.storage.get(STORAGE_KEY, false);
    if (res && res.value) masteryState = JSON.parse(res.value);
  } catch (e) {
    masteryState = {};
  }
  Object.keys(masteryState).forEach(id => {
    if (!masteryState[id]) return;
    const cb = document.getElementById('cb-' + id);
    const card = document.getElementById('card-' + id);
    if (cb) cb.checked = true;
    if (card) card.classList.add('mastered');
  });
  updateAllProgress();
}

async function saveMastery() {
  try {
    await window.storage.set(STORAGE_KEY, JSON.stringify(masteryState), false);
  } catch (e) { /* best effort */ }
}

function toggleMastery(id) {
  masteryState[id] = !masteryState[id];
  saveMastery();
  const card = document.getElementById('card-' + id);
  if (card) card.classList.toggle('mastered', !!masteryState[id]);
  updateAllProgress();
  applyFilters();
}

function updateAllProgress() {
  let masteredTotal = 0, itemTotal = 0;
  DATA.forEach(cat => {
    let masteredCat = 0;
    cat.items.forEach((item, i) => {
      const id = cat.id + '-' + i;
      itemTotal++;
      if (masteryState[id]) { masteredCat++; masteredTotal++; }
    });
    const navCount = document.getElementById('navcount-' + cat.id);
    if (navCount) navCount.textContent = masteredCat + '/' + cat.items.length;
  });
  const pct = itemTotal ? Math.round((masteredTotal/itemTotal)*100) : 0;
  const fill = document.getElementById('progressFill');
  if (fill) fill.style.width = pct + '%';
  const label = document.getElementById('progressLabel');
  if (label) label.textContent = masteredTotal + '/' + itemTotal + ' reviewed (' + pct + '%)';
  const sideLabel = document.getElementById('progressSideLabel');
  if (sideLabel) sideLabel.textContent = masteredTotal + ' of ' + itemTotal + ' reviewed';
}

function renderNav() {
  const nav = document.getElementById('navlist');
  let html = '';
  DATA.forEach(cat => {
    html += `<a href="#cat-${cat.id}" class="navlink" id="nav-${cat.id}">
      <span class="navtitle">${cat.title}</span>
      <span class="navcount" id="navcount-${cat.id}">0/${cat.items.length}</span>
    </a>`;
  });
  html += `<hr class="navdivider"><a href="#cat-ask" class="navlink" id="nav-ask"><span class="navtitle">Questions to Ask</span></a>`;
  nav.innerHTML = html;
}

function renderAll() {
  const main = document.getElementById('content');
  let html = '';
  DATA.forEach(cat => {
    html += `<section class="category" id="cat-${cat.id}">`;
    html += `<div class="cat-head"><span class="cat-tag">${cat.tag}</span><h2>${cat.title}</h2></div>`;
    cat.items.forEach((item, i) => {

      const behavioralClass = cat.behavioral ? ' behavioral' : '';

      html += `<div class="card${behavioralClass}" id="card-${id}">
          <div class="card-head" onclick="toggleCard('${id}')" role="button" tabindex="0" onkeydown="if(event.key==='Enter'){toggleCard('${id}')}">
            <span class="qnum">Q${i+1}</span>
            <span class="qtext">${item.q}</span>
            <label class="mastery" onclick="event.stopPropagation()">
              <input type="checkbox" id="cb-${id}" onchange="toggleMastery('${id}')"> Got it
            </label>
            <span class="chev">▶</span>
          </div>
          <div class="card-body" id="body-${id}">
            ${starBadge}
            <div class="answer">${item.a}</div>
          </div>
        </div>`;
    });
    html += `</section>`;
  });
  main.innerHTML = html;
}

function renderAsk() {

    html += `<div class="ask-card">
      <div class="ask-q">${i+1}. ${item.q}</div>
      <div class="ask-why">${item.why}</div>

  });
  el.innerHTML = html;
}

function applyFilters() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const focusMode = document.getElementById('focusToggle').checked;
  DATA.forEach(cat => {
    let catVisibleCount = 0;
    cat.items.forEach((item, i) => {
      const id = cat.id + '-' + i;
      const card = document.getElementById('card-' + id);
      if (!card) return;
      const text = (item.q + ' ' + item.a).toLowerCase();
      const matchesSearch = !q || text.includes(q);
      const matchesFocus = !focusMode || !masteryState[id];
      const visible = matchesSearch && matchesFocus;
      card.style.display = visible ? '' : 'none';
      if (visible) catVisibleCount++;
    });
    const section = document.getElementById('cat-' + cat.id);
    if (section) section.style.display = catVisibleCount > 0 ? '' : 'none';
    const navLink = document.getElementById('nav-' + cat.id);
    if (navLink) navLink.style.display = catVisibleCount > 0 ? '' : 'none';
  });
}

document.addEventListener('DOMContentLoaded', function() {
  renderNav();
  renderAll();
  renderAsk();
  loadMastery();
  document.getElementById('search').addEventListener('input', applyFilters);
  document.getElementById('focusToggle').addEventListener('change', applyFilters);
});
</script>
</body>
</html>

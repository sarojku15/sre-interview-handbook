  DATA[tabIdx].groups.forEach((g, gi) => {
    g.items.forEach((it, ii) => {
      items.push({...it, group:g.name, id: 't'+tabIdx+'-g'+gi+'-i'+ii});
    });
  });
  return items;
}

function totalCount(){
  let t=0, m=0;
  DATA.forEach((tab,ti)=>{ allItems(ti).forEach(it=>{ t++; if(mastered.has(it.id)) m++; }); });
  return {t,m};
}

function esc(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function highlight(text, term){
  if(!term) return text;
  const idx = text.toLowerCase().indexOf(term.toLowerCase());
  if(idx === -1) return text;
  return text.slice(0,idx) + '<mark>' + text.slice(idx, idx+term.length) + '</mark>' + text.slice(idx+term.length);
}

function renderAnswer(text){
  const esced = esc(text);
  // fenced code blocks not used; render plain paragraph, but detect inline code-like lines with leading Get-/import/def/etc handled as prose.
  return '<p>' + esced.replace(/\n\n/g,'</p><p>') + '</p>';
}

function renderTabList(){
  const el = document.getElementById('tablist');
  el.innerHTML = '';
  DATA.forEach((tab, i) => {
    const items = allItems(i);
    const btn = document.createElement('button');
    btn.className = 'tabbtn' + (i===activeTab ? ' active' : '');
    btn.innerHTML = '<span class="ic">'+tab.icon+'</span><span>'+tab.tab+'</span><span class="cnt">'+items.length+'</span>';
    btn.onclick = () => { activeTab = i; activePill=null; searchTerm=''; document.getElementById('search').value=''; openCards.clear(); render(); };
    el.appendChild(btn);
  });
}

function renderPills(){
  const el = document.getElementById('pills');
  el.innerHTML = '';
  const groups = DATA[activeTab].groups;
  if(groups.length <= 1){ el.style.display='none'; return; }
  el.style.display='flex';
  const allPill = document.createElement('button');
  allPill.className = 'pill' + (activePill===null ? ' active':'');
  allPill.textContent = 'All';
  allPill.onclick = () => { activePill=null; render(); };
  el.appendChild(allPill);
  groups.forEach(g=>{
    const p = document.createElement('button');
    p.className = 'pill' + (activePill===g.name ? ' active':'');
    p.textContent = g.name + ' (' + g.items.length + ')';
    p.onclick = () => { activePill = (activePill===g.name? null : g.name); render(); };
    el.appendChild(p);
  });
}

function matchesSearch(it, term){
  if(!term) return true;
  const t = term.toLowerCase();
  return it.q.toLowerCase().includes(t) || it.a.toLowerCase().includes(t);
}

function renderList(){
  const el = document.getElementById('list');
  el.innerHTML = '';
  let items = allItems(activeTab);
  if(activePill) items = items.filter(it => it.group === activePill);
  if(searchTerm) items = items.filter(it => matchesSearch(it, searchTerm));
  if(unmasteredOnly) items = items.filter(it => !mastered.has(it.id));

  if(items.length === 0){
    el.innerHTML = '<div class="empty">No questions match the current filter.</div>';
    return;
  }

  let lastGroup = null;
  items.forEach(it => {
    if(it.group !== lastGroup && !activePill){
      const gt = document.createElement('div');
      gt.className = 'grouptitle';
      gt.textContent = it.group;
      el.appendChild(gt);
      lastGroup = it.group;
    }
    const card = document.createElement('div');
    card.className = 'card' + (openCards.has(it.id) ? ' open':'');
    const isM = mastered.has(it.id);
    card.innerHTML = `
      <div class="cardhead">
        <div class="chk ${isM?'on':''}" data-id="${it.id}">${isM?'&#10003;':''}</div>
        <div class="qtext">${highlight(esc(it.q), searchTerm)}</div>
        <div class="caret">&#9654;</div>
      </div>
      <div class="cardbody">${renderAnswer(it.a)}</div>
    `;
    card.querySelector('.chk').onclick = (e) => {
      e.stopPropagation();
      if(mastered.has(it.id)) mastered.delete(it.id); else mastered.add(it.id);
      saveMastery();
      render();
    };
    card.querySelector('.cardhead').onclick = () => {
      if(openCards.has(it.id)) openCards.delete(it.id); else openCards.add(it.id);
      render();
    };
    el.appendChild(card);
  });
}

function renderStats(){
  const items = allItems(activeTab);
  const m = items.filter(it => mastered.has(it.id)).length;
  document.getElementById('statlabel').textContent = m + ' / ' + items.length + ' mastered in this topic';
  document.getElementById('progfill').style.width = (items.length? (m/items.length*100):0) + '%';
  const {t, m:mt} = totalCount();
  document.getElementById('overalllabel').textContent = mt + ' / ' + t + ' overall';
}

function renderHead(){
  const tab = DATA[activeTab];
  document.getElementById('tabh1').textContent = tab.icon + '  ' + tab.tab;
  document.getElementById('tabsub').textContent = tab.groups.length + ' group' + (tab.groups.length>1?'s':'') + ' · ' + allItems(activeTab).length + ' questions';
}

function updateExpandAllLabel(){
  const items = allItems(activeTab);
  let visible = items;
  if(activePill) visible = visible.filter(it=>it.group===activePill);
  if(searchTerm) visible = visible.filter(it=>matchesSearch(it, searchTerm));
  if(unmasteredOnly) visible = visible.filter(it=>!mastered.has(it.id));
  const allOpen = visible.length>0 && visible.every(it=>openCards.has(it.id));
  document.getElementById('expandall').textContent = allOpen ? 'Collapse All' : 'Expand All';
  document.getElementById('expandall').dataset.state = allOpen ? 'open' : 'closed';
}

function render(){
  renderTabList();
  renderPills();
  renderHead();
  renderList();
  renderStats();
  updateExpandAllLabel();
}

document.getElementById('search').addEventListener('input', (e)=>{
  searchTerm = e.target.value;
  render();
});

document.getElementById('expandall').addEventListener('click', ()=>{
  let items = allItems(activeTab);
  if(activePill) items = items.filter(it=>it.group===activePill);
  if(searchTerm) items = items.filter(it=>matchesSearch(it, searchTerm));
  if(unmasteredOnly) items = items.filter(it=>!mastered.has(it.id));
  const state = document.getElementById('expandall').dataset.state;
  if(state === 'open'){
    items.forEach(it=>openCards.delete(it.id));
  } else {
    items.forEach(it=>openCards.add(it.id));
  }
  render();
});

document.getElementById('unmasteredonly').addEventListener('click', (e)=>{
  unmasteredOnly = !unmasteredOnly;
  e.target.classList.toggle('on', unmasteredOnly);
  render();
});

document.getElementById('resetbtn').addEventListener('click', ()=>{
  if(confirm('Reset all mastery progress? This clears your checkmarks for every topic.')){
    mastered = new Set();
    saveMastery();
    render();
  }
});

document.getElementById('themebtn').addEventListener('click', ()=>{
  const root = document.documentElement;
  const cur = root.getAttribute('data-theme');
  if(cur === 'light'){ root.setAttribute('data-theme','dark'); }
  else if(cur === 'dark'){ root.removeAttribute('data-theme'); }
  else { root.setAttribute('data-theme','light'); }
});

render();
</script>
</body>
</html>

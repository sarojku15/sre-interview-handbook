<!DOCTYPE html>

<title>Senior DevOps Engineer — Ansible &amp; On-Prem Interview Prep</title>
<style>
  :root {
    --bg: #0a0e14;
    --panel: #10151f;
    --panel2: #131a26;
    --border: #232b3a;
    --text: #d6dee8;
    --text-dim: #8b98ab;
    --accent: #3ddc97;
    --accent2: #5eb1ff;
    --warn: #ffb454;
    --danger: #ff6b7a;
    --code-bg: #0d1420;
    --font-mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--text); font-family:var(--font-sans); }
  body { display:flex; min-height:100vh; }

  /* Sidebar */
  #sidebar {
    width: 250px; min-width:250px; background:var(--panel); border-right:1px solid var(--border);
    padding: 16px 0; position: sticky; top:0; height:100vh; overflow-y:auto;
  }
  #sidebar .brand { padding: 0 16px 14px 16px; border-bottom:1px solid var(--border); margin-bottom:10px; }
  #sidebar .brand h1 { font-size:14px; margin:0 0 4px 0; color:var(--accent); letter-spacing:0.5px; }
  #sidebar .brand p { font-size:11px; color:var(--text-dim); margin:0; }
  .tab-btn {
    display:flex; justify-content:space-between; align-items:center;
    width:100%; text-align:left; background:none; border:none; color:var(--text-dim);
    padding: 9px 16px; font-size:12.5px; cursor:pointer; font-family:var(--font-sans);
    border-left:3px solid transparent;
  }
  .tab-btn:hover { background:var(--panel2); color:var(--text); }
  .tab-btn.active { background:var(--panel2); color:var(--accent); border-left-color:var(--accent); font-weight:600; }
  .tab-btn .cnt { font-size:10.5px; color:var(--text-dim); background:var(--bg); padding:1px 6px; border-radius:8px; }
  .tab-btn.active .cnt { color:var(--accent); }

  /* Main */
  #main { flex:1; padding: 0 26px 60px 26px; max-width: 980px; }
  .controls-wrap {
    position: sticky; top:0; background:var(--bg); padding: 16px 0 10px 0; z-index:15;
    border-bottom:1px solid var(--border);
  }
  .controls-row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
  #search {
    flex:1; min-width:200px; background:var(--panel); border:1px solid var(--border); color:var(--text);
    padding:9px 12px; border-radius:6px; font-size:13px; font-family:var(--font-sans);
  }
  #search:focus { outline:none; border-color:var(--accent2); }
  button.ctrl {
    background:var(--panel); border:1px solid var(--border); color:var(--text-dim);
    padding:9px 13px; border-radius:6px; font-size:12px; cursor:pointer; white-space:nowrap;
  }
  button.ctrl:hover { color:var(--text); border-color:var(--accent2); }
  button.ctrl.active-toggle { color:var(--accent); border-color:var(--accent); }
  .pills { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .pill {
    background:var(--panel); border:1px solid var(--border); color:var(--text-dim);
    padding:5px 11px; border-radius:14px; font-size:11.5px; cursor:pointer;
  }
  .pill:hover { color:var(--text); }
  .pill.active { background:rgba(61,220,151,0.12); border-color:var(--accent); color:var(--accent); }
  .stat-bar { display:flex; align-items:center; gap:12px; font-size:11.5px; color:var(--text-dim); }
  .stat-bar .track { flex:1; height:5px; background:var(--panel2); border-radius:3px; overflow:hidden; }
  .stat-bar .fill { height:100%; background:var(--accent); width:0%; transition:width 0.3s; }

  /* Cards */
  #list { padding-top: 18px; }
  .tab-heading { font-size:18px; color:var(--text); margin: 6px 0 4px 0; }
  .tab-sub { font-size:12px; color:var(--text-dim); margin-bottom:16px; }
  .card {
    background:var(--panel); border:1px solid var(--border); border-radius:8px;
    margin-bottom:10px; overflow:hidden;
  }
  .card-head {
    display:flex; align-items:flex-start; gap:10px; padding:13px 14px; cursor:pointer;
  }
  .card-head:hover { background:var(--panel2); }
  .mastery-check { margin-top:3px; width:15px; height:15px; accent-color:var(--accent); cursor:pointer; flex-shrink:0; }
  .card-q { flex:1; font-size:13.5px; color:var(--text); line-height:1.5; }
  .badges { display:flex; gap:5px; margin-top:6px; flex-wrap:wrap; }
  .badge { font-size:9.5px; padding:2px 7px; border-radius:9px; font-weight:600; letter-spacing:0.3px; }
  .badge.tricky { background:rgba(255,180,84,0.15); color:var(--warn); }
  .badge.realtime { background:rgba(94,177,255,0.15); color:var(--accent2); }
  .badge.group { background:var(--panel2); color:var(--text-dim); }
  .chevron { color:var(--text-dim); font-size:12px; transition:transform 0.2s; margin-top:3px; }
  .card.expanded .chevron { transform:rotate(90deg); }
  .card-body { display:none; padding: 0 14px 16px 39px; }
  .card.expanded .card-body { display:block; }
  .card-answer { font-size:13px; line-height:1.65; color:var(--text-dim); white-space:pre-wrap; }
  .card-code {
    background:var(--code-bg); border:1px solid var(--border); border-radius:6px;
    padding:12px 14px; margin-top:12px; font-family:var(--font-mono); font-size:12px;
    color:var(--accent); overflow-x:auto; white-space:pre;
  }
  mark { background:rgba(255,180,84,0.35); color:inherit; border-radius:2px; }
  .empty-state { text-align:center; padding:60px 20px; color:var(--text-dim); font-size:13px; }

  @media (max-width: 860px) {
    body { flex-direction:column; }
    #sidebar { width:100%; height:auto; position:relative; padding:10px 0; overflow-x:auto; white-space:nowrap; }
    .tab-btn { display:inline-flex; width:auto; border-left:none; border-bottom:3px solid transparent; }
    .tab-btn.active { border-left:none; border-bottom-color:var(--accent); }
    #main { padding: 0 14px 40px 14px; max-width:100%; }
    .controls-wrap { position:static; }
  }
</style>

<script>
var ITEMS = [{"tab": "Ansible", "group": "Core Concepts", "tricky": false, "realtime": false, "q": "Walk me through how Ansible actually works under the hood \u2014 no agents, so how does it execute anything on a remote host?", "a": "Ansible is agentless and push-based. The control node connects to the managed node over SSH (or WinRM for Windows), copies small Python modules to a temp directory on the target, executes them, captures JSON output, and cleans up \u2014 unless you use ansible-pull, where the target pulls its own playbook from a repo instead. That's the core distinction interviewers are checking for: no persistent daemon, no polling loop like Chef/Puppet agents. The control node needs Python (or the target does, for module execution) and SSH access with sudo/become rights. I'd add that inventory (static INI/YAML or dynamic, e.g. aws_ec2 plugin) defines what 'remote host' even means, and facts gathering (setup module) runs first unless gather_facts is disabled \u2014 which matters for performance at scale.", "id": "q001"}, {"tab": "Ansible", "group": "Core Concepts", "tricky": true, "realtime": false, "q": "Is Ansible idempotent by default, or is that something you have to build in?", "a": "Trick in the question \u2014 it's neither fully automatic nor something you always have to hand-build. Ansible's built-in modules (yum, apt, file, copy, template, user, service, etc.) are idempotent by design: they check current state before acting and report 'changed: false' if nothing needs to happen. But the moment you drop into shell or command modules, idempotency is entirely on you \u2014 those run every time regardless of state, which is exactly why linting and code review catch raw shell tasks without a 'creates:' or 'when:' guard. I always flag shell/command tasks in review for exactly this reason, and prefer creates=, removes=, or changed_when overrides to make them idempotent explicitly.", "id": "q002"}, {"tab": "Ansible", "group": "Core Concepts", "tricky": true, "realtime": true, "q": "A playbook run shows 40 hosts as 'ok' and 2 as 'changed' on a run you expected to be a complete no-op. How do you investigate, live, on a call?", "a": "First I don't panic-assume drift \u2014 I check what module those 2 tasks touched with -vv or --diff, since diff mode shows exactly what changed (file content, template render, package version). Common real causes: a fact that varies by host (hostname baked into a template, a timestamp, an IP-dependent block), a config-management race where another process modified the file outside Ansible, or genuinely different package/OS versions across those 2 hosts making a version-pinned package task actually install something. I'd run --check --diff against just those 2 hosts with -l to isolate, compare to the other 40, and only then decide if it's expected drift correction (good) or a template bug leaking host-specific data (bug). I'd also check if those 2 hosts have a different group_vars/host_vars override that's legitimately different \u2014 sometimes 'changed' is completely correct and the other 38 were already converged from a prior run.", "id": "q003"}, {"tab": "Ansible", "group": "Playbooks & Roles", "tricky": false, "realtime": false, "q": "How do you structure a large Ansible codebase so it doesn't become unmaintainable across dozens of environments and teams?", "a": "Roles are the unit of reuse \u2014 one role per logical component (nginx, postgres, app-deploy), each with its own tasks/handlers/templates/defaults/vars/meta, following ansible-galaxy's standard directory layout. I keep environment-specific data out of roles entirely and push it into inventory: group_vars/all.yml for global defaults, then group_vars/<env>.yml and host_vars/<host>.yml for overrides, so the same role runs unchanged in dev, UAT, and prod with only variable values differing. For real scale I'd also split site.yml into smaller playbooks per component and use ansible.cfg + roles_path to pull shared roles from a private Galaxy/Artifactory-hosted collection rather than copy-pasting roles between repos \u2014 that's exactly the kind of on-prem tooling this role is asking about.", "id": "q004"}, {"tab": "Ansible", "group": "Playbooks & Roles", "tricky": true, "realtime": true, "q": "You need to restart a service only if a config file actually changed, but only once even if three different tasks touch that file. How?", "a": "Handlers, triggered with notify=, and Ansible automatically deduplicates \u2014 if three tasks all notify 'restart nginx' in the same play, the handler fires exactly once, at the end of the play (or immediately if you call meta: flush_handlers). The tricky part people miss: handlers only run if the notifying task reports changed, and they run in the order they're *defined* in the handlers file, not the order they were notified \u2014 that ordering detail has bitten people when they assume notify order controls execution order. I'd also mention listen: for grouping multiple handler names under one trigger name when several roles need to react to the same event, like a generic 'restart web services' listen topic.", "code": "- name: deploy nginx config\n  template:\n    src: nginx.conf.j2\n    dest: /etc/nginx/nginx.conf\n  notify: restart nginx\n\nhandlers:\n  - name: restart nginx\n    service:\n      name: nginx\n      state: restarted", "id": "q005"}, {"tab": "Ansible", "group": "Playbooks & Roles", "tricky": false, "realtime": false, "q": "What's the difference between vars, defaults, and group_vars/host_vars, and what's the actual precedence order?", "a": "defaults/main.yml inside a role is the lowest precedence \u2014 easily overridden, meant as sane fallback values. vars/main.yml inside a role is higher precedence, meant for values the role author doesn't expect you to casually override. group_vars and host_vars live in inventory and sit above role vars but below play-level vars and extra-vars (-e on the CLI, which always wins). The full official precedence order runs roughly: role defaults \u2192 inventory group_vars/all \u2192 inventory group_vars/<group> \u2192 inventory host_vars \u2192 playbook group_vars/host_vars \u2192 host facts \u2192 play vars \u2192 role vars \u2192 block vars \u2192 task vars \u2192 extra-vars. In practice I keep it simple: defaults for role authors, group_vars/host_vars for environment differences, -e reserved for one-off CLI overrides during troubleshooting, never for anything that should be checked into source control.", "id": "q006"}, {"tab": "Ansible", "group": "Playbooks & Roles", "tricky": true, "realtime": true, "q": "Real scenario: a playbook that's supposed to be safe to re-run keeps failing on step 12 of 20 during a deploy window, and you're under pressure to just get it done. What's your actual move?", "a": "I resist the urge to just re-run blindly and instead run with --start-at-task to resume from step 12 once I understand why it failed \u2014 but only after confirming steps 1-11 are genuinely idempotent, because if any of them aren't, resuming skips state they'd have fixed. I'd check --list-tasks first to see the exact task name, then look at the actual error rather than assume. If it's a transient issue (network blip, package mirror timeout) I'd just retry that task. If it's a real config problem, I fix the role and do a full --check --diff dry run before re-applying for real. I'd also mention serial: in the play \u2014 if this were a rolling deploy across many hosts and step 12 failed on host 3 of 50, serial with max_fail_percentage would have already stopped the blast radius rather than me discovering it mid-deploy across all hosts at once.", "id": "q007"}, {"tab": "Ansible", "group": "Playbooks & Roles", "tricky": false, "realtime": false, "q": "When would you reach for a role versus a collection versus just a flat playbook?", "a": "Flat playbook for something genuinely one-off or environment-specific that won't be reused. A role once logic needs to be reused across playbooks or projects \u2014 it's the natural reuse boundary in Ansible. A collection once you're packaging multiple related roles, modules, plugins, or filters together for distribution \u2014 typically when a platform team is publishing shared building blocks to the rest of the org via Galaxy or an internal Artifactory/Nexus-backed collection registry, which is exactly the kind of on-prem tooling maturity this JD is pointing at. I've drawn that line before on platform teams: individual app teams write playbooks and lightweight roles; the platform team owns and versions the shared collection everyone consumes.", "id": "q008"}, {"tab": "Ansible", "group": "Vault & Secrets", "tricky": true, "realtime": true, "q": "A junior engineer commits a playbook with a plaintext database password to Git by mistake. What's your real, full response \u2014 not just 'use Vault'?", "a": "Immediate: rotate the credential \u2014 a git revert doesn't remove it from history, it's already compromised the moment it's pushed, so credential rotation is priority one, before anything about the repo. Then I'd scrub history with git filter-repo or BFG if the repo is shared/long-lived, force-push, and notify anyone who may have already pulled. Root cause fix: ansible-vault encrypt the variable file (or per-variable with !vault inline encryption via ansible-vault encrypt_string, which is cleaner for mixed files since only the secret is encrypted, not the whole file), wire the vault password through a vault password file the CI/CD system pulls from a proper secrets store (HashiCorp Vault, Azure Key Vault, AWS Secrets Manager) rather than a static file on disk, and add a pre-commit hook or gitleaks/trufflehog scan in the pipeline so this class of mistake gets caught before merge, not after. I'd treat the incident itself with a short blameless writeup, because the process gap \u2014 no secret-scanning gate \u2014 is the actual fix, not the individual mistake.", "id": "q009"}, {"tab": "Ansible", "group": "Vault & Secrets", "tricky": false, "realtime": false, "q": "How do you manage multiple Vault passwords for different environments without it becoming a mess?", "a": "ansible-vault supports multiple vault IDs, so I'd label them explicitly \u2014 dev, uat, prod \u2014 each with its own password source, and reference vault_identity_list in ansible.cfg or --vault-id on the CLI. Practically: --vault-id prod@prompt for anything sensitive enough to require a human to type it interactively during a prod run, and --vault-id dev@/path/to/script for lower environments where a script can pull it from a secrets manager non-interactively. The real discipline is never letting one password decrypt every environment's secrets \u2014 a leaked dev vault password should never be able to touch prod.", "code": "ansible-vault encrypt_string 'S3cr3t' --vault-id prod@prompt --name 'db_password'\nansible-playbook site.yml --vault-id dev@~/.vault_pass_dev --vault-id prod@prompt", "id": "q010"}, {"tab": "Ansible", "group": "Inventory & Scale", "tricky": true, "realtime": true, "q": "On-prem, no cloud dynamic inventory plugin to lean on \u2014 400 physical/VM hosts, inventory drifts constantly as hosts get added/decommissioned. How do you keep it accurate?", "a": "This is exactly the on-prem gap cloud-native tooling assumes away. My approach: build a lightweight dynamic inventory script (Python, inventory plugin interface) that sources truth from whatever CMDB or asset system already exists on-prem \u2014 could be a simple database, ServiceNow, or even a well-maintained CSV/spreadsheet if that's the org's reality \u2014 rather than trusting a hand-edited static INI file that inevitably goes stale. I'd also add a scheduled job that diffs the inventory script's output against actual reachable hosts (a quick ansible all -m ping -i dynamic_inventory.py) and alerts on hosts that are in inventory but unreachable, or reachable-but-unmanaged hosts that never got added \u2014 that mismatch is usually where decommission and provisioning process gaps actually live. If there's genuinely no CMDB, I'd push for standing one up even minimally, because untracked inventory is the single biggest source of 'why didn't this patch apply everywhere' incidents I've seen.", "id": "q011"}, {"tab": "Ansible", "group": "Inventory & Scale", "tricky": false, "realtime": false, "q": "How do you control blast radius when rolling out a change to hundreds of on-prem servers?", "a": "serial: is the primary lever \u2014 serial: 10 or serial: '20%' processes hosts in batches rather than all-at-once, and combined with max_fail_percentage, the play aborts if failures exceed a threshold instead of grinding through every remaining host in a broken batch. For genuinely risky changes I'll do serial: 1 first against a canary host, validate, then widen. I also lean on tags and --limit heavily during rollout \u2014 limiting to a specific group first (a canary group in inventory) before touching the full fleet, and any_errors_fatal: true when a failure on any host in a batch should stop the whole play rather than continue degrading other hosts in parallel.", "code": "- hosts: web_fleet\n  serial:\n    - 1\n    - 10\n    - \"25%\"\n  max_fail_percentage: 10", "id": "q012"}, {"tab": "Ansible", "group": "Troubleshooting", "tricky": true, "realtime": true, "q": "ansible-playbook hangs indefinitely on one host with no error, no timeout, nothing in -vvv that explains it. What are your hypotheses, in order?", "a": "First hypothesis: it's not Ansible, it's SSH \u2014 a stuck TTY prompt (host key verification, sudo password prompt with become and no password configured, or an interactive script being called by a shell/command task) will hang exactly like this with no useful Ansible-level error. Second: a task genuinely waiting \u2014 a service start that's blocking, a package manager lock held by another process on that host (yum/apt lock file from a manual admin session), or a wait_for task with too generous a timeout. Third, less common but real: ControlPersist SSH multiplexing socket getting into a bad state from a prior interrupted run. My actual live steps: Ctrl+C and check if it's genuinely stuck at a specific task via -vvv output before killing, SSH to that one host manually and check for lock files (/var/lib/dpkg/lock, /var/run/yum.pid), check ps aux for a hung process from the previous task, and check ~/.ansible/cp/ for a stale control socket to remove.", "id": "q013"}, {"tab": "Ansible", "group": "Troubleshooting", "tricky": false, "realtime": false, "q": "Difference between --check mode and --diff, and where does --check mode actually lie to you?", "a": "--check runs a dry-run \u2014 no changes applied, Ansible reports what it would have done. --diff shows the actual before/after content difference for file-based modules (template, copy, lineinfile), and the two are almost always used together: --check --diff. Where --check lies: any task with a when: condition that depends on state --check itself would have created gets evaluated against the *unchanged* real state, so multi-step plays where task 2 depends on task 1's actual effect can report misleadingly \u2014 task 2 might show 'skipped' in check mode even though it would run for real, because task 1 never really executed to satisfy its condition. Modules that genuinely can't simulate (most shell/command tasks, some third-party modules without check_mode support) either skip entirely or, worse, some poorly-written custom modules ignore check_mode and actually execute \u2014 which is a real gotcha to test for before trusting --check output on anything with custom modules in the mix.", "id": "q014"}, {"tab": "Ansible", "group": "Enterprise Ansible", "tricky": false, "realtime": false, "q": "What does Ansible Automation Platform (formerly Tower/AWX) add over raw ansible-playbook that matters for an enterprise on-prem environment?", "a": "RBAC and audit trail \u2014 who ran what playbook against what inventory, when, is a hard compliance requirement most enterprises need and raw CLI Ansible has none of. Centralized credential storage so SSH keys and vault passwords never live on individual engineers' laptops. Scheduling, a REST API for integrating playbook runs into other tooling (like a Jenkins pipeline triggering a Job Template rather than shelling out to ansible-playbook directly), surveys for parameterized self-service runs, and workflow templates for chaining multiple playbooks with conditional branching. For a UK/Poland cross-team setup specifically, the RBAC and audit layer is usually the actual business driver \u2014 it's what lets you delegate 'restart this specific service' to a support team without giving them SSH keys or full playbook authorship rights.", "id": "q015"}, {"tab": "On-Prem DevOps", "group": "Fundamentals", "tricky": true, "realtime": false, "q": "What actually changes in your day-to-day approach going from cloud-native DevOps to on-premises DevOps?", "a": "The honest answer: you lose elasticity as a safety net. In cloud, undersizing a VM or running out of disk is often a one-line fix and a few minutes of reprovisioning; on-prem, capacity is physical and lead-time-bound \u2014 a rack running hot on storage means a procurement conversation, not an API call. So capacity planning becomes a real, ongoing discipline rather than something autoscaling papers over. Second, there's no managed-service safety net \u2014 no RDS, no managed Kubernetes control plane; you own patching the hypervisor, the OS, the database engine, the load balancer firmware, end to end. Third, network and physical topology matter again \u2014 VLANs, physical NICs, SAN/NAS paths, rack-level redundancy \u2014 in a way cloud abstracts away almost entirely. What doesn't change: the CI/CD, IaC, and automation discipline should look the same; the goal on-prem is still to make infrastructure changes repeatable and version-controlled rather than click-ops on a hypervisor console, it's just harder to get there because the tooling ecosystem is thinner.", "id": "q016"}, {"tab": "On-Prem DevOps", "group": "Fundamentals", "tricky": false, "realtime": false, "q": "How do you approach infrastructure-as-code on-prem when you don't have a cloud provider's API to target?", "a": "Terraform actually has solid on-prem providers \u2014 vSphere, libvirt/KVM, and bare-metal providers for things like PXE-boot provisioning, plus providers for on-prem network gear (F5, NetApp, Cisco). Where there's no clean provider, Ansible fills the gap for configuration and even some provisioning via modules that talk to iLO/iDRAC (Dell) or IPMI directly for bare-metal power/boot control. My usual on-prem pattern: Terraform (or a vSphere/vCenter-specific tool) for the VM/resource-pool layer where a provider exists, Ansible for everything above that \u2014 OS config, application deployment, patching \u2014 and PXE + kickstart/preseed or a golden-image pipeline (Packer building on-prem templates) for bare-metal or fresh-VM OS provisioning. The key discipline is the same as cloud: nothing gets changed by logging into vCenter or a server console by hand if it can be codified instead.", "id": "q017"}, {"tab": "On-Prem DevOps", "group": "Fundamentals", "tricky": true, "realtime": true, "q": "A production database server on-prem is out of disk space at 2am and paging you. Cloud instinct says 'resize the volume.' What's actually different here?", "a": "On-prem, resizing usually means extending a LUN on the SAN (if there's headroom in the storage pool) or attaching additional physical/virtual disk, then extending the filesystem and volume group live \u2014 LVM makes this non-disruptive if done right (pvresize, vgextend, lvextend, then resize2fs or xfs_growfs depending on filesystem). But the actual root-cause step matters more here than in cloud: I'd first check what's actually consuming space \u2014 logs, a runaway temp table, orphaned WAL/binlog files \u2014 because on-prem storage isn't 'just add more' the way cloud volumes are; the storage team may not have unlimited headroom in that pool, and I don't want to burn scarce physical capacity plugging a leak that a log-rotation fix would have solved for free. Immediate mitigation (clear safe-to-delete logs, rotate/compress), then the LVM extend if genuinely needed, then a post-incident fix \u2014 log rotation policy, disk-usage alerting at 80% not 95%, and a written runbook so this isn't a 2am judgment call next time.", "id": "q018"}, {"tab": "On-Prem DevOps", "group": "Environment Management", "tricky": false, "realtime": false, "q": "How do you keep dev/UAT/prod environments consistent on-prem when you can't just spin up identical cloud accounts per environment?", "a": "Golden images built once (Packer or a scripted kickstart/preseed process) and promoted through environments rather than hand-built per environment \u2014 that's the single biggest lever for consistency. Same Ansible roles and Terraform modules applied to every environment, with only variable values (group_vars per environment) differing, never different playbook logic per environment \u2014 divergent logic per environment is exactly how 'works in UAT, breaks in prod' happens. I'd also push for environment parity checks \u2014 a scheduled job that diffs installed package versions, config file checksums, and running service versions across environments and flags drift, since on-prem environments drift silently in a way ephemeral cloud environments structurally can't.", "id": "q019"}, {"tab": "On-Prem DevOps", "group": "Environment Management", "tricky": true, "realtime": true, "q": "UAT has been passing for weeks, but the moment a release hits prod it fails \u2014 and prod and UAT are supposedly identical. How do you actually find the difference?", "a": "I don't trust 'supposedly identical' \u2014 I verify it. Concretely: diff installed package versions (rpm -qa or dpkg -l piped to diff between environments), diff config files that Ansible manages versus what's actually on disk (ansible-playbook --check --diff against prod tells you if prod has drifted from the same playbook that built UAT), check for data-volume differences that only manifest at scale (a query that's fine against UAT's small dataset but times out against prod's real volume), and check for environment-specific config that's supposed to differ but might have a wrong value \u2014 a connection pool size, a feature flag, a DNS/hosts entry pointing somewhere stale. In my experience the actual culprit is disproportionately often either a silently-drifted config file that was hand-edited on prod once during an incident and never reconciled back into the playbook, or a data-scale issue UAT's smaller dataset never exercised \u2014 so I check both early rather than assuming it's a code bug.", "id": "q020"}, {"tab": "On-Prem DevOps", "group": "Middleware & App Servers", "tricky": false, "realtime": false, "q": "On-prem environments often still run traditional app servers alongside newer containerized workloads \u2014 what's your approach to bridging both worlds in CI/CD?", "a": "I treat them as two deployment targets behind the same pipeline concept, not two separate pipelines with different quality bars. Build and test stages (Maven build, SonarQube scan, unit/integration tests) stay identical regardless of target. The deployment stage branches: for containerized services, build and push an image, then a Kubernetes/OpenShift deploy step; for traditional middleware (Tomcat, WebLogic, JBoss), the pipeline packages a WAR/EAR and uses Ansible to handle the deploy \u2014 stop service, backup current deployment, drop new artifact, start service, health check, with the same rollback discipline (keep last-known-good artifact) as the container path has via image tags. The goal is that from a release-management view, both paths look like one release train with the same gates \u2014 code quality, security scan, approval \u2014 even though the last-mile mechanics differ.", "id": "q021"}, {"tab": "CI/CD Pipelines", "group": "Pipeline Design", "tricky": false, "realtime": false, "q": "Walk me through how you'd design a CI/CD pipeline from commit to production for a typical enterprise Java service, on-prem-friendly, using tools in this JD.", "a": "Commit triggers the pipeline (Jenkins or Azure DevOps). Stage 1: build with Maven, running unit tests as part of the build lifecycle, failing fast on compile or test failure. Stage 2: static analysis \u2014 SonarQube quality gate, plus a SAST scan; the pipeline fails the build if the quality gate fails, not just reports it. Stage 3: package \u2014 build the artifact, and if containerized, build and tag the Docker image; push both the Maven artifact to Nexus/Artifactory and the image to an internal registry. Stage 4: deploy to a lower environment automatically (dev or UAT), run integration/smoke tests, and if it's a security-sensitive service, a DAST scan against that running environment. Stage 5: promotion to prod is typically gated \u2014 manual approval tied to a change record, especially in a regulated or enterprise on-prem shop \u2014 then deploy via the same artifact that was tested (never rebuild for prod), with a rollback plan (previous artifact version retained in Nexus/registry, deployment strategy that supports quick rollback). I'd instrument the whole pipeline so failures are visible fast and each stage's duration is tracked, because pipeline speed itself becomes a productivity metric worth protecting.", "id": "q022"}, {"tab": "CI/CD Pipelines", "group": "Pipeline Design", "tricky": true, "realtime": true, "q": "A pipeline goes green \u2014 all stages pass, artifact deployed \u2014 but the application is actually broken in production. How do you explain that, and what do you change?", "a": "Green means 'the checks that exist passed,' not 'the application works' \u2014 those are different claims, and the gap is always a missing or weak check. I'd walk backward: did the smoke test after deploy actually assert anything meaningful, or just check that the process started? Did integration tests run against realistic data, or a trivial fixture that doesn't exercise the actual failure path? Was there a config difference between the tested environment and prod that the pipeline never validated \u2014 a secret, a connection string, a feature flag? Concretely I've seen this be a health check that only checked TCP port open, not application-level readiness; I'd fix that first, since it's usually the cheapest, highest-value gap. Structural fix: add a genuine post-deploy smoke test that exercises a real user-facing path, add config validation as an explicit pipeline stage rather than trusting it implicitly, and make sure rollback is automatic on smoke-test failure rather than requiring a human to notice.", "id": "q023"}, {"tab": "CI/CD Pipelines", "group": "Pipeline Design", "tricky": false, "realtime": false, "q": "How do you handle secrets in a CI/CD pipeline so they're never in plaintext in a Jenkinsfile or pipeline YAML?", "a": "Never inline \u2014 always pulled at runtime from a secrets store. In Jenkins, the Credentials plugin with withCredentials binds a secret to an environment variable only for the scope of that block, and Jenkins masks it in console output automatically. In Azure DevOps, variable groups linked to an Azure Key Vault, or secret variables marked explicitly secret so they're masked in logs. Either way, the actual secret value should live in Vault/Key Vault/a secrets manager, not in pipeline definition files, not in a Jenkins global variable visible to every job, and definitely not in a Groovy script committed to source control. I'd also scope credential access narrowly \u2014 a deploy job for service A shouldn't have blanket access to every secret in the org's vault, just the ones that service needs.", "code": "withCredentials([usernamePassword(credentialsId: 'db-cred', usernameVariable: 'DB_USER', passwordVariable: 'DB_PASS')]) {\n  sh 'deploy.sh --user=$DB_USER --pass=$DB_PASS'\n}", "id": "q024"}, {"tab": "CI/CD Pipelines", "group": "Jenkins & Groovy", "tricky": false, "realtime": false, "q": "Declarative versus scripted Jenkins pipelines \u2014 when do you actually reach for scripted?", "a": "Declarative is my default \u2014 structured, readable, has built-in stage visualization, and enforces enough guardrails that most engineers on a team can read and modify it without deep Groovy knowledge, which matters for maintainability across a team spanning UK and Poland where consistency reduces handoff friction. I drop into scripted, or a script{} block inside declarative, when I need genuine programmatic logic \u2014 dynamic stage generation based on a discovered list of services in a monorepo, complex conditional branching that declarative's when: directive can't express cleanly, or custom error handling with try/catch/finally around specific steps. In practice the pattern I like best is declarative pipeline as the outer structure, with a script{} block for the genuinely complex bits, rather than going fully scripted \u2014 keeps 90% of the pipeline approachable.", "id": "q025"}, {"tab": "CI/CD Pipelines", "group": "Jenkins & Groovy", "tricky": true, "realtime": true, "q": "Your Jenkins shared library function works perfectly when you test it standalone, but fails mysteriously only when called from inside a parallel block in the actual pipeline. What's going on?", "a": "Classic Groovy/Jenkins CPS (Continuation-Passing-Style) transformation issue combined with shared context in parallel execution. Two usual suspects: first, closures capturing a shared/mutable variable across parallel branches \u2014 if your shared library function reads or writes a variable defined outside the parallel block without proper scoping, branches can race on it, since Jenkins parallel steps genuinely run concurrently, not just interleaved. Second, CPS serialization \u2014 Jenkins pipeline scripts get transformed to support pause/resume, and certain Groovy constructs (some closures, non-serializable objects) behave differently under CPS than in plain Groovy, which is exactly why it works standalone but not inside the pipeline's CPS-transformed execution. My fix approach: make sure any state the function touches is passed as an explicit parameter, not captured from outer scope, add @NonCPS on methods that don't need to survive a pipeline restart and are pure computation, and test the shared library function specifically inside a parallel block in a scratch pipeline before trusting it in the real one.", "id": "q026"}, {"tab": "CI/CD Pipelines", "group": "Jenkins & Groovy", "tricky": false, "realtime": false, "q": "How do you structure Jenkins shared libraries so multiple teams (say, UK and Poland squads) reuse pipeline logic without stepping on each other?", "a": "One shared library repo with versioned tags (@v1.2.0 in the @Library annotation, not @master, so teams pin a known-good version and aren't broken by someone else's in-flight change), vars/ for global pipeline steps callable directly, src/ for the actual Groovy classes with real logic and unit-testable structure. I'd organize functions by capability, not by team \u2014 a deployToKubernetes() step, a runSonarScan() step \u2014 so both teams call the same well-tested building blocks with different parameters, rather than each team maintaining a forked copy. Governance-wise, changes to the shared library go through their own PR review and a version bump, exactly like a published package, and I'd version-pin per-project Jenkinsfiles so an update to the library doesn't silently break every pipeline across both teams simultaneously.", "id": "q027"}, {"tab": "CI/CD Pipelines", "group": "Deployment Strategies", "tricky": true, "realtime": true, "q": "You're doing a blue-green deployment on-prem \u2014 no cloud load balancer auto-provisioning. After cutover, half the traffic is still hitting the old version 20 minutes later. Why, and what do you check?", "a": "On-prem, blue-green cutover is only as instant as whatever's routing traffic, and that's rarely as clean as a cloud load balancer's API-driven target-group swap. Usual suspects: DNS-based cutover with a TTL that hasn't expired yet \u2014 if cutover relies on a DNS record change, clients and resolvers caching the old TTL will keep hitting blue for however long that TTL says, which is exactly why DNS-based blue-green needs a short TTL set well in advance of cutover, not at cutover time. Second: a hardware or software load balancer (F5, HAProxy, nginx) where the pool/member config change didn't actually propagate \u2014 some on-prem LBs need an explicit config reload or have connection draining that keeps existing sessions pinned to the old pool intentionally. Third: sticky sessions/session affinity keeping already-connected users on blue by design, which is correct behavior, not a bug, if that's how the LB is configured. My actual check order: confirm the LB config itself shows green as active, check connection draining settings, check DNS TTL and whether resolvers are honoring it, and distinguish 'new connections still going to blue' (real bug) from 'existing sessions still on blue' (expected, will drain naturally).", "id": "q028"}, {"tab": "CI/CD Pipelines", "group": "Deployment Strategies", "tricky": false, "realtime": false, "q": "Canary versus blue-green versus rolling \u2014 how do you decide which one for a given service?", "a": "Blue-green when you need instant, clean rollback and can afford to run two full environments simultaneously even briefly \u2014 good for services where a bad deploy is expensive and you want zero ambiguity about which version is live. Canary when you want to validate a change against real production traffic at small scale before committing fully \u2014 route 5% of traffic, watch error rates and latency against a baseline, then progressively widen; best when you have real metrics and alerting tied to the canary cohort specifically, otherwise you're just guessing. Rolling (the Kubernetes/OpenShift default) when you don't need the strong guarantees of the other two and want resource efficiency \u2014 no need to double capacity, and it's simpler to reason about for most routine deploys. On-prem specifically, blue-green is often the hardest to justify because it doubles the hardware/licensing footprint during cutover, which matters more when you're not paying cloud's pay-as-you-go model \u2014 so I've leaned toward rolling with health-check gating as the default and reserved blue-green for genuinely high-risk releases.", "id": "q029"}, {"tab": "CI/CD Pipelines", "group": "Pipeline Reliability", "tricky": true, "realtime": false, "q": "What's the failure mode where a pipeline step reports success but the shell script it ran actually failed?", "a": "Classic pipefail gap \u2014 in a pipeline where a shell step runs a command through a pipe (cmd1 | cmd2), the exit code of the whole pipeline defaults to the exit code of the *last* command, so if cmd1 fails but cmd2 (say, grep or tee) succeeds, the shell reports success even though the real work failed. Same failure shape with a multi-line shell block where an earlier command fails but the script keeps running and the last line happens to succeed \u2014 without set -e, bash doesn't stop on error by default. Fix: set -euo pipefail at the top of every shell script/step \u2014 -e stops on first error, -u catches unset variable references, -o pipefail propagates failure through pipes instead of masking it. I've had this exact bug in a real pipeline where a deployment step piped output through tee for logging, the actual deploy command failed, and the pipeline happily reported success because tee itself succeeded.", "id": "q030"}, {"tab": "Git & Branching", "group": "Strategy Design", "tricky": false, "realtime": false, "q": "GitFlow versus trunk-based development \u2014 how do you actually decide which fits a given team, rather than just having a favorite?", "a": "It comes down to release cadence and team size/maturity, not personal preference. GitFlow (develop, feature branches, release branches, hotfix branches) fits teams with scheduled, less-frequent releases, multiple versions in production simultaneously needing parallel maintenance (common in enterprise/regulated on-prem shops with formal release trains), or teams still building CI/CD maturity where long-lived branches give more review/staging time before merge. Trunk-based (short-lived feature branches, frequent merges to main, feature flags instead of long-lived branches) fits teams doing genuine continuous delivery, strong automated test coverage, and comfort with feature flags to decouple deploy from release. Given this JD mentions coordinating releases across UK and Poland teams with formal release management, I'd lean toward a GitFlow-influenced model \u2014 release branches specifically help there, since they give a stabilization window before a coordinated multi-team release \u2014 but I'd push for shorter-lived feature branches within it and avoid GitFlow's worst failure mode, which is develop and feature branches living for months and turning every merge into a conflict-resolution project.", "id": "q031"}, {"tab": "Git & Branching", "group": "Strategy Design", "tricky": true, "realtime": true, "q": "A hotfix needs to go to prod today, but prod is running release branch v2.3 while develop already has three sprints of unreleased work on top. How do you branch and merge this without polluting develop with half-finished features?", "a": "Branch the hotfix directly off the prod tag/release branch (v2.3), not off develop \u2014 that's the entire point of GitFlow's hotfix branch pattern. Fix it there, test it in isolation against exactly what's in prod, then merge the hotfix in two directions: into the release/main branch so prod actually gets it, tagged as v2.3.1, and separately into develop (or the current in-flight release branch if one exists) so the fix doesn't get silently lost the next time develop ships \u2014 that second merge is the step people forget under pressure, and it's how the same bug reappears two releases later. If develop has diverged significantly, I'd resolve conflicts at merge time rather than trying to cherry-pick the fix forward blind, and I'd tag the hotfix commit clearly so the release notes and audit trail show exactly what shipped outside the normal release train \u2014 that traceability matters for release management sign-off.", "id": "q032"}, {"tab": "Git & Branching", "group": "Strategy Design", "tricky": false, "realtime": false, "q": "What's your actual branch protection and merge policy for a shared main/develop branch on an enterprise repo?", "a": "Required PR review (at minimum one approval, two for anything touching shared infra/security-sensitive code), required status checks passing before merge \u2014 build, tests, SonarQube quality gate, SAST \u2014 so a red pipeline physically can't merge, not just gets flagged. No direct pushes to main/develop, even for admins, enforced at the platform level, not just by convention \u2014 'even for admins' is the part that actually matters, because an admin-bypass exception is exactly where unreviewed changes sneak into prod-adjacent branches. Require branches to be up to date before merge to catch integration conflicts early, and I'd require signed commits or at least verified authorship on anything touching the release/hotfix branches for audit purposes in a regulated on-prem environment.", "id": "q033"}, {"tab": "Git & Branching", "group": "Git Mechanics", "tricky": true, "realtime": true, "q": "You need to remove a large binary file accidentally committed three months and 200 commits ago \u2014 it's bloating every clone. git rm won't fix it. What do you actually do, and what's the risk?", "a": "git rm only removes it going forward \u2014 the blob stays in history, so every clone still pulls that 3-month-old commit and its full object. To actually purge it you need to rewrite history \u2014 git filter-repo (the modern, faster, safer replacement for the old filter-branch and BFG) targeting that specific path across all commits, which rewrites every commit SHA after that point. The real risk, and what I'd flag loudly before doing it: this rewrites history for everyone \u2014 every existing clone, every open branch, every open PR based on commits after that point becomes invalid and needs to be re-cloned or rebased onto the new history, so it needs to be coordinated as a scheduled, communicated event, not a quiet fix, especially across a multi-team UK/Poland repo where people are mid-feature-branch. I'd force-push the rewritten history, immediately notify every contributor to re-clone rather than pull/rebase (rebasing onto rewritten history from a stale local copy is where things go really wrong), and I'd also set up a pre-commit hook or Git LFS going forward so this specific mistake \u2014 large binaries in a normal repo \u2014 can't recur.", "code": "git filter-repo --path path/to/large-file.zip --invert-paths\ngit push --force --all\ngit push --force --tags", "id": "q034"}, {"tab": "Git & Branching", "group": "Git Mechanics", "tricky": false, "realtime": false, "q": "Rebase versus merge \u2014 what's your team guidance, and where do you draw the line?", "a": "For keeping a feature branch current with main/develop during development, I prefer rebase \u2014 it keeps history linear and readable, avoids noise merge commits, and makes bisecting failures much easier later. For actually bringing a completed feature branch into main/develop, I prefer a merge commit (often via PR merge with a no-fast-forward merge) because it preserves the fact that a feature branch existed as a unit, which matters for traceability and for reverting an entire feature cleanly if needed \u2014 reverting a squashed or rebase-merged single commit is much cleaner for that than untangling a rebased-in string of individual commits. The one hard rule regardless of preference: never rebase a branch that others have already pulled and built work on top of, since it rewrites SHAs and breaks everyone else's history \u2014 that's a coordination problem waiting to happen on a shared repo.", "id": "q035"}, {"tab": "Maven & Build", "group": "Core Maven", "tricky": false, "realtime": false, "q": "Explain the Maven build lifecycle and where CI/CD hooks typically plug in.", "a": "Maven's default lifecycle runs through phases in strict order: validate, compile, test, package, verify, install, deploy \u2014 running any phase runs every phase before it. CI typically hooks in at 'test' or 'package' for the build-and-test stage \u2014 mvn clean test for fast feedback, mvn clean package to actually produce the artifact (JAR/WAR). SonarQube integration usually runs as a plugin bound to the verify phase, or as a separate mvn sonar:sonar goal right after package so it scans the built classes and test coverage together. 'install' puts the artifact in the local repo (mostly useful for local dev/multi-module builds), and 'deploy' pushes it to a remote repository manager \u2014 which is where Nexus/Artifactory comes in, via the distributionManagement config in the POM, typically the actual last CI step before the artifact is considered a real, promotable release candidate.", "id": "q036"}, {"tab": "Maven & Build", "group": "Core Maven", "tricky": true, "realtime": true, "q": "A build that's been stable for months suddenly fails in CI with a dependency resolution error, but works fine on your local machine. What's your triage?", "a": "First suspect: a transitive dependency version isn't actually pinned, and something upstream published a new version that CI resolved differently than your local machine's already-cached local repo \u2014 this is exactly why unpinned version ranges or SNAPSHOT dependencies are dangerous in a shared build. I'd check mvn dependency:tree on both environments and diff them. Second suspect: CI is pulling from a different repository mirror or has a stale/broken connection to Nexus/Artifactory \u2014 a repo manager outage or a proxy misconfiguration can surface as 'dependency not found' even though the dependency itself hasn't changed. Third: local machine has a stale cached copy of a dependency in ~/.m2 that no longer matches what's actually published \u2014 meaning local isn't actually 'working,' it's working against outdated state and would fail too with a clean cache. My fix priority: pin exact versions (no ranges, no SNAPSHOT in anything that ships), use a Nexus/Artifactory-hosted repo as the single source of truth with local dev pointed at the same mirror CI uses, and never let 'works on my machine' be the tiebreaker \u2014 reproduce clean with mvn clean -U (force update) to settle which environment is actually right.", "id": "q037"}, {"tab": "Maven & Build", "group": "Core Maven", "tricky": false, "realtime": false, "q": "How do you handle multi-module Maven projects in a CI pipeline without every module rebuilding on every commit?", "a": "Reactor build order handles the dependency graph automatically \u2014 mvn -pl <module> -am builds just the specified module and its dependencies (am = also-make), rather than the whole reactor. For real CI efficiency I'd combine that with change detection \u2014 most CI systems (or a simple git diff against the last successful build) can tell you which modules actually changed, and you build/test only the affected module plus anything depending on it. I'd also lean on Maven's incremental compilation and a good local/CI-shared cache (either the CI system's native caching or a shared Nexus-backed artifact cache) so unchanged modules resolve their dependencies fast rather than re-downloading. For genuinely large monorepos this is where I'd also evaluate whether Maven's reactor is even the right tool versus splitting into independently-versioned, independently-released modules with their own pipelines \u2014 reactor builds don't scale indefinitely.", "id": "q038"}, {"tab": "Maven & Build", "group": "Artifact Versioning", "tricky": true, "realtime": false, "q": "Why is a SNAPSHOT dependency dangerous in a production build pipeline, even if it 'usually works'?", "a": "A SNAPSHOT version is explicitly mutable \u2014 the same version string, e.g. 1.2.0-SNAPSHOT, can resolve to genuinely different bytes today versus tomorrow, because it gets republished as work continues. That breaks the core guarantee a build pipeline depends on \u2014 reproducibility. A build that passed yesterday against 1.2.0-SNAPSHOT can fail (or worse, silently behave differently) today against the exact same POM, because the dependency itself changed underneath it without any change to your own code. In a release pipeline this is a real audit and rollback problem too \u2014 if you need to rebuild v3.4 six months from now to patch a security issue, and it depended on a SNAPSHOT, you may not even be able to reconstruct what actually shipped. My rule: SNAPSHOTs are fine for active in-progress inter-module development within a single team's sprint, but nothing that reaches a release branch, a tagged build, or gets promoted toward prod should ever depend on a SNAPSHOT \u2014 release versions get pinned exact versions, full stop.", "id": "q039"}, {"tab": "DevSecOps", "group": "Static & Dynamic Analysis", "tricky": false, "realtime": false, "q": "Explain the difference between SAST and DAST, and where each fits in the pipeline.", "a": "SAST (Static Application Security Testing) analyzes source code without running it \u2014 looks for known-bad patterns, injection risks, hardcoded secrets, insecure API usage \u2014 and runs early, typically right after build, because it's fast and doesn't need a running environment; SonarQube's security rules, plus dedicated SAST tools, both live here. DAST (Dynamic Application Security Testing) tests a genuinely running application from the outside \u2014 probing actual HTTP endpoints for things like injection, auth bypass, misconfigured headers \u2014 which means it has to run later in the pipeline, against a deployed instance in a test/staging environment, because it needs something live to attack. The two catch different classes of issues and neither replaces the other: SAST catches code-level flaws before they're even deployed, DAST catches runtime/configuration flaws SAST structurally can't see (a header misconfiguration, an exposed endpoint that only exists once deployed). I'd gate merges on SAST/SonarQube (fast, blocks bad code early) and gate promotion-to-prod on DAST results against the UAT deploy (slower, but catches what SAST can't).", "id": "q040"}, {"tab": "DevSecOps", "group": "Static & Dynamic Analysis", "tricky": true, "realtime": true, "q": "SonarQube's quality gate is blocking a release with a bug that the team genuinely believes is a false positive, and there's real pressure to ship today. What do you actually do?", "a": "I don't just override the gate to make the deadline \u2014 that erodes the entire point of having a gate, and it's exactly the kind of shortcut that becomes normal after the third time. Real process: verify it's actually a false positive, not a real issue someone's rationalizing away under deadline pressure \u2014 read the actual finding, not just the summary. If it's genuinely a false positive (SonarQube does have real false-positive rates on certain rule categories, especially around null-pointer analysis in code with runtime guarantees the static analyzer can't see), mark it as 'Won't Fix' or 'False Positive' in SonarQube itself with a documented justification, which is the sanctioned mechanism for exactly this situation \u2014 it keeps the audit trail intact rather than silently disabling the gate. If it's genuinely a real issue but low severity and the business accepts the risk, that's a documented risk-acceptance decision made by someone with the authority to accept it, not an engineering override \u2014 I'd escalate to whoever owns that call rather than making it myself under pressure. What I won't do is quietly lower the quality gate threshold or disable the rule org-wide just to unblock one release \u2014 that fix reaches every future build, not just today's.", "id": "q041"}, {"tab": "DevSecOps", "group": "Static & Dynamic Analysis", "tricky": false, "realtime": false, "q": "How do you tune a SonarQube quality gate so it's meaningfully strict without generating so much noise that developers start ignoring it?", "a": "Start from the 'Sonar way' default gate but actually tailor it to the codebase's real state rather than either accepting defaults blindly or disabling everything inconvenient. Key levers: apply strict gates (zero new bugs/vulnerabilities, coverage threshold) to *new code* specifically, using SonarQube's new-code-period concept, rather than demanding an old, large legacy codebase retroactively meet a strict bar overnight \u2014 that's the single biggest thing that makes gates practical instead of demoralizing on brownfield projects. Set coverage thresholds based on genuinely achievable targets per project maturity rather than one blanket number across every repo. Review the rule set periodically with the team \u2014 if a rule is consistently flagged as false-positive-prone for legitimate reasons in your specific stack, that's a real signal to retune the rule, not just suppress individual findings forever.", "id": "q042"}, {"tab": "DevSecOps", "group": "Container & Dependency Security", "tricky": true, "realtime": true, "q": "A container image that passed vulnerability scanning at build time is now flagged critical two weeks later in a scheduled re-scan, with nothing in your code having changed. How is that possible, and what do you do?", "a": "Nothing in your code changed, but the base image or an OS-level package inside it didn't stay frozen in the vulnerability database's eyes \u2014 a CVE gets disclosed after your build (this happens constantly; a package that was 'clean' at build time gets a new CVE published against a version you're already running), or your scanner's vulnerability database itself got updated with newly disclosed CVEs that retroactively apply to packages already baked into your image. This is exactly why 'scanned once at build time' isn't sufficient for container security \u2014 images sitting in a registry, or worse, already deployed and running, need periodic re-scanning against the current CVE database, not just a point-in-time check. My response: triage severity and actual exploitability first \u2014 not every critical CVE is exploitable in your specific deployment context (is the vulnerable code path even reachable given how you use that package?) \u2014 then patch by rebuilding from an updated base image and redeploying, following the same pipeline as any other release rather than a manual hotfix to a running container. Structurally I'd make sure registry-level scanning re-scans images on a schedule, not just at push time, and that a critical finding on a deployed image has an actual alerting/ticketing hook, not just a dashboard nobody checks.", "id": "q043"}, {"tab": "DevSecOps", "group": "Container & Dependency Security", "tricky": false, "realtime": false, "q": "Where in the pipeline do you actually put container image scanning, and what do you do when it finds something?", "a": "Two gates, not one: at build time, right after the image is built and before it's pushed to the registry \u2014 fail the push on critical/high findings above an agreed threshold, so a genuinely bad image never even lands in the registry. And on a recurring schedule against images already in the registry and already deployed, since new CVEs get disclosed against old images constantly, as above. Tooling-wise this integrates naturally into the pipeline as a stage right after docker build, before docker push \u2014 Trivy, Grype, or a registry-native scanner (Artifactory Xray, Harbor's built-in scanner) all fit that slot. On a finding: severity and reachability triage first, patch by bumping the base image or the specific vulnerable package and rebuilding \u2014 never patch a running container in place and call it done, since the next deploy from the same unpatched image definition just reintroduces the vulnerability.", "id": "q044"}, {"tab": "Docker", "group": "Image Building", "tricky": true, "realtime": true, "q": "Your Docker image build takes 12 minutes in CI, mostly dependency install, and it's slowing down every pipeline run across the team. How do you actually fix it?", "a": "Layer caching is the first lever, and the most common mistake is ordering \u2014 if you COPY the entire application source before installing dependencies, any code change invalidates the cache for the dependency-install layer too, forcing a full reinstall every build. Fix: COPY only the dependency manifest (package.json/requirements.txt/pom.xml) first, run the install as its own layer, then COPY the rest of the source afterward \u2014 now code changes don't bust the dependency cache, and only a manifest change does. Second lever: multi-stage builds \u2014 do the heavy build/compile work in a builder stage with all the build tooling, then COPY just the final artifacts into a minimal runtime stage, which also shrinks the final image significantly. Third, for CI specifically: make sure the CI system is actually reusing Docker layer cache between runs (registry-based cache with --cache-from, or a CI-native layer cache) rather than starting from a cold Docker daemon every single build, which is a very common and very expensive default in ephemeral CI runners.", "code": "FROM node:20 AS builder\nWORKDIR /app\nCOPY package*.json ./\nRUN npm ci\nCOPY . .\nRUN npm run build\n\nFROM node:20-slim\nCOPY --from=builder /app/dist /app\nCMD [\"node\", \"/app/index.js\"]", "id": "q045"}, {"tab": "Docker", "group": "Image Building", "tricky": false, "realtime": false, "q": "COPY versus ADD \u2014 is there ever a real reason to use ADD?", "a": "COPY is the default for everything \u2014 it's simple, predictable, and does exactly what it says. ADD has two extra behaviors that make it riskier than useful most of the time: it auto-extracts local tar archives, and it can fetch remote URLs directly into the image. The URL-fetch behavior specifically is a real anti-pattern \u2014 no build-time layer caching benefit, no checksum verification unless you add it yourself, and it silently couples your build to network availability and whatever that URL currently serves, which is bad for reproducibility. The one legitimate case for ADD is genuinely wanting the tar-auto-extract behavior \u2014 pulling a local .tar.gz and having it extracted into the image in one step. Outside that narrow case, I standardize on COPY across a team, and if the extract-a-tarball case comes up, I'd rather RUN tar -xzf explicitly anyway so the behavior is obvious to the next person reading the Dockerfile instead of relying on ADD's implicit magic.", "id": "q046"}, {"tab": "Docker", "group": "Runtime Behavior", "tricky": true, "realtime": true, "q": "You docker exec into a running container and fix a config file live to unblock an incident. Twenty minutes later the container restarts on its own and the fix is gone. Why, and what should you actually have done?", "a": "Anything changed inside a running container's writable layer is ephemeral \u2014 it lives only in that container instance's layer, not the image, and the moment the container restarts (crash, orchestrator reschedule, node reboot, a Kubernetes liveness probe killing it), you get a fresh container from the original image, and the exec'd change is gone, not because Docker did anything wrong but because that's exactly what 'stateless, restart-from-image' means. What I should have done: treat the exec fix as strictly a diagnostic/verification step \u2014 confirm the fix actually resolves the issue live \u2014 then immediately encode that same fix into the image (Dockerfile change) or into whatever config-injection mechanism is actually in use (ConfigMap in Kubernetes, an Ansible-templated config baked at deploy time), rebuild, and redeploy through the normal pipeline. docker exec is for diagnosis and emergency mitigation buying time, never for a durable fix \u2014 that's a discipline I'd want the whole team holding to, because the failure mode (silent revert on next restart, usually at the worst time) is exactly what just happened here.", "id": "q047"}, {"tab": "Docker", "group": "Runtime Behavior", "tricky": false, "realtime": false, "q": "What's the actual difference between ENTRYPOINT and CMD, and what happens when you use both?", "a": "CMD alone sets the default command, fully overridable by anything passed after the image name at docker run. ENTRYPOINT alone sets the command that always runs, and anything passed at docker run gets appended as arguments to it rather than replacing it. Used together \u2014 ENTRYPOINT as the fixed executable, CMD as its default arguments \u2014 you get a container that behaves like a proper CLI tool: ENTRYPOINT [\"myapp\"] with CMD [\"--config\", \"/etc/default.conf\"] means docker run myimage always runs myapp, using the default config unless you override just the arguments at runtime with docker run myimage --config /etc/other.conf. The gotcha people hit: shell form (ENTRYPOINT myapp) versus exec form (ENTRYPOINT [\"myapp\"]) behave differently around signal handling \u2014 shell form runs the command as a child of a shell process, so SIGTERM from docker stop goes to the shell, not your app, meaning graceful shutdown handlers in your app never fire and Docker eventually SIGKILLs it after the timeout. I always use exec form for exactly this reason.", "id": "q048"}, {"tab": "Docker", "group": "Runtime Behavior", "tricky": true, "realtime": true, "q": "Real gotcha: you're debugging a slow-leak memory issue in a container. You docker stop it, docker rm it, but the volume it wrote to still has all the data \u2014 and separately, a colleague asks if a docker rm -f on a container that had an active exec session loses data. Walk through both.", "a": "First part: yes, named volumes and bind mounts are explicitly designed to outlive the container \u2014 that's the entire point of using a volume instead of the container's writable layer, so stopping and removing the container is safe for anything that genuinely needs to persist, and re-running a new container against the same volume picks up right where the old one left off. The gotcha to watch for is anonymous volumes (declared in the image but not explicitly named) \u2014 those can get orphaned and accumulate as dangling volumes over time if containers using them are removed without -v, which is worth a periodic docker volume prune in CI hosts that build a lot of images. Second part: docker rm -f sends SIGKILL to the main process immediately, no graceful shutdown \u2014 if there's an active exec session with an in-flight operation (a write mid-flush, a transaction not yet committed), that work is lost exactly like any ungraceful process kill would lose it; it has nothing to do with the exec session specifically, it's the same risk as SIGKILLing any process mid-write. The safe sequence for anything with in-flight state is docker stop (SIGTERM, grace period, then SIGKILL only if it doesn't exit) rather than jumping straight to -f.", "id": "q049"}, {"tab": "Kubernetes & OpenShift", "group": "OpenShift Specifics", "tricky": false, "realtime": false, "q": "This JD lists both Kubernetes and OpenShift \u2014 what actually differs day-to-day, beyond 'OpenShift is Kubernetes with extras'?", "a": "OpenShift is a Kubernetes distribution, so the core object model (Pods, Deployments, Services) is the same, but a few differences genuinely change daily workflow. Security defaults: OpenShift's Security Context Constraints (SCCs) are stricter by default than raw Kubernetes' PodSecurityPolicy/PodSecurity-admission \u2014 OpenShift refuses to run containers as root by default (assigns a random high UID) unless you explicitly request a specific SCC, which means Dockerfiles and Helm charts written assuming root or a fixed UID often need adjustment to run cleanly on OpenShift. Build integration: OpenShift has BuildConfig and native source-to-image (S2I) builds, letting you go from source to a running deployment without hand-writing a Dockerfile in some workflows \u2014 different from vanilla K8s which assumes you bring your own pre-built image. Routing: OpenShift Routes versus vanilla K8s Ingress \u2014 similar purpose, different object and slightly different feature set (OpenShift Routes have built-in TLS termination options and traffic splitting that Ingress needs an extra controller/annotations to match). And oc as the CLI, which wraps kubectl but adds OpenShift-specific verbs (oc new-app, oc rollout, project-scoping by default in a way plain K8s namespaces don't enforce as strongly).", "id": "q050"}, {"tab": "Kubernetes & OpenShift", "group": "OpenShift Specifics", "tricky": true, "realtime": true, "q": "A container image that runs fine on your local Docker and on a vanilla K8s cluster fails to start on OpenShift with a permissions error. What's actually going on?", "a": "Almost certainly OpenShift's default SCC (restricted, or restricted-v2 on newer versions) assigning the container a random, non-root, non-predictable UID rather than whatever UID your image's Dockerfile specifies or defaults to \u2014 if your application writes to a directory owned by a specific UID (say, a hardcoded UID 1000 baked into the image) and OpenShift actually runs it as some arbitrary UID like 1000650000, that write fails with a permissions error even though the exact same image ran fine as UID 1000 elsewhere. The real fix isn't to just grant the image a privileged SCC to make the error go away \u2014 that's a security regression and usually gets flagged in review anyway. Proper fix: make the image UID-agnostic \u2014 set directory permissions with group ownership (GID 0, since OpenShift's random UID is still in the root group by convention) and 'g=u' style permissions so any UID in that group can read/write, which is the standard S2I-compatible image pattern. I'd only escalate to requesting an SCC exception (like anyuid) as a last resort for something that genuinely can't be made UID-agnostic, and even then, that request goes through whoever owns OpenShift security policy, not a self-service workaround.", "id": "q051"}, {"tab": "Kubernetes & OpenShift", "group": "Troubleshooting", "tricky": true, "realtime": true, "q": "A pod is stuck in CrashLoopBackOff, but kubectl logs shows nothing useful \u2014 just an empty or truncated log right before it dies. What's your actual debugging sequence?", "a": "First, kubectl logs <pod> --previous \u2014 the crashed container's logs, not the new restart attempt's (mostly-empty) logs, since by the time you look, Kubernetes has often already spun up attempt number 4 or 5 and your --previous-less kubectl logs is showing you the newest attempt's few seconds of output, not the actual crash. Second, kubectl describe pod for the Events section \u2014 OOMKilled shows up there distinctly from a genuine application crash, and that single word changes the entire debugging direction (resource limits problem, not code problem). Third, if it's crashing too fast to get meaningful logs even with --previous, I'd temporarily override the container's command/args to something that keeps it alive (sleep infinity) via a debug deployment or kubectl debug, then exec in and manually run the actual startup command to see the real failure interactively, since sometimes the fast-crash itself is masking a stdout/stderr buffering issue where output genuinely never gets flushed before the process dies. Fourth, check readiness/liveness probe config \u2014 a probe with too aggressive a timeout can be killing an app that's just slow to start, which looks identical to a real crash from the outside.", "id": "q052"}, {"tab": "Kubernetes & OpenShift", "group": "Troubleshooting", "tricky": false, "realtime": false, "q": "Explain the difference between a Deployment's rolling update getting stuck versus a pod being Running but not Ready, and how you'd tell which is happening.", "a": "A rolling update stuck usually shows as kubectl rollout status hanging, and kubectl get rs showing the new ReplicaSet not reaching desired replica count while the old ReplicaSet still has pods \u2014 the rollout is blocked by maxUnavailable/maxSurge constraints waiting on new pods to become Ready before it'll proceed further, so it's genuinely stuck on readiness, not a separate issue. Running-but-not-Ready is the actual root state underneath that \u2014 the pod's container process started successfully (Running) but its readiness probe is failing, meaning Kubernetes won't route Service traffic to it and, during a rollout, won't consider the update progressed. I'd check kubectl describe pod for the readiness probe's actual failure (wrong path, wrong port, app genuinely not ready to serve \u2014 like still warming a cache or waiting on a DB connection that isn't up yet), and kubectl get endpoints for that Service to confirm the pod's IP is genuinely absent from the endpoint list, which is the concrete, checkable symptom of not-Ready translating into 'no traffic.'", "id": "q053"}, {"tab": "Kubernetes & OpenShift", "group": "Resource Management", "tricky": true, "realtime": true, "q": "You set requests and limits on a pod, but under load it still gets OOMKilled well before hitting what you thought was the memory limit. What's the actual mismatch?", "a": "Most common real cause: the application's own memory settings don't know about the container's cgroup limit at all \u2014 a JVM, for example, without -XX:MaxRAMPercentage or a modern JVM version with proper container awareness, may calculate its heap sizing off the node's total physical memory rather than the container's limit, and happily grow well past what the container is actually allowed, at which point the kernel's OOM killer (via the cgroup, reported by Kubernetes as OOMKilled) terminates it \u2014 the app never got a graceful 'you're low on memory' signal, it just got killed. Second cause: the limit accounts for the main process but not for genuine overhead \u2014 sidecar containers in the same pod each need their own requests/limits, and if you only sized the main container, a sidecar (a logging agent, a service mesh proxy) consuming memory you didn't budget for pushes the pod over. My fix: confirm the runtime is actually container-memory-aware (modern JVMs are, by default, since JDK 10+, but older JVMs or explicit -Xmx flags that ignore cgroup limits need explicit correction), set requests close to steady-state usage and limits with real headroom based on observed peak, not a guess, and size every container in the pod, not just the obvious one.", "id": "q054"}, {"tab": "Kubernetes & OpenShift", "group": "Resource Management", "tricky": false, "realtime": false, "q": "What happens if you set a memory limit but no memory request, or vice versa \u2014 why does the combination matter?", "a": "If you set only a limit with no request, Kubernetes defaults the request to equal the limit \u2014 which actually removes your scheduling flexibility, since the scheduler now reserves the full limit's worth of memory on a node even if the pod typically uses far less, wasting bin-packing efficiency across the cluster. If you set only a request with no limit, the pod can consume unbounded memory on that node (in Kubernetes versions/configs without a default LimitRange), which is dangerous in a shared cluster \u2014 one misbehaving pod without a limit can pressure or evict well-behaved neighbors sharing that node. The combination that actually gives you both good scheduling and good isolation: request set to typical/steady-state usage (what the scheduler uses for bin-packing decisions) and limit set higher, with enough headroom for legitimate spikes but still bounded \u2014 and for CPU specifically, I'd generally avoid setting a hard CPU limit at all unless there's a real multi-tenant noisy-neighbor concern, since CPU throttling under a limit can cause latency spikes that are often worse than just letting it burst, whereas memory always needs a hard limit because there's no equivalent of graceful throttling for memory \u2014 it's OOM-kill or nothing.", "id": "q055"}, {"tab": "Kubernetes & OpenShift", "group": "Networking", "tricky": true, "realtime": true, "q": "A Service has endpoints and pods are Ready, DNS resolves the Service name correctly, but requests to it intermittently time out. Where do you look next?", "a": "Since basic connectivity/DNS/readiness all check out, I'd suspect either a NetworkPolicy silently dropping some traffic, or a load-balancing/session-affinity mismatch causing intermittent (not total) failure specifically. Concretely: check for a NetworkPolicy scoped to that namespace or those pod labels that allows most traffic but not all \u2014 a policy written for one caller's IP range/label selector that doesn't cover a second legitimate caller shows up exactly as 'intermittent,' since only requests from the disallowed source fail while everything else works. Second: kube-proxy mode and iptables/IPVS rule staleness on a specific node \u2014 if the Service's endpoint list changed recently (a rollout, a pod eviction) and a node's kube-proxy hasn't fully synced its rules, traffic routed through that specific node can hit a stale/dead endpoint intermittently until it catches up; I'd check whether the timeouts correlate with a specific node rather than being uniformly distributed. Third: if it's a long-lived connection setup (gRPC, keep-alive HTTP) hitting a Service, versus fresh connections each time \u2014 some clients cache a resolved endpoint and don't rebalance on pod churn the way a fresh connection through the Service's virtual IP would, which shows up as intermittent timeouts specifically after a rollout. I'd correlate the timeout pattern against recent rollouts, specific source pods/nodes, and NetworkPolicy changes before assuming it's a generic 'flaky network' issue.", "id": "q056"}, {"tab": "Scripting", "group": "Shell", "tricky": true, "realtime": true, "q": "A shell automation script that's run hundreds of times without issue suddenly deletes more files than expected during a cleanup run, on one specific host. What class of bug do you suspect first, and how do you prevent recurrence?", "a": "First suspect: an unquoted or unset variable expanding to something unintended \u2014 a classic case is a cleanup script like rm -rf $BASE_DIR/* where $BASE_DIR was somehow empty on that one host (a missing environment variable, a failed earlier command that should have set it but didn't error loudly), collapsing the command to rm -rf /* effectively, or at least rm -rf /* relative to wherever the script happened to be running from. This is exactly why set -u (treat unset variables as an error, not silent-empty) should be standard in any script doing destructive operations, alongside set -e and pipefail. Second suspect: a glob expanding differently than expected because of a working-directory assumption that held on every other host but not this one \u2014 a relative path in a script that assumed it always runs from a specific directory. My concrete prevention: set -euo pipefail as a non-negotiable header on every destructive script, always quote variable expansions (\"$VAR\" not $VAR), validate that any variable used in a destructive command is both set and non-empty with an explicit check before the destructive command runs, and for anything genuinely destructive, a dry-run mode (echo the rm commands instead of running them) that gets exercised before the real flag is ever set.", "code": "set -euo pipefail\n\nif

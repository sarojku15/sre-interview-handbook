[[ -z \"${BASE_DIR:-}\" ]]; then\n  echo \"ERROR: BASE_DIR is unset, refusing to proceed\" >&2\n  exit 1\nfi\n\nrm -rf \"${BASE_DIR:?}\"/*", "id": "q057"}, {"tab": "Scripting", "group": "Shell", "tricky": false, "realtime": false, "q": "What's your go-to pattern for a shell script that needs to run reliably as part of a deployment automation pipeline \u2014 what does 'production-grade shell' look like to you?", "a": "set -euo pipefail at the top, always. Explicit error trapping with trap for cleanup on exit/failure, so a script that dies halfway doesn't leave a lock file or a half-copied artifact behind. Logging that's actually useful under pressure \u2014 timestamped, to both stdout (for pipeline console capture) and a persistent log file if it's long-running. Idempotency where possible \u2014 check state before acting, same discipline as Ansible modules, rather than assuming a clean starting state every run. Input validation on anything parameterized rather than trusting arguments blindly, since a pipeline-triggered script often receives parameters from upstream that could be malformed. And for anything beyond fairly simple glue logic, I'll actually reach for Python instead of pushing shell past its comfortable complexity ceiling \u2014 shell is great for orchestration and simple file/process operations, but complex logic, real error handling, and anything needing structured data (JSON parsing, API calls) gets unreliable and unreadable in shell past a certain point.", "id": "q058"}, {"tab": "Scripting", "group": "Python", "tricky": true, "realtime": true, "q": "You wrote a Python automation script that calls an internal API to trigger deployments across dozens of on-prem hosts. It works great until one host's API call hangs, and now the whole script is stuck with no timeout, no way to know which host it's on.", "a": "Two separate real problems here worth fixing independently: no timeout on the request itself, and no visibility into progress. requests without an explicit timeout= will hang indefinitely if the remote side never responds \u2014 that's a very common real bug, since Python's requests library has no default timeout, which surprises people coming from other ecosystems. Fix: always set a timeout, and wrap the call so a timeout on one host is caught and logged rather than propagating as an unhandled hang. For visibility, I'd add structured logging per-host with the current host name and step printed before each blocking call, so if it does hang again, you know exactly which host and which step from the last log line rather than staring at a frozen terminal. For genuine resilience across many hosts I'd also move from sequential to a thread/process pool with per-host timeouts and a bounded concurrency limit, so one hung host doesn't block the other 39 that are perfectly fine \u2014 collect results and failures into a report at the end rather than the whole run living or dying on one bad host.", "code": "import requests\n\ntry:\n    resp = requests.post(url, json=payload, timeout=(5, 30))  # connect, read\n    resp.raise_for_status()\nexcept requests.exceptions.Timeout:\n    log.error(f\"{host}: deploy call timed out\")\n    failures.append(host)\nexcept requests.exceptions.RequestException as e:\n    log.error(f\"{host}: {e}\")\n    failures.append(host)", "id": "q059"}, {"tab": "Scripting", "group": "Python", "tricky": false, "realtime": false, "q": "When do you reach for Python over Ansible for an automation task, given they overlap?", "a": "Ansible when the task is fundamentally 'converge these hosts to a desired state' \u2014 configuration management, package installs, service management \u2014 where idempotent modules and inventory-driven execution are the natural fit and writing it in raw Python would just be reinventing what Ansible already does well. Python when the task is genuinely programmatic \u2014 calling internal REST APIs, parsing and transforming structured data (JSON/XML reports, log analysis), building a custom tool with real control flow and error handling that would be awkward to express as a playbook, or gluing together multiple systems (querying a CMDB, then deciding what to do based on the result, then triggering Ansible itself). A common real pattern: Python as the orchestration layer that decides what needs to happen and calls Ansible (via ansible-runner or subprocess) to actually make hosts converge \u2014 Python for the decision logic and API integration, Ansible for the actual host-state work, rather than picking one tool to do both jobs.", "id": "q060"}, {"tab": "Scripting", "group": "Groovy", "tricky": false, "realtime": false, "q": "What's genuinely different about writing Groovy for Jenkins pipelines versus writing 'normal' Groovy or Java-adjacent code?", "a": "The big one is Jenkins' CPS (Continuation-Passing-Style) transformation, which rewrites your pipeline Groovy under the hood to support pausing and resuming execution (needed for things like input steps waiting on human approval, or a Jenkins restart mid-pipeline not losing state). That transformation doesn't play well with everything \u2014 certain Java standard library operations, some closures, and non-serializable objects can behave unexpectedly or throw NotSerializableException inside CPS-transformed code in ways they never would in plain Groovy or Java. The practical fix is the @NonCPS annotation on methods that do pure computation and don't need to survive a pause/resume, which exempts them from the transformation and lets you write normal, fast Groovy/Java-style code inside them \u2014 I use @NonCPS routinely for things like parsing a JSON string or doing string manipulation inside a shared library, where CPS transformation offers no benefit and only adds overhead and occasional serialization headaches.", "id": "q061"}, {"tab": "Observability", "group": "Prometheus", "tricky": true, "realtime": true, "q": "Prometheus alerting is completely silent during a real outage \u2014 no pages fired \u2014 even though the dashboard clearly shows the metric crossed the alert threshold twenty minutes ago. How do you debug alerting itself?", "a": "I'd separate this into three distinct failure points, because 'alerting is silent' could be broken at any of them: the alert rule itself never fired, it fired but Alertmanager never received it, or Alertmanager received it but routing/silencing suppressed the notification. Check order: first, Prometheus's own alert state via the /alerts endpoint or UI \u2014 if the rule shows 'pending' or never transitioned to 'firing,' check the for: duration on the rule, since a metric crossing threshold briefly and dropping back under the for: window never actually fires, which is by design but easy to misconfigure too aggressively. If it did fire, check Alertmanager received it \u2014 Prometheus's alerting config needs to actually point at the right Alertmanager endpoint, and a misconfiguration there means alerts fire in Prometheus but silently vanish, never reaching Alertmanager at all. If Alertmanager received it, check for an active silence (someone silenced this exact alert during a maintenance window that never got cleared, which is an extremely common real cause of 'alerting was silent during a real incident') or a routing tree misconfiguration sending it to a receiver nobody's actually watching. I'd genuinely check silences first in practice \u2014 a forgotten, un-expired maintenance silence is disproportionately often the actual root cause when 'nothing went wrong with the pipeline, alerting was just silenced.'", "id": "q062"}, {"tab": "Observability", "group": "Prometheus", "tricky": false, "realtime": false, "q": "Explain the difference between a counter, gauge, histogram, and summary in Prometheus, with when you'd actually use each.", "a": "Counter \u2014 monotonically increasing, only resets on restart; use for things that only go up, like total requests served or total errors, and always query it with rate() or increase() rather than the raw value, since the raw cumulative number alone isn't useful. Gauge \u2014 can go up or down; use for point-in-time values like current memory usage, active connections, queue depth. Histogram \u2014 buckets observations (like request latency) into configurable ranges and exposes counts per bucket plus a total sum and count, letting you calculate percentiles server-side at query time via histogram_quantile() \u2014 the buckets are pre-defined at instrumentation time, so choosing sensible bucket boundaries for your actual latency distribution matters, or your percentile calculations get inaccurate. Summary \u2014 also for distributions like latency, but calculates configurable quantiles (p50, p99) client-side at scrape time rather than letting you compute them flexibly later \u2014 cheaper to query but you can't aggregate summary quantiles across multiple instances meaningfully (averaging p99s from 10 pods isn't the true p99 across the fleet), which is exactly why histogram is generally preferred for anything you need to aggregate across a distributed system, and summary is mostly reserved for single-instance-scoped metrics where cross-instance aggregation was never needed.", "id": "q063"}, {"tab": "Observability", "group": "ELK Stack", "tricky": true, "realtime": true, "q": "Elasticsearch cluster health goes yellow, then intermittently red, right when log ingestion volume spikes during an incident \u2014 the worst possible time. What's actually happening and what's the fix?", "a": "Yellow means some replica shards are unassigned (still tolerable, degraded), red means primary shards are unassigned (real data unavailability for those indices) \u2014 and this happening exactly during a log-volume spike is a very common, very real failure mode: heavy indexing pressure exhausts either disk space (hitting the disk watermark thresholds that Elasticsearch uses to stop allocating/writing to a node) or JVM heap (indexing is memory-intensive, and heap pressure triggers circuit breakers or even node instability), and a struggling/overloaded node can drop out of the cluster, taking its primary shards' availability with it until they're reassigned or the node rejoins. Immediate triage: check disk usage against the watermark thresholds (cluster.routing.allocation.disk.watermark) first, since that's the single most common real cause \u2014 Elasticsearch is being conservative and correct by refusing writes/allocation near a full disk, it's not misbehaving. Check node/JVM heap pressure via the cluster stats API. Mitigation during the incident itself: if it's genuinely disk pressure, free space or add capacity fast, and consider throttling non-critical index ingestion temporarily to protect cluster stability over completeness of every log line. Root-cause fix afterward: proper index lifecycle management (ILM) so old indices roll off automatically before disk pressure becomes a recurring incident-time surprise, and capacity planning that accounts for burst ingestion during exactly the scenario that's most likely to also be a real incident \u2014 which is an unpleasant but real correlation, since incidents themselves often generate more log volume.", "id": "q064"}, {"tab": "Observability", "group": "ELK Stack", "tricky": false, "realtime": false, "q": "Walk through the actual role each component plays in the ELK/Elastic stack, and where Logstash fits versus just shipping logs directly.", "a": "Elasticsearch \u2014 the storage and search/indexing engine, where logs actually live as documents in an inverted index for fast full-text and structured search. Logstash \u2014 the ingestion and transformation pipeline: parses raw, often messy log lines (grok patterns for unstructured text, or structured JSON parsing) into structured fields, enriches (adding metadata, geo-IP lookups), and routes to Elasticsearch (or elsewhere). Kibana \u2014 the visualization and query UI on top of Elasticsearch. Where it gets a real design decision: Logstash is genuinely heavyweight (JVM-based, resource-hungry) for pure shipping, so a lot of real-world architectures use Filebeat (lightweight, Go-based) to tail and ship logs, and either send straight to Elasticsearch for already-structured logs (application logs already emitting JSON), or through Logstash specifically when real parsing/transformation of unstructured text is needed (legacy app logs with no structured format, needing grok patterns to extract fields). I've built pipelines both ways \u2014 Filebeat direct to Elasticsearch for cleanly-structured app logs, Filebeat to Logstash to Elasticsearch when there's genuine unstructured legacy log format to parse \u2014 picking based on whether transformation is actually needed, not defaulting to the heaviest tool by habit.", "id": "q065"}, {"tab": "Observability", "group": "OpenTelemetry", "tricky": false, "realtime": false, "q": "What problem does OpenTelemetry actually solve that Prometheus + ELK alone don't, and how does it fit alongside them rather than replace them?", "a": "OpenTelemetry standardizes instrumentation and, critically, adds distributed tracing as a first-class signal alongside metrics and logs \u2014 the three pillars of observability together (traces, metrics, logs), correlated. Prometheus gives you metrics, ELK gives you logs, but neither natively answers 'this specific request was slow \u2014 which of the 6 microservices it touched actually caused the delay, and where exactly in that service.' Distributed tracing, via OpenTelemetry SDKs instrumenting each service and propagating a trace context (trace ID, span ID) across service boundaries, answers exactly that \u2014 you get a waterfall view of one request's full path across every service it touched, with per-span timing. OpenTelemetry doesn't replace Prometheus or ELK \u2014 it's a vendor-neutral instrumentation and collection layer that can export metrics to Prometheus, traces to a tracing backend (Jaeger, Tempo, or a commercial APM), and it increasingly can correlate logs with trace IDs too, so you can jump from a slow trace directly to the exact log lines from that specific request. The real value for a platform team is the vendor-neutral part \u2014 instrument once with OTel SDKs/the Collector, and you're not locked into re-instrumenting every service if the backend (Jaeger versus a commercial APM versus something else) changes later.", "id": "q066"}, {"tab": "Observability", "group": "OpenTelemetry", "tricky": true, "realtime": true, "q": "You've instrumented a service with OpenTelemetry and traces show up fine for most requests, but traces for calls going through an async message queue (Kafka/RabbitMQ) show up as broken, disconnected spans instead of one continuous trace. Why?", "a": "Trace context propagation is the mechanism that stitches spans across service boundaries into one trace, and it normally rides along with the request \u2014 HTTP headers, gRPC metadata. The moment a request's flow goes through an async queue, there's no synchronous request/response carrying that context automatically \u2014 the trace context (trace ID, parent span ID) has to be explicitly injected into the message when it's published, and explicitly extracted when it's consumed, or the consumer side starts a brand-new, disconnected trace with no idea it was ever part of the original request's trace. This is a very real, very common gap when teams instrument HTTP/gRPC paths (where OTel's auto-instrumentation often handles propagation transparently) but don't realize async messaging needs manual context propagation \u2014 injecting trace headers into the message's own headers/metadata field on publish, and extracting them on the consumer side to continue the same trace rather than start a new root span. Fix is instrumentation-level, not infrastructure-level: use the OTel messaging semantic conventions and make sure both the publisher and consumer sides of the queue are explicitly propagating and continuing context, not just auto-instrumented for whatever synchronous framework they're also using.", "id": "q067"}, {"tab": "Artifactory & Nexus", "group": "Repository Management", "tricky": false, "realtime": false, "q": "What's the actual role of Artifactory/Nexus in a pipeline beyond 'a place to store build artifacts'?", "a": "Single source of truth for anything a build depends on or produces, which is the real value: proxy repositories cache external dependencies (Maven Central, npm registry, Docker Hub) so builds don't depend on public internet availability and aren't exposed to a public registry silently changing/removing a package version out from under you; hosted repositories store your own built artifacts, versioned and immutable once published, which is what makes 'redeploy exactly what was tested' actually possible rather than aspirational; and for enterprise/regulated on-prem environments specifically, it's the control point for governance \u2014 vulnerability scanning integration (Artifactory Xray), license compliance checks, retention policies, and access control over who can publish/promote artifacts toward production. I'd also highlight repository promotion \u2014 moving an artifact from a snapshot/dev repo to a release repo as an explicit, audited step once it passes gates, rather than every environment just pulling from one undifferentiated bucket of artifacts.", "id": "q068"}, {"tab": "Artifactory & Nexus", "group": "Repository Management", "tricky": true, "realtime": true, "q": "A production deploy pulls what should be a known-good, previously-tested artifact version from Nexus, but the actual bytes deployed are subtly different from what passed testing three days ago. How is that even possible if versions are supposed to be immutable?", "a": "A few real ways this happens, and none of them mean Nexus itself is broken: someone republished the same version number over the old artifact \u2014 release repositories should be configured to reject redeploys/overwrites of an existing version (Nexus and Artifactory both support this as a repository setting), and if that setting isn't enforced, a well-meaning 'I just need to patch this one thing' redeploy under the same version number silently replaces what was actually tested, which is a governance gap, not a tooling limitation. Second: it wasn't actually a release-repo artifact at all \u2014 if the pipeline pulled from a snapshot repo (mutable by design) rather than a promoted release artifact, 'same version string' never guaranteed immutability in the first place, and that's a pipeline configuration bug, pulling from the wrong repo type for a prod deploy. Third, less common but real: a proxy/cache layer serving a stale or corrupted cached copy that never got properly invalidated. My actual fix: enforce release-repo immutability (reject overwrite) as a hard policy setting, not a convention; verify the pipeline's prod deploy step pulls specifically from the release repo, never snapshot; and add artifact checksum verification (Nexus/Artifactory both expose SHA checksums) as an explicit pipeline step comparing what's deployed against what was tested, so this class of drift is caught automatically rather than discovered after the fact.", "id": "q069"}, {"tab": "Cloud AWS/Azure", "group": "Hybrid & CI/CD Integration", "tricky": false, "realtime": false, "q": "This role is on-prem-heavy but lists AWS/Azure and Azure CI/CD pipelines \u2014 what's the realistic hybrid pattern you'd expect, and how do you approach it?", "a": "Most enterprises in a genuine hybrid position aren't fully migrating \u2014 they're running CI/CD orchestration and some services in the cloud (Azure DevOps as the pipeline engine, for instance) while workloads still run on-prem, or they're in a partial migration where some services have moved and others haven't, with both needing to be managed consistently. My approach: treat the pipeline tooling (Azure DevOps, Jenkins) as the control plane regardless of where the workload runs \u2014 the same pipeline concept (build, scan, package, deploy) should work whether the deploy target is an on-prem VM via Ansible, an on-prem Kubernetes/OpenShift cluster, or an Azure/AWS resource, just with a different deploy stage plugged in. I'd also expect network connectivity between on-prem and cloud (VPN or ExpressRoute/Direct Connect) to be a real constraint worth understanding early \u2014 a pipeline agent that needs to reach both an on-prem artifact repo and an Azure resource has real latency and firewall/routing dependencies that don't exist in a pure-cloud setup, and I'd want to know that topology before assuming a design will just work.", "id": "q070"}, {"tab": "Cloud AWS/Azure", "group": "Hybrid & CI/CD Integration", "tricky": true, "realtime": true, "q": "An Azure DevOps pipeline needs to deploy to an on-prem server behind the corporate firewall, with no inbound internet access. How do you actually architect that connection?", "a": "Azure DevOps self-hosted agents are the mechanism \u2014 instead of using Microsoft-hosted build agents (which live outside your network and can't reach an on-prem server with no inbound access), you install a self-hosted agent on a machine inside the on-prem network (or in a DMZ with appropriate access), and that agent polls Azure DevOps over outbound HTTPS to pick up jobs \u2014 no inbound firewall hole needed at all, since the agent initiates the connection outward, not the other way around. The agent then executes the deploy step locally within the network, with direct access to the on-prem target it needs to reach (SSH to run Ansible, direct network access to a Kubernetes/OpenShift API server, whatever the actual deploy mechanism is). I'd think about agent pool sizing and placement carefully in a UK/Poland multi-site setup specifically \u2014 agents ideally live close to (or within) the network segment they're deploying into, both for latency and because it avoids needing broad cross-site firewall rules just for pipeline traffic.", "id": "q071"}, {"tab": "Cloud AWS/Azure", "group": "Core Services & IAM", "tricky": false, "realtime": false, "q": "With both AWS and Azure certifications/exposure expected here, what's your mental model for translating IAM concepts between the two when you're context-switching?", "a": "Core concept maps fairly cleanly even though the mechanics differ: AWS IAM policies (JSON, attached to users/roles/groups, evaluated with explicit-deny-wins logic) map to Azure RBAC role assignments (built-in or custom roles, assigned at a scope \u2014 subscription/resource group/resource \u2014 rather than attached the AWS way). The genuinely different piece is Azure's scope hierarchy \u2014 management group \u2192 subscription \u2192 resource group \u2192 resource, with role assignments inheriting downward \u2014 versus AWS's flatter account/OU structure under AWS Organizations with SCPs layered on top; they're solving a similar governance problem but the actual permission-inheritance model isn't a 1:1 translation, and I've seen people assume Azure resource groups behave like AWS accounts when they're really more like a folder-level grouping within one account/subscription. For service identity specifically \u2014 AWS IAM roles for EC2/Lambda versus Azure Managed Identities \u2014 both solve 'let this compute resource authenticate without a hardcoded credential,' and I treat that equivalence as solid; it's the org-structure/scope layer where I'm careful not to over-map one onto the other.", "id": "q072"}, {"tab": "Release Management", "group": "Coordination & Process", "tricky": false, "realtime": false, "q": "How do you actually coordinate a production release across teams in different countries \u2014 specifically UK and Poland, like this JD \u2014 without it turning into a communication mess?", "a": "A written release plan that's the single source of truth, not tribal knowledge scattered across Slack/Teams threads \u2014 what's shipping, who owns each component, the deploy sequence, rollback steps, and explicit go/no-go criteria at each stage, shared and reviewed by both teams ahead of time, not discovered live during the release window. Time zone overlap matters concretely \u2014 UK and Poland are close (typically only an hour apart, CET vs GMT/BST), which is a real advantage over a US/Poland split, but I'd still pin an explicit release window in UTC that both teams confirm against their local time, since 'let's do it at 2pm' silently assumes a shared time zone that isn't actually shared. Clear ownership per stage \u2014 who's the go/no-go decision-maker if something looks marginal mid-release, since ambiguity there under pressure is where releases stall. And a single communication channel for the release itself (a dedicated bridge/war-room channel), so status updates aren't fragmented across parallel threads that different people are watching.", "id": "q073"}, {"tab": "Release Management", "group": "Coordination & Process", "tricky": true, "realtime": true, "q": "Mid-release, the UK team says a dependent service is ready to cut over, but the Poland team \u2014 who actually own that service's pipeline \u2014 say their last deploy hasn't finished validating. Release window is closing in 30 minutes. What do you actually do?", "a": "I don't let the clock override the actual technical state \u2014 a closing window is a scheduling problem, going live on unvalidated state is a production-risk problem, and those aren't the same magnitude of consequence, so I'd default to trusting the team who owns the pipeline and actually has eyes on validation status over the team who wants to proceed. Concretely: get both teams on the same call immediately rather than resolving through async messages, have the Poland team state precisely what's still validating and their honest ETA, and make the go/no-go call based on that, not on window pressure \u2014 if validation genuinely can't complete in 30 minutes, the right call is usually to slip the window, not cut over on hope. I'd also separate 'this specific dependent service isn't ready' from 'the whole release is blocked' \u2014 if other components are genuinely independent and validated, a partial release or rescheduling just the blocked piece might be viable, but that's a call I'd make explicitly and communicate clearly, not something that happens by default because one piece got quietly skipped under time pressure. After the fact, the real process fix is making sure validation status is visible to both teams in real time during the window, not something the UK team has to ask about and hope is current.", "id": "q074"}, {"tab": "Release Management", "group": "Coordination & Process", "tricky": false, "realtime": false, "q": "What does a good rollback plan actually contain, beyond 'we can roll back if needed'?", "a": "Specificity is the whole point \u2014 'we can roll back' isn't a plan, it's an aspiration. A real rollback plan states: the exact previous artifact version/image tag to redeploy (already sitting in Nexus/Artifactory/the registry, not something you'd have to rebuild under pressure), the exact rollback command or pipeline job to trigger, explicit database migration considerations if the release included schema changes (can the old code version even run against the new schema, or does rollback also need a reverse migration \u2014 this is the part people forget most often and the part that turns a clean rollback into a genuine incident), the specific health checks/metrics that would confirm rollback succeeded, and a clear decision owner and threshold for triggering it \u2014 what specific signal, seen by whom, triggers the rollback decision, decided in advance rather than debated live during an incident. I always ask the database-migration question explicitly in release planning, because a rollback plan that looks solid for application code often silently assumes the schema is backward-compatible without anyone having actually verified that.", "id": "q075"}, {"tab": "Enterprise Infra", "group": "Networking", "tricky": true, "realtime": true, "q": "Real-time scenario: an application team reports intermittent connection timeouts to a database, only under load, only for about 30 seconds at a time, then it clears. Where do you look, systematically?", "a": "Layer by layer rather than guessing: application-level first \u2014 connection pool exhaustion is the single most common cause of exactly this symptom (works fine at low load, times out under load, self-clears once load drops and connections free up), so I'd check the app's connection pool size against actual concurrent demand under load before touching networking at all. If pooling looks fine, move to the network layer \u2014 check for SNAT port exhaustion if this traffic passes through a NAT gateway or load balancer doing source NAT, since a burst of new connections under load can exhaust the available ephemeral port range on the NAT device, causing new connections to fail until existing ones age out \u2014 this shows the exact 'intermittent, load-correlated, self-clearing' signature described here. Also check the database's own max_connections limit and connection queue behavior under load, and whether there's a firewall or security appliance doing connection tracking with a table that's filling up under burst load. My actual triage order: reproduce or correlate the timeout window against connection pool metrics first (cheapest to check, most common cause), then NAT/firewall connection-table metrics, then database-side connection limits, rather than jumping straight to a packet capture, which I'd only pull if the above don't explain it.", "id": "q076"}, {"tab": "Enterprise Infra", "group": "Networking", "tricky": false, "realtime": false, "q": "Explain load balancing algorithms you've actually worked with \u2014 round robin, least connections, IP hash \u2014 and when each is the wrong choice.", "a": "Round robin \u2014 simplest, cycles requests evenly across backends; wrong choice when backend requests have genuinely uneven cost (some requests are cheap, some expensive) since even distribution of request count doesn't mean even distribution of actual load, or when backends have meaningfully different capacity, since round robin doesn't account for that at all. Least connections \u2014 routes to whichever backend currently has the fewest active connections, generally better for uneven request costs since it's reactive to actual current load rather than assuming uniformity; wrong choice for very short-lived connections where 'current connection count' barely differentiates backends before the next decision is needed anyway. IP hash \u2014 routes based on client IP, giving session affinity/stickiness without needing cookies; the real gotcha is that it can create uneven load distribution if your client IP distribution is skewed (a large NAT'd office network all hashing to the same backend), and it breaks badly if a backend goes down, since the hash ring shifting can suddenly send previously-sticky clients to a completely different backend, invalidating any local session state they depended on. In practice I default to least connections for most HTTP workloads unless there's a specific session-affinity requirement, and I'm cautious with IP hash unless I've actually checked the real client IP diversity feeding into it.", "id": "q077"}, {"tab": "Enterprise Infra", "group": "Storage & Servers", "tricky": false, "realtime": false, "q": "What's your general enterprise technical aptitude around storage \u2014 SAN versus NAS, and where does that distinction actually matter operationally?", "a": "SAN (Storage Area Network) presents block-level storage over a dedicated network (Fibre Channel or iSCSI) \u2014 the server sees it as a raw disk/LUN and puts its own filesystem on top, which is what you want for things needing low-latency, high-throughput block access, like database storage or VM datastores. NAS (Network Attached Storage) presents file-level storage over standard IP networking (NFS, SMB) \u2014 the filesystem already exists on the NAS side, and clients mount a shared filesystem directly, which is the natural fit for shared file access across multiple servers (shared config, shared application data, home directories). Operationally where it actually matters: performance characteristics and failure modes differ \u2014 a SAN LUN issue affects one server's block device (though could be one VM host serving many VMs, widening blast radius that way), while a NAS outage affects every client with that share mounted simultaneously, which is a genuinely different blast-radius shape worth thinking about when deciding what goes where. I'd also flag multipathing (multiple physical paths from server to SAN, for both performance and redundancy) as a real on-prem operational concern that has no cloud-storage equivalent conversation \u2014 it's exactly the kind of physical-topology awareness that on-prem work requires and cloud abstracts away entirely.", "id": "q078"}, {"tab": "Enterprise Infra", "group": "Storage & Servers", "tricky": true, "realtime": true, "q": "A batch job that reads/writes heavily to an NFS-mounted directory starts failing intermittently with stale file handle errors, only during high-load windows. What's happening and how do you fix it?", "a": "Stale file handle on NFS specifically means the client's cached reference to a file (its file handle) no longer matches what the server has \u2014 commonly because the file was deleted/recreated/moved on the server side while a client still held a handle to the old inode, or because of an NFS server failover/restart that changed the underlying export in a way the client's cached handle doesn't survive. Under high load specifically, this often correlates with a batch process doing heavy temp-file churn (create, write, rename, delete in rapid succession) where a second process reading the 'same' file races against the first process's rename/delete, or with NFS server-side load causing timeouts that trigger client-side retry/reconnect behavior that doesn't always cleanly resume the same handle. My fix approach: check whether the batch job's own file-handling pattern is the actual cause \u2014 rapid create/delete/rename cycles on NFS are inherently riskier than on local storage precisely because of handle caching, so redesigning to write to a local temp location and only move the final result to NFS once complete reduces the window significantly. Separately, check NFS mount options (hard vs soft mounts change retry/failure behavior significantly \u2014 hard mounts retry indefinitely and are usually the safer default for anything that can't tolerate silent data loss on a blip) and confirm the NFS server itself isn't under genuine resource pressure during those high-load windows causing timeouts in the first place.", "id": "q079"}, {"tab": "PostgreSQL & Unix", "group": "PostgreSQL Ops", "tricky": false, "realtime": false, "q": "As a DevOps engineer, not a DBA, what's the realistic depth of PostgreSQL knowledge you'd bring, and where do you hand off to an actual DBA?", "a": "I'd frame this honestly rather than overclaim DBA-level depth I don't have \u2014 my PostgreSQL exposure is operational: backup/restore procedures (pg_dump/pg_basebackup, WAL archiving for point-in-time recovery), monitoring key health signals (connection count against max_connections, replication lag on standbys, long-running/blocking queries, disk usage growth), basic performance triage (checking pg_stat_activity for what's actually running when something's slow, recognizing a missing index from an obviously slow query plan), and automating routine operational tasks (scheduled backups, vacuum/analyze scheduling, failover runbooks) via Ansible. Where I'd hand off to a DBA: genuine query optimization and schema design decisions, deep replication topology design, and anything touching data integrity risk beyond a standard runbook \u2014 I know enough to run EXPLAIN ANALYZE and recognize a red flag, not enough to redesign an indexing strategy for a complex workload. That division of labor is exactly the right one for a DevOps/SRE role \u2014 operational ownership and automation, DBA-level design and tuning as its own specialized function.", "id": "q080"}, {"tab": "PostgreSQL & Unix", "group": "PostgreSQL Ops", "tricky": true, "realtime": true, "q": "Real scenario: PostgreSQL replication lag between primary and standby suddenly spikes from milliseconds to several minutes, and it's not recovering on its own. What do you check, as the DevOps engineer first on the call before a DBA joins?", "a": "I'd check the practical, operational-level signals first, since that's genuinely within scope even without deep DBA expertise: network connectivity and latency between primary and standby (a degraded network link is a very common on-prem cause and immediately actionable), disk I/O on the standby specifically \u2014 if the standby's storage is slower or under other load, WAL replay can't keep pace with WAL generation on the primary, and that gap compounds; standby CPU/load in general, since replay is genuinely resource-intensive. I'd also check for a long-running query on the standby if it's a hot-standby serving read traffic \u2014 a long transaction can block WAL replay depending on configuration (max_standby_streaming_delay), which is a very concrete, fixable cause. And I'd check disk space on both sides \u2014 if WAL is accumulating faster than it's being shipped/applied, filling disk on either end turns a lag problem into an outage. What I'd explicitly not do is start tuning replication internals or making a call on failover myself \u2014 that's exactly the DBA-handoff point, but having already gathered network/IO/query/disk-space findings means the DBA isn't starting from zero when they join, which is the actual value I'd add in that first-responder window.", "id": "q081"}, {"tab": "PostgreSQL & Unix", "group": "Unix Administration", "tricky": false, "realtime": false, "q": "Give a real example of using awk/sed/grep together to solve an actual operational problem, not just define what each does.", "a": "A realistic one: parsing an Nginx access log to find the top 10 IPs generating 5xx errors in the last hour, during an incident where you need a fast answer without spinning up a full log-analysis tool. grep first to filter to just the relevant time window and status codes, awk to extract just the IP field and status code, sort and uniq -c to count occurrences per IP, sort -rn to rank by count, head to cap it. That kind of one-liner composition \u2014 each tool doing one narrow job, piped together \u2014 is exactly the Unix philosophy in practice, and it's genuinely faster than opening Kibana for a quick triage question during an active incident when you already have shell access to the box.", "code": "grep ' 5[0-9][0-9] ' /var/log/nginx/access.log | \\\n  awk -v since=\"$(date -d '1 hour ago' '+%d/%b/%Y:%H')\" \\\n    '$4 >= \"[\"since {print $1}' | \\\n  sort | uniq -c | sort -rn | head -10", "id": "q082"}, {"tab": "PostgreSQL & Unix", "group": "Unix Administration", "tricky": true, "realtime": true, "q": "A server's load average looks fine, but the application running on it is noticeably slow, and users are complaining. Walk through what you actually check beyond the obvious top/htop glance.", "a": "Load average alone is a genuinely incomplete signal \u2014 it counts processes in runnable or uninterruptible-sleep state, and a normal-looking load average can absolutely coexist with real user-facing slowness if the bottleneck isn't CPU contention at all. I'd check iostat -x for disk I/O wait \u2014 a process stuck waiting on slow disk shows low CPU usage and normal-ish load but real application-level latency, and %iowait in top/vmstat is the tell here that a quick top glance can miss if you're only looking at the load number. I'd check vmstat for memory pressure and swap activity \u2014 if the box is swapping, everything gets slow in a way that doesn't necessarily spike load average dramatically at first. I'd check network-level latency/connection state (ss -s, netstat) if the app depends on downstream services \u2014 slowness can genuinely be 'this box is fine, what it's talking to isn't.' And I'd check for a single runaway or misbehaving process (memory leak causing GC pressure in a JVM app, for instance) with a per-process view (top sorted by memory, or pidstat) rather than assuming system-wide resource exhaustion when it might be one process. The real lesson I'd want to convey: load average is a starting point, not a diagnosis, and I'd walk CPU, disk I/O, memory/swap, and network as four separate checks rather than stopping at the first metric that looks normal.", "id": "q083"}, {"tab": "Tricky Scenarios", "group": "High-Pressure Incidents", "tricky": true, "realtime": true, "q": "It's Friday, 5:45pm UK time, and you're asked to push an urgent hotfix to production before the weekend. Your gut says this needs more testing. What do you actually do?", "a": "I'd say so, directly and specifically \u2014 not 'I'm not comfortable' in the abstract, but the concrete gap: 'this hasn't been through the standard integration test suite, here's the specific risk if it's wrong, here's what we'd need to actually validate it in the next 30 minutes if we're doing this today.' I'd rather have that conversation clearly than either silently comply with a risk I flagged internally but never said out loud, or unilaterally refuse without explaining why. If the business genuinely needs it today despite the risk, that's a decision the right stakeholder can make with the risk stated plainly \u2014 I'm not the sole decision-maker on business risk tolerance, but I am responsible for making sure that risk is actually understood before the decision gets made, not discovered Monday morning. Concretely I'd also push for whatever partial validation is actually achievable in the time available (a smoke test against the exact change, not a full regression) rather than treating it as all-or-nothing, and I'd want an explicit, fast rollback plan ready given the reduced confidence \u2014 that's the part I'd insist on regardless of how the go/no-go call lands, because 'we shipped fast' and 'we can undo it fast if wrong' are two different guarantees and only one of them is negotiable under pressure.", "id": "q084"}, {"tab": "Tricky Scenarios", "group": "High-Pressure Incidents", "tricky": true, "realtime": true, "q": "During a live incident, two senior engineers on the call are confidently proposing two different, contradictory root causes and fixes. You have a hypothesis that's different from both. How do you handle that live, without derailing the incident?", "a": "I wouldn't argue abstractly for my theory against theirs \u2014 during an active incident that just burns time. I'd state my hypothesis briefly with the specific evidence behind it, and more importantly, propose the fastest way to actually test it rather than debate it: 'if it's X, we'd expect to see Y in the logs \u2014 can someone check that while we also look at what's being proposed.' Incidents are better served by parallel, falsifiable checks than by three people debating from intuition, so my instinct is to turn disagreement into a quick, concrete test rather than a discussion. If my hypothesis turns out to be wrong once checked, I say so plainly and move on \u2014 ego about being right isn't useful mid-incident. If time is genuinely critical and we can't test every theory, I'd defer to whoever has an incident commander role (or is acting as one) to pick a direction and commit to it, rather than letting three parallel theories all get partial, unfinished investigation simultaneously, which is often slower than picking one reasonable path and following it through.", "id": "q085"}, {"tab": "Tricky Scenarios", "group": "High-Pressure Incidents", "tricky": true, "realtime": true, "q": "You made a change during an incident that you believed would fix it, but it actually made things worse. How do you handle that moment, live, in front of the team?", "a": "Say it immediately and plainly \u2014 'that was my change, it made it worse, here's what I did, rolling it back now' \u2014 the worst version of this is hesitating or downplaying it while things degrade further because owning it feels uncomfortable. Speed of disclosure matters more than anything else in that moment, because every minute someone else spends investigating a cause that's actually your own change is a minute wasted. I'd execute the rollback myself immediately if I can, or hand it to whoever can do it fastest, then only after the immediate bleeding is stopped, explain what I was trying to do and why it didn't work \u2014 that explanation is useful for the post-incident review, not for the middle of the incident itself. Afterward, in the actual postmortem, I'd walk through it blamelessly and honestly \u2014 what I assumed that turned out wrong, what check I skipped that would have caught it, what I'd do differently \u2014 because that's genuinely useful process improvement, and I've found teams respect directness about a real mistake far more than a well-hedged non-admission.", "id": "q086"}, {"tab": "Tricky Scenarios", "group": "Diagnostic Puzzles", "tricky": true, "realtime": true, "q": "A deployment pipeline has been completely unchanged for six months, no code changes to the pipeline itself, but it's been getting progressively slower over the last three weeks \u2014 no single dramatic failure, just creeping slowness. How do you approach something with no obvious trigger?", "a": "Gradual, trigger-less degradation over weeks points toward something accumulating rather than something that broke \u2014 that framing changes where I look first. Real candidates: artifact repository (Nexus/Artifactory) growing without cleanup, so dependency resolution against an ever-larger index gets progressively slower; a build cache that's supposed to help but has grown stale/bloated and is now doing more harm than good; disk space on the CI runner/agent creeping toward capacity, with filesystem performance degrading as it fills, especially on certain filesystem types; or genuinely growing test suite / codebase size, where 'slower' is actually organic and expected, just never noticed because nobody's been tracking pipeline duration as a metric over time. My actual approach: pull historical pipeline duration data if it exists (most CI systems track this) and look at which specific stage's duration is actually growing, rather than treating 'the pipeline' as one undifferentiated black box \u2014 that narrows the search dramatically. Then correlate that specific stage against what's been growing over the same three-week window \u2014 repo size, cache size, disk usage, dependency count \u2014 rather than guessing. This is also a good argument for why pipeline stage duration should be a tracked, alerted-on metric in the first place, so 'three weeks of silent creep' gets caught at week one instead.", "id": "q087"}, {"tab": "Tricky Scenarios", "group": "Diagnostic Puzzles", "tricky": true, "realtime": true, "q": "A specific application only fails during deployments that happen to land between 2-4am UTC, never at any other time, and the deployment steps and code are identical every time. What's your hypothesis-generation process for something this specific?", "a": "A time-window-specific pattern this precise almost never means the deployment logic itself is at fault \u2014 identical steps succeeding at other times rules that out directly \u2014 so I'd look for what else is scheduled or different specifically in that window. Real candidates: a scheduled batch job, backup window, or maintenance task that runs in that exact window and contends for the same resources (disk I/O from a backup job, a database maintenance/vacuum window, a batch ETL job) \u2014 deployments doing anything resource-intensive (restarting services, warming caches, running migrations) colliding with another scheduled heavy process is a very plausible real cause. Second: a downstream dependency that has its own scheduled maintenance in that window \u2014 an upstream service, a database replica sync, a certificate rotation job \u2014 that the deploying application depends on and that's simply unavailable or degraded during that specific window regardless of what's deploying. Third, less likely but worth ruling out cheaply: a time-zone-related logic bug that's coincidentally more likely to trigger during that specific UTC window (a date-rollover edge case, a scheduled cache-expiry). My actual first move: check the on-prem environment's full job/cron/scheduler inventory for anything else running 2-4am UTC before investigating the deploying application's own code at all \u2014 the specificity of the time window is the single biggest clue and it's cheap to check against a schedule inventory before going deeper.", "id": "q088"}, {"tab": "Communication & Leadership", "group": "Cross-Team Working", "tricky": false, "realtime": false, "q": "What actually makes cross-country stakeholder collaboration (UK and Poland here) work well versus poorly, from your experience?", "a": "Explicit, written communication as the default, not an afterthought \u2014 decisions, action items, and status need to live somewhere both teams can reference asynchronously, not just in a meeting one side attended and the other heard about secondhand. Overlap-hour discipline \u2014 UK and Poland have a comfortable working-hours overlap (roughly an hour's time difference), which is genuinely favorable compared to many distributed setups, but I'd still be deliberate about scheduling anything requiring live discussion inside that overlap rather than assuming it'll just work out. Clear, unambiguous ownership per component/service, documented, so 'who do I even ask about this' never becomes its own delay. And genuinely treating both sides as equal technical partners rather than one team being the 'main' team and the other being support \u2014 that dynamic, even unintentional, tends to create information asymmetry where the 'support' side finds out about decisions after the fact rather than being part of making them, which erodes trust and slows everything down over time.", "id": "q089"}, {"tab": "Communication & Leadership", "group": "Cross-Team Working", "tricky": true, "realtime": true, "q": "You're implementing a change that the Poland-based team will need to operate day-to-day after you hand it off, but you're under deadline pressure and tempted to just ship it with minimal documentation and explain it 'later.' What's the actual cost of that shortcut, and what would you do instead?", "a": "The shortcut doesn't actually save time, it moves the cost \u2014 'explain it later' usually means multiple ad-hoc explanations repeated to different people as questions come up piecemeal, interrupt-driven, at the worst possible moments (usually when something's already gone wrong and they're troubleshooting blind), which costs more total time than writing it once, upfront, clearly. What I'd actually do under real deadline pressure: write a minimal but genuinely sufficient runbook \u2014 what this does, how to check it's healthy, the two or three most likely failure modes and what to do about each \u2014 rather than either full comprehensive documentation (too slow under pressure) or nothing (creates the exact problem above). I'd also do a short live walkthrough with the Poland team specifically, even 15 minutes, because a live walkthrough surfaces the questions they'll actually have far faster than them discovering gaps in written docs on their own later \u2014 and I'd rather find out what's unclear now, from a calm conversation, than at 2am when they're the ones on call for it.", "id": "q090"}, {"tab": "Communication & Leadership", "group": "Team & Ownership", "tricky": false, "realtime": false, "q": "As a senior engineer expected to operate with real autonomy across geographically distributed stakeholders, how do you decide what to escalate versus what to just handle yourself?", "a": "I escalate when a decision genuinely crosses into risk or scope beyond what I have context or authority for \u2014 real business risk tradeoffs (accepting a security finding, shipping under uncertainty, a cost decision with real budget impact), anything touching a commitment made to a stakeholder I wasn't part of the original conversation with, or a decision where getting it wrong is expensive and hard to reverse. I handle it myself when it's within my technical domain, reversible if wrong, and doesn't quietly commit anyone else to something they haven't agreed to \u2014 most day-to-day engineering judgment calls fall here, and constantly escalating those just creates bottleneck and signals I don't trust my own judgment, which isn't the senior-level operating model this kind of role expects. The genuinely useful skill is calibrating that line accurately and consistently, and being willing to say 'I made that call, here's why' after the fact rather than needing permission for every reversible decision \u2014 autonomy that constantly asks permission isn't really autonomy.", "id": "q091"}];
var TABS = ["Ansible", "On-Prem DevOps", "CI/CD Pipelines", "Git & Branching", "Maven & Build", "DevSecOps", "Docker", "Kubernetes & OpenShift", "Scripting", "Observability", "Artifactory & Nexus", "Cloud AWS/Azure", "Release Management", "Enterprise Infra", "PostgreSQL & Unix", "Tricky Scenarios", "Communication & Leadership"];
var TAB_GROUPS = {"Ansible": ["Core Concepts", "Playbooks & Roles", "Vault & Secrets", "Inventory & Scale", "Troubleshooting", "Enterprise Ansible"], "On-Prem DevOps": ["Fundamentals", "Environment Management", "Middleware & App Servers"], "CI/CD Pipelines": ["Pipeline Design", "Jenkins & Groovy", "Deployment Strategies", "Pipeline Reliability"], "Git & Branching": ["Strategy Design", "Git Mechanics"], "Maven & Build": ["Core Maven", "Artifact Versioning"], "DevSecOps": ["Static & Dynamic Analysis", "Container & Dependency Security"], "Docker": ["Image Building", "Runtime Behavior"], "Kubernetes & OpenShift": ["OpenShift Specifics", "Troubleshooting", "Resource Management", "Networking"], "Scripting": ["Shell", "Python", "Groovy"], "Observability": ["Prometheus", "ELK Stack", "OpenTelemetry"], "Artifactory & Nexus": ["Repository Management"], "Cloud AWS/Azure": ["Hybrid & CI/CD Integration", "Core Services & IAM"], "Release Management": ["Coordination & Process"], "Enterprise Infra": ["Networking", "Storage & Servers"], "PostgreSQL & Unix": ["PostgreSQL Ops", "Unix Administration"], "Tricky Scenarios": ["High-Pressure Incidents", "Diagnostic Puzzles"], "Communication & Leadership": ["Cross-Team Working", "Team & Ownership"]};
var STORAGE_KEY = "senior-devops-ansible-onprem-mastery-v1";

let state = {
  currentTab: TABS[0],
  activePill: null,
  search: "",
  unmasteredOnly: false,
  expandedIds: new Set(),
  allExpanded: false,
};

function loadMastery() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch(e) { return {}; }
}
function saveMastery(m) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(m)); } catch(e) {}
}
let mastery = loadMastery();

function itemsForTab(tab) {
  return ITEMS.filter(i => i.tab === tab);
}

function renderSidebar() {
  const wrap = document.getElementById('tab-list');
  wrap.innerHTML = '';
  TABS.forEach(tab => {
    const count = itemsForTab(tab).length;
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (tab === state.currentTab ? ' active' : '');
    btn.innerHTML = `<span>${escapeHtml(tab)}</span><span class="cnt">${count}</span>`;
    btn.addEventListener('click', () => {
      state.currentTab = tab;
      state.activePill = null;
      state.search = "";
      document.getElementById('search').value = "";
      state.allExpanded = false;
      state.expandedIds.clear();
      renderAll();
    });
    wrap.appendChild(btn);
  });
}

function renderPills() {
  const wrap = document.getElementById('pills');
  wrap.innerHTML = '';
  const groups = TAB_GROUPS[state.currentTab] || [];
  groups.forEach(g => {
    const count = itemsForTab(state.currentTab).filter(i => i.group === g).length;
    const pill = document.createElement('div');
    pill.className = 'pill' + (state.activePill === g ? ' active' : '');
    pill.textContent = `${g} (${count})`;
    pill.addEventListener('click', () => {
      state.activePill = state.activePill === g ? null : g;
      renderList();
    });
    wrap.appendChild(pill);
  });
}

function matchesSearch(item, q) {
  if (!q) return true;
  const hay = (item.q + ' ' + item.a + ' ' + (item.code||'')).toLowerCase();
  return hay.includes(q.toLowerCase());
}

function highlight(text, q) {
  if (!q) return escapeHtml(text);
  const esc = escapeHtml(text);
  try {
    const re = new RegExp('(' + q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
    return esc.replace(re, '<mark>$1</mark>');
  } catch(e) { return esc; }
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function currentFiltered() {
  let list = itemsForTab(state.currentTab);
  if (state.activePill) list = list.filter(i => i.group === state.activePill);
  if (state.search) list = list.filter(i => matchesSearch(i, state.search));
  if (state.unmasteredOnly) list = list.filter(i => !mastery[i.id]);
  return list;
}

function renderList() {
  renderPills();
  const list = currentFiltered();
  const container = document.getElementById('list');
  container.innerHTML = '';

  const heading = document.createElement('div');
  heading.innerHTML = `<div class="tab-heading">${escapeHtml(state.currentTab)}</div>
    <div class="tab-sub">${list.length} question${list.length===1?'':'s'} shown</div>`;
  container.appendChild(heading);

  if (list.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = 'No questions match the current filter/search.';
    container.appendChild(empty);
  }

  list.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card' + (state.expandedIds.has(item.id) ? ' expanded' : '');
    card.dataset.id = item.id;

    const isMastered = !!mastery[item.id];
    const badges = [];
    if (item.tricky) badges.push('<span class="badge tricky">TRICKY</span>');
    if (item.realtime) badges.push('<span class="badge realtime">REAL-TIME</span>');
    badges.push(`<span class="badge group">${escapeHtml(item.group)}</span>`);

    const head = document.createElement('div');
    head.className = 'card-head';
    head.innerHTML = `
      <input type="checkbox" class="mastery-check" ${isMastered ? 'checked' : ''}>
      <div class="card-q">
        ${highlight(item.q, state.search)}
        <div class="badges">${badges.join('')}</div>
      </div>
      <div class="chevron">&#9656;</div>
    `;
    head.querySelector('.mastery-check').addEventListener('click', (e) => {
      e.stopPropagation();
      if (e.target.checked) mastery[item.id] = true; else delete mastery[item.id];
      saveMastery(mastery);
      updateStats();
    });
    head.addEventListener('click', (e) => {
      if (e.target.classList.contains('mastery-check')) return;
      if (state.expandedIds.has(item.id)) state.expandedIds.delete(item.id);
      else state.expandedIds.add(item.id);
      card.classList.toggle('expanded');
    });

    const body = document.createElement('div');
    body.className = 'card-body';
    let bodyHtml = `<div class="card-answer">${highlight(item.a, state.search)}</div>`;
    if (item.code) {
      bodyHtml += `<div class="card-code">${escapeHtml(item.code)}</div>`;
    }
    body.innerHTML = bodyHtml;

    card.appendChild(head);
    card.appendChild(body);
    container.appendChild(card);
  });

  updateStats();
}

function updateStats() {
  const list = currentFiltered();
  const masteredCount = list.filter(i => mastery[i.id]).length;
  const totalMastered = ITEMS.filter(i => mastery[i.id]).length;
  document.getElementById('statText').textContent = `${totalMastered} / ${ITEMS.length} mastered overall (${masteredCount}/${list.length} in view)`;
  const pct = ITEMS.length ? Math.round((totalMastered / ITEMS.length) * 100) : 0;
  document.getElementById('statFill').style.width = pct + '%';
  document.getElementById('statPct').textContent = pct + '%';
}

function renderAll() {
  renderSidebar();
  renderList();
}

document.getElementById('search').addEventListener('input', (e) => {
  state.search = e.target.value;
  renderList();
});

document.getElementById('expandAllBtn').addEventListener('click', () => {
  const list = currentFiltered();
  const allCurrentlyExpanded = list.every(i => state.expandedIds.has(i.id)) && list.length > 0;
  if (allCurrentlyExpanded) {
    list.forEach(i => state.expandedIds.delete(i.id));
  } else {
    list.forEach(i => state.expandedIds.add(i.id));
  }
  renderList();
  document.querySelectorAll('.card').forEach(c => {
    if (state.expandedIds.has(c.dataset.id)) c.classList.add('expanded');
  });
  updateExpandBtnLabel();
});

function updateExpandBtnLabel() {
  const list = currentFiltered();
  const allExpanded = list.length > 0 && list.every(i => state.expandedIds.has(i.id));
  document.getElementById('expandAllBtn').textContent = allExpanded ? 'Collapse All' : 'Expand All';
}

document.getElementById('unmasteredBtn').addEventListener('click', (e) => {
  state.unmasteredOnly = !state.unmasteredOnly;
  e.target.classList.toggle('active-toggle', state.unmasteredOnly);
  renderList();
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if (confirm('Reset all mastery progress? This cannot be undone.')) {
    mastery = {};
    saveMastery(mastery);
    renderList();
  }
});

// re-render list also updates expand button label
const origRenderList = renderList;
renderList = function() { origRenderList(); updateExpandBtnLabel(); };

renderAll();
</script>
</body>
</html>

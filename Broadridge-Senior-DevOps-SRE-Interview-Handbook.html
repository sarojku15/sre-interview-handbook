<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Broadridge — Senior DevOps/SRE Interview Handbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root {
    --bg: #0B0E14;
    --bg-alt: #0E131C;
    --surface: #131A24;
    --surface-2: #1A2230;
    --border: #232C3A;
    --text: #E6EDF3;
    --text-muted: #8B96A5;
    --text-dim: #5B6472;
    --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Consolas, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --success: #2DD4BF;
    --radius: 8px;
    --sidebar-w: 305px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  button, input { font-family: inherit; }
  button:focus-visible, input:focus-visible, .nav-item:focus-visible {
    outline: 2px solid var(--success);
    outline-offset: 2px;
  }

  /* ---------- Terminal header ---------- */
  .terminal-header {
    background: linear-gradient(180deg, #10151F, #0B0E14);
    border-bottom: 1px solid var(--border);
  }
  .terminal-titlebar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
  }
  .traffic-lights { display: flex; gap: 8px; }
  .tl-dot { width: 12px; height: 12px; border-radius: 50%; }
  .tl-dot.red { background: #FF5F56; }
  .tl-dot.yellow { background: #FFBD2E; }
  .tl-dot.green { background: #27C93F; }
  .terminal-title {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--text-muted);
    margin-left: 10px;
  }
  .terminal-prompt {
    font-family: var(--mono);
    padding: 14px 20px 6px;
    font-size: 14px;
    color: var(--text);
  }
  .prompt-user { color: #6FCF97; }
  .prompt-path { color: #56B6E9; }
  .cursor {
    display: inline-block;
    width: 8px; height: 15px;
    background: var(--success);
    margin-left: 3px;
    vertical-align: -3px;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .header-stats {
    display: flex;
    align-items: center;
    gap: 26px;
    flex-wrap: wrap;
    padding: 6px 20px 20px;
  }
  .stat-block { display: flex; flex-direction: column; gap: 2px; }
  .stat-value { font-family: var(--mono); font-size: 19px; font-weight: 600; color: var(--text); }
  .stat-label { font-family: var(--mono); font-size: 10.5px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .07em; }
  .progress-bar-outer { flex: 1; min-width: 140px; height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; align-self: center; }
  .progress-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #2DD4BF, #38BDF8); transition: width .4s ease; }

  /* ---------- Layout ---------- */
  .layout { display: flex; align-items: flex-start; }
  .sidebar {
    width: var(--sidebar-w);
    flex-shrink: 0;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    background: var(--bg-alt);
    border-right: 1px solid var(--border);
    padding: 18px 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .search-input {
    width: 100%;
    padding: 10px 12px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 13.5px;
  }
  .search-input::placeholder { color: var(--text-dim); }
  .unreviewed-row {
    display: flex; align-items: center; gap: 8px;
    font-size: 12.5px; color: var(--text-muted);
    padding: 0 2px;
  }
  .section-nav { display: flex; flex-direction: column; gap: 3px; overflow-y: auto; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    width: 100%; text-align: left;
    padding: 9px 10px;
    border-radius: var(--radius);
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-muted);
    font-size: 12.5px;
    cursor: pointer;
  }
  .nav-item:hover { background: var(--surface); color: var(--text); }
  .nav-item.active { background: var(--surface-2); border-color: var(--border); color: var(--text); }
  .nav-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .nav-label { flex: 1; line-height: 1.3; }
  .nav-count { font-family: var(--mono); font-size: 10.5px; color: var(--text-dim); flex-shrink: 0; }
  .sidebar-footer { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--border); }
  .reset-btn {
    width: 100%; background: transparent; border: 1px solid var(--border);
    color: var(--text-dim); padding: 8px; border-radius: var(--radius);
    font-size: 11.5px; cursor: pointer;
  }
  .reset-btn:hover { color: #F08080; border-color: #F08080; }

  .main-content { flex: 1; min-width: 0; padding: 26px 34px 90px; }
  .section-heading {
    font-family: var(--mono);
    font-size: 14.5px; font-weight: 600; letter-spacing: .03em;
    text-transform: uppercase;
    color: var(--text);
    display: flex; align-items: baseline; gap: 10px;
    padding-bottom: 9px;
    margin: 38px 0 16px;
    border-bottom: 2px solid var(--accent, var(--border));
  }
  .q-section:first-child .section-heading { margin-top: 0; }
  .section-count { font-family: var(--mono); font-size: 11px; color: var(--text-dim); font-weight: 400; text-transform: none; letter-spacing: 0; }

  .q-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 4px solid var(--accent);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 14px;
  }
  .q-card-header { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; }
  .tech-tag { font-family: var(--mono); font-size: 10.5px; padding: 3px 9px; border-radius: 999px; border: 1px solid; white-space: nowrap; }
  .mastery-toggle { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); cursor: pointer; white-space: nowrap; }
  .mastery-toggle input { cursor: pointer; }
  .q-text { font-size: 15.5px; font-weight: 600; color: var(--text); margin: 0 0 10px; line-height: 1.45; }
  .a-text { font-size: 14.5px; color: #C3CCD8; line-height: 1.66; }
  .a-text p { margin: 0 0 10px; }
  .a-text p:last-child { margin-bottom: 0; }
  .a-text code { font-family: var(--mono); background: var(--surface-2); padding: 1px 5px; border-radius: 4px; font-size: 12.5px; color: #7EE7C7; }
  .code-block {
    font-family: var(--mono);
    background: #0A0D13;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 13px 15px;
    font-size: 12.8px;
    color: #D4DDE6;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-word;
    margin-top: 12px;
  }
  .empty-state { color: var(--text-dim); padding: 70px 0; text-align: center; font-size: 14px; }

  /* ---------- Mobile ---------- */
  .menu-toggle { display: none; }
  .sidebar-backdrop { display: none; }
  @media (max-width: 900px) {
    .menu-toggle {
      display: flex; align-items: center; gap: 8px;
      position: sticky; top: 0; z-index: 40; width: 100%;
      background: var(--bg-alt); border: none; border-bottom: 1px solid var(--border);
      color: var(--text); font-family: var(--mono); font-size: 13px;
      padding: 13px 16px; cursor: pointer;
    }
    .sidebar {
      position: fixed; top: 0; left: 0; z-index: 50; height: 100vh;
      transform: translateX(-105%);
      transition: transform .25s ease;
      box-shadow: 6px 0 28px rgba(0,0,0,.55);
    }
    .sidebar.open { transform: translateX(0); }
    .sidebar-backdrop.open {
      display: block; position: fixed; inset: 0;
      background: rgba(0,0,0,.5); z-index: 45;
    }
    .main-content { padding: 18px 16px 70px; }
    .header-stats { gap: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .cursor { animation: none; opacity: 1; }
    .sidebar { transition: none; }
    .progress-bar-fill { transition: none; }
  }
</style>
</head>

<script>
  var STORAGE_KEY = 'sr-devops-sre-8yr-aws-handbook-mastery';

  var SECTIONS = [
    { id: 'aws',         label: 'AWS Cloud & CLI',                              color: '#FF9900' },
    { id: 'cicd',        label: 'CI/CD — Jenkins & TeamCity',                   color: '#D33833' },
    { id: 'terraform',   label: 'Terraform',                                    color: '#7B42BC' },
    { id: 'chef',        label: 'Chef',                                         color: '#2E8B57' },
    { id: 'scripting',   label: 'Scripting — Shell / PowerShell / Python',      color: '#306998' },
    { id: 'ecs',         label: 'ECS Containers',                               color: '#16A085' },
    { id: 'monitoring',  label: 'Monitoring — Splunk & Datadog',                color: '#8B5CF6' },
    { id: 'artifactory', label: 'JFrog Artifactory',                            color: '#41BF47' },
    { id: 'sql',         label: 'SQL & PostgreSQL',                             color: '#336791' },
    { id: 'incident',    label: 'Incident & Production Support',                color: '#E63946' },
    { id: 'k8s',         label: 'K8s Ecosystem — EKS / Helm / GitOps / ECR',    color: '#326CE5' },
    { id: 'sre',         label: 'SRE Principles & Architecture Mindset',        color: '#00B8A9' },
    { id: 'secrets',     label: 'Secrets Management & Vault',                   color: '#FFC107' },
    { id: 'security',    label: 'Security & Vulnerability Scanning',            color: '#EF476F' },
    { id: 'scenarios',   label: 'Production Troubleshooting Scenarios',         color: '#9AA5B1' },
    { id: 'behavioral',  label: 'Behavioral, Ownership & Closing',              color: '#457B9D' }
  ];

  var questions = [{"id": "aws-1", "section": "aws", "q": "Walk me through the core AWS services you'd expect to touch daily in a role like this.", "a": "For a role centered on scalable, secure infra, the daily set usually breaks into five groups: **compute** (EC2 for general workloads, ECS for containers per this JD), **networking** (VPC, subnets, route tables, Route53, ALB/NLB), **storage** (S3, EBS), **data** (RDS/PostgreSQL per this JD), and **operations** (IAM, CloudWatch, Systems Manager, CloudTrail). The honest framing for a senior candidate isn't reciting the list — it's explaining how they compose: a request hits Route53, terminates at an ALB, routes to an ECS service running in private subnets, which talks to RDS, while CloudWatch and the observability stack watch the whole path end to end."}, {"id": "aws-2", "section": "aws", "q": "How do you design a VPC for a production workload — walk through subnets, route tables, and internet access.", "a": "Start with CIDR sizing that leaves room to grow (a /16 for the VPC, /20 or /24 subnets per AZ). Split into public subnets (hold the NAT Gateway and internet-facing load balancers, route 0.0.0.0/0 to an Internet Gateway) and private subnets (hold application and database tiers, route 0.0.0.0/0 to a NAT Gateway for outbound-only access). Spread both subnet tiers across at least two, ideally three, AZs for resilience. Each AZ typically gets its own NAT Gateway to avoid cross-AZ data transfer charges and a single point of failure, though smaller environments sometimes accept one NAT Gateway as a cost trade-off. Database subnets are usually a third, even more restricted tier with no route to the internet at all."}, {"id": "aws-3", "section": "aws", "q": "Explain IAM roles vs. users vs. policies vs. groups, and what 'least privilege' means in practice.", "a": "A **user** is a long-lived identity for a person or an application needing static credentials. A **role** is an identity that's assumed temporarily — by an EC2 instance, an ECS task, a Lambda function, or a federated human — and issues short-lived credentials via STS, which is why AWS pushes roles over long-lived access keys wherever possible. A **group** bundles users to attach policies once instead of per-user. A **policy** is the actual JSON document defining allowed/denied actions on resources. Least privilege in practice means starting from zero access and adding only the specific actions and resource ARNs a workload needs — not attaching `AdministratorAccess` because it's faster, and using an instance profile (a role attached to EC2) or an ECS task role instead of baking an access key into an AMI or container image."}, {"id": "aws-4", "section": "aws", "q": "What's the difference between Security Groups and Network ACLs, and when do you use each?", "a": "Security Groups are **stateful** and attached at the instance/ENI level — if you allow inbound traffic on a port, the response traffic is automatically allowed out, and rules are evaluated as an allow-list only (no explicit deny). NACLs are **stateless** and attached at the subnet level — you need explicit rules for both directions, and they support explicit deny rules, evaluated in numbered order. In practice, Security Groups do almost all of the day-to-day access control work; NACLs are mostly used as a coarse subnet-level backstop, for example explicitly blocking a known-bad CIDR range at the subnet boundary regardless of what any security group allows."}, {"id": "aws-5", "section": "aws", "q": "How do Auto Scaling Groups work, and what scaling policies would you pick for a typical web service?", "a": "An ASG wraps a launch template (AMI, instance type, user data, IAM instance profile) and a set of subnets/AZs, and keeps a desired number of healthy instances running, replacing any that fail health checks. For scaling policy, **target tracking** is the default choice for most services — pick a metric like average CPU or an ALB request-count-per-target and a target value, and AWS manages the scale-out/scale-in math. **Step scaling** is for workloads with sharper, less linear load curves where you want different scaling magnitudes at different alarm breach levels. **Scheduled scaling** covers predictable patterns, like scaling out before a known daily batch job or traffic spike. Health checks matter as much as the policy — using ELB health checks instead of just EC2 status checks so the ASG replaces instances that are up but not actually serving traffic correctly."}, {"id": "aws-6", "section": "aws", "q": "ALB vs NLB vs the older Classic Load Balancer — how do you choose?", "a": "**ALB** operates at layer 7 and is the default choice for HTTP/HTTPS workloads — it supports path- and host-based routing, WebSockets, and integrates natively with ECS/EKS target groups, which is why it's the standard front door for containerized services. **NLB** operates at layer 4, handles millions of requests per second with ultra-low latency, preserves the client source IP, and supports static IPs/Elastic IPs and non-HTTP protocols like raw TCP or gRPC where you need it — it's the pick for extreme throughput or for exposing something that isn't plain HTTP. **CLB** is the legacy option; you'd basically only see it maintaining an old stack, not choosing it new."}, {"id": "aws-7", "section": "aws", "q": "Explain S3 storage classes, lifecycle policies, and the difference between a bucket policy and an IAM policy.", "a": "Storage classes trade cost against retrieval speed/availability: **Standard** for frequently accessed data, **Standard-IA**/**One Zone-IA** for infrequent access with a retrieval fee, **Glacier Instant/Flexible/Deep Archive** for cold archival with retrieval times from minutes to many hours. A **lifecycle policy** automates the transition — for example, move build artifacts to IA after 30 days and Glacier after 90, or expire old log objects after a year. On access control: a **bucket policy** is a resource-based policy attached to the bucket itself and is the standard way to grant cross-account access; an **IAM policy** is attached to a user/role and governs what that identity can do across resources. When both exist, access is only allowed if neither explicitly denies it — an explicit Deny anywhere always wins."}, {"id": "aws-8", "section": "aws", "q": "RDS Multi-AZ vs Read Replicas — what problem does each solve, and how do you approach backups?", "a": "**Multi-AZ** is for availability: a synchronous standby in a second AZ that RDS fails over to automatically if the primary has a problem — it doesn't help with read scaling since the standby isn't queryable. **Read Replicas** are for read scaling: asynchronous, can be in the same region or cross-region, and can be promoted to a standalone instance if needed, but replication lag means they're eventually consistent, not a DR mechanism by themselves. A production setup often combines both — Multi-AZ for the primary's availability, plus one or more read replicas to offload reporting/analytics traffic. For backups: automated daily snapshots plus transaction log shipping gives point-in-time recovery within the retention window (up to 35 days), and a manual snapshot before any risky schema change or major version upgrade is cheap insurance."}, {"id": "aws-9", "section": "aws", "q": "How do you manage multiple AWS environments from the CLI, and what's a query you'd actually use day to day?", "a": "Named profiles in `~/.aws/credentials` and `~/.aws/config` keep environments (dev/staging/prod, or separate client accounts) isolated, switched with `--profile` or the `AWS_PROFILE` env var; for role-based access, `assume_role` profiles or `aws sso login` handle temporary credentials without ever storing a long-lived prod key on a laptop. Day to day, `--query` with JMESPath and `--output table` turn a giant JSON blob into something scannable without piping through `jq` — for example, listing unhealthy targets behind a load balancer, or every EC2 instance missing a required tag before a cost or compliance audit.", "code": "aws ec2 describe-instances \\\n  --profile prod \\\n  --query 'Reservations[].Instances[?!not_null(Tags[?Key==`Owner`])].[InstanceId,State.Name]' \\\n  --output table\n\n# Target health for an ALB target group\naws elbv2 describe-target-health \\\n  --target-group-arn arn:aws:elasticloadbalancing:...:targetgroup/app-tg/abc123 \\\n  --query 'TargetHealthDescriptions[?TargetHealth.State!=`healthy`]'"}, {"id": "aws-10", "section": "aws", "q": "How do you set up meaningful CloudWatch monitoring for a production service?", "a": "Start from the metrics that actually predict user impact rather than everything the platform emits by default: for compute, CPU/memory (via the CloudWatch Agent, since memory isn't a default EC2 metric) and ASG in-service count; for the load balancer, target response time, 4xx/5xx rate, and unhealthy host count; for the database, connections, CPU, and free storage. Alarms should be tied to those with sensible thresholds and an SNS topic for notification, and composite alarms help avoid noise when several related metrics degrade together during the same event. Application logs go to CloudWatch Logs via the agent or the container's log driver, with log groups organized per service and retention set explicitly — the default is 'never expire,' which quietly becomes a cost problem. Custom metrics (via `put-metric-data` or embedded metric format from the app) fill the gap for anything business- or application-specific that the platform doesn't emit natively."}, {"id": "aws-11", "section": "aws", "q": "How would you design for high availability and disaster recovery across AZs and regions?", "a": "Within a region, HA means spreading every tier across at least two AZs — ASG instances, ECS tasks, RDS Multi-AZ, NAT Gateways per AZ — so a single AZ failure doesn't take the service down. Across regions, the DR strategy depends on the RTO/RPO the business actually needs, not the most resilient option available: **backup and restore** (cheapest, RPO/RTO measured in hours) for non-critical systems; **pilot light** (core infra kept warm, scaled up on failover) for a middle tier; **warm standby** (a scaled-down but live copy) or **multi-site active-active** for the systems where minutes of downtime is unacceptable. The honest answer in an interview is naming which tier a given workload actually warrants, rather than defaulting to 'always active-active' — that's usually over-engineering relative to the business requirement and cost."}, {"id": "aws-12", "section": "aws", "q": "What cost-optimization levers do you reach for on an AWS bill that's grown out of control?", "a": "First pass is always **visibility** — Cost Explorer and Cost and Usage Reports broken down by tag/service to find the actual driver rather than guessing. Common wins: **rightsizing** over-provisioned instances (Compute Optimizer flags these automatically), moving steady-state workloads to **Savings Plans or Reserved Instances**, using **Spot** for fault-tolerant/batch workloads, cleaning up **orphaned resources** (unattached EBS volumes, old snapshots, unused Elastic IPs, idle load balancers), and checking **NAT Gateway data-processing charges**, which are an easy-to-miss cost that scales with egress traffic — sometimes a VPC endpoint for S3/DynamoDB is cheaper than routing that traffic through NAT. On the Kubernetes/ECS side, `Compute Savings Plans` cover Fargate too, and switching to Graviton (ARM) instances where the workload supports it is often a straightforward 10-20% saving."}, {"id": "aws-13", "section": "aws", "q": "What do you use AWS Systems Manager for beyond basic patching?", "a": "**Parameter Store** is a lightweight, free config and secrets store (SecureString parameters use KMS) — a common alternative to a heavier 3rd-party secrets tool for straightforward key/value config. **Session Manager** gives shell access to an instance without opening SSH inbound or managing bastion hosts and key pairs, which is both a security and an operational win, and it's auditable via CloudTrail. **Patch Manager** automates OS patching on a schedule against defined maintenance windows. **Run Command** executes ad hoc commands across a fleet without SSH — useful for one-off remediation across many instances at once, like restarting an agent or rotating a log file, without a full deployment."}, {"id": "cicd-1", "section": "cicd", "q": "Explain Jenkins architecture — controller vs agents — and how it scales.", "a": "The **controller** (historically 'master') schedules jobs, serves the UI, and stores configuration and job history, but shouldn't run heavy builds itself in a production setup. **Agents** (nodes) are the actual build executors — static, permanent VMs, or increasingly dynamic ones spun up on demand (via the Kubernetes plugin, EC2 plugin, or Docker) and torn down after the build finishes. Scaling is mostly about the agent layer: labels route specific jobs to agents with the right toolchain, and dynamic agents (especially Kubernetes-based, where each build gets a fresh pod) avoid the classic 'works on this one Jenkins node but not that one' drift problem and let capacity scale to zero when there's no work."}, {"id": "cicd-2", "section": "cicd", "q": "Declarative vs scripted Jenkins pipelines — what's the real difference, and which do you default to?", "a": "**Declarative** pipelines use a structured, opinionated syntax (`pipeline { agent {} stages {} }`) with built-in support for things like `post` blocks, `options`, and `parameters` — easier to read, lint, and standardize across a team, and it's the default for the vast majority of pipelines. **Scripted** pipelines are raw Groovy with full programmatic control — loops, complex conditionals, dynamic stage generation — useful for genuinely complex orchestration logic that declarative syntax can't express cleanly. In practice, teams default to declarative and drop into a scripted block (`script { ... }`) inside a stage only for the specific piece of logic that needs it, rather than writing the whole pipeline as scripted.", "code": "pipeline {\n  agent { label 'linux-docker' }\n  options { timestamps(); timeout(time: 30, unit: 'MINUTES') }\n  stages {\n    stage('Build')  { steps { sh 'make build' } }\n    stage('Test')   { steps { sh 'make test' } }\n    stage('Deploy') {\n      when { branch 'main' }\n      steps { sh 'make deploy ENV=prod' }\n    }\n  }\n  post {\n    failure { slackSend channel: '#deploys', message: \"Build failed: ${env.BUILD_URL}\" }\n  }\n}"}, {"id": "cicd-3", "section": "cicd", "q": "What are Jenkins shared libraries, and why would a team invest in them?", "a": "A shared library is a Groovy codebase, versioned in its own repo, that pipelines across the org import (`@Library('my-lib') _`) to reuse common logic instead of copy-pasting the same 40-line deployment stage into every Jenkinsfile. Typical contents: standardized build/test/deploy steps, notification helpers, and org-wide guardrails like enforcing a security scan stage. The payoff is consistency and maintainability at scale — fixing a bug or adding a required stage happens once in the library instead of once per repo, and it becomes the natural place to encode 'how this org actually deploys' as reusable code rather than tribal knowledge in each team's Jenkinsfile."}, {"id": "cicd-4", "section": "cicd", "q": "How do you handle credentials securely in a Jenkins pipeline?", "a": "Everything goes through the **Credentials plugin** — never a hardcoded secret in a Jenkinsfile or a shell step, since that would leak in build logs and source control. Credentials are stored encrypted in Jenkins and referenced by ID, then either bound to environment variables with `withCredentials([usernamePassword(...)])`/`string(...)` for the scope of a single step, or pulled dynamically from a real secrets backend (Vault, AWS Secrets Manager) via a plugin so Jenkins itself isn't the long-term source of truth. Jenkins also masks known credential values in console output automatically, but that's a safety net, not a substitute for scoping credentials tightly (folder- or job-level rather than globally available to every pipeline) and rotating them."}, {"id": "cicd-5", "section": "cicd", "q": "How do you add and manage build agents/nodes at scale?", "a": "Static agents are registered manually or via JNLP/SSH and tagged with **labels** describing their capabilities (e.g. `linux-docker`, `windows-dotnet`), and pipelines target a label rather than a specific node name so jobs aren't tied to one machine's availability. At scale, the better pattern is dynamic provisioning — the Kubernetes plugin spins up a pod per build defined by a pod template (with the exact tool image the job needs) and tears it down after, so there's no persistent fleet to patch and no cross-build state leakage. Executors-per-node controls concurrency per agent; getting that wrong (too high) is a common cause of flaky builds from resource contention on a shared box."}, {"id": "cicd-6", "section": "cicd", "q": "What is TeamCity, and how do its core concepts map to what you already know from Jenkins?", "a": "TeamCity is JetBrains' CI/CD server, built around **Build Configurations** (roughly Jenkins' 'job'/pipeline), **VCS Roots** (a reusable, decoupled definition of a source repo and branch spec — one VCS root can be shared by several configurations, which is cleaner than Jenkins' more ad hoc per-job checkout config), **Build Chains** (dependencies between configurations — build A triggers build B, similar in spirit to Jenkins' pipeline stages but modeled as a graph across separate jobs rather than steps in one job), and **Templates** (shared configuration, TeamCity's rough equivalent to a Jenkins shared library, but as structured settings inheritance rather than Groovy code). TeamCity also has first-class support for configuration as Kotlin DSL, similar in intent to Jenkinsfile-as-code."}, {"id": "cicd-7", "section": "cicd", "q": "Practically, what tends to differ when a team runs TeamCity instead of Jenkins?", "a": "TeamCity leans more toward configuration through its UI backed by structured settings (with Kotlin DSL available for code-based config), while Jenkins leans more toward everything-as-Groovy-code via the Jenkinsfile from day one — both support config-as-code today, but the default posture differs. TeamCity's build chains and dependency management between configurations are more visual and built-in; in Jenkins you'd typically wire that with the Pipeline plugin's `build job:` steps or a multibranch/orchestrator pattern. TeamCity also has strong out-of-the-box .NET/Windows tooling support, which is part of why it shows up more often in Windows-heavy or JetBrains-toolchain shops, while Jenkins' plugin ecosystem is broader but more variable in quality. Functionally the two solve the same problem; the practical skill transfer is high because the underlying CI/CD concepts — triggers, artifacts, agents, pipelines as code — are the same regardless of which UI you're in."}, {"id": "cicd-8", "section": "cicd", "q": "What does 'build once, deploy many' mean, and why does it matter?", "a": "It means the artifact that gets tested is the exact same binary/image/package that gets promoted through every environment — build in CI once, push it to an artifact repository (Artifactory, in this JD), then each environment's deployment stage pulls that same immutable artifact by version/tag rather than rebuilding from source per environment. Rebuilding per environment risks subtle drift (a different dependency version resolves, a different base image gets pulled) so what passed staging isn't provably what's running in prod. The pattern also makes rollback trivial — redeploy the previous artifact version instead of trying to rebuild an old commit."}, {"id": "cicd-9", "section": "cicd", "q": "How do you keep a CI/CD pipeline fast without sacrificing safety?", "a": "Parallelize what's independent — unit test suites split across executors, lint/security-scan/unit-test stages run concurrently rather than serially. Fail fast — cheap, fast checks (lint, unit tests) run before expensive ones (integration tests, full build), so a broken build is caught in seconds, not after a 20-minute integration suite. Cache aggressively — dependency caches (npm/pip/maven) and Docker layer caching cut redundant work on every run. And gate strategically rather than gate everything — not every check needs to block merge; some can run post-merge or nightly if they're slow and lower-signal, keeping the PR feedback loop tight while still running the full suite before a production deploy."}, {"id": "cicd-10", "section": "cicd", "q": "Where does security fit into a CI/CD pipeline you own?", "a": "At minimum: secrets never live in the pipeline definition or environment in plaintext (pulled from a vault at runtime), the pipeline's own service account/IAM role is scoped to only what that pipeline needs to deploy — not broad account access, and dependency/container scanning runs as an actual gate, not just a report nobody reads. For supply-chain concerns, that extends to knowing what went into a build (an SBOM) and, in more mature setups, signing artifacts so a deployment target can verify what it's running actually came from your pipeline and hasn't been tampered with in transit through the artifact repo. The goal is treating the pipeline itself as production infrastructure worth securing, not just the thing that deploys production infrastructure."}, {"id": "cicd-11", "section": "cicd", "q": "Explain Blue-Green, Canary, and Rolling deployments, and how you'd implement one in a pipeline.", "a": "**Rolling** replaces instances/tasks in small batches, so at any moment old and new versions are both serving traffic — no extra infrastructure needed, but rollback means rolling forward again, and a bad version isn't fully isolated during the rollout. **Blue-Green** runs two complete environments; traffic cuts over all at once (e.g. swapping which target group an ALB listener points to), which gives an instant rollback (flip back) at the cost of running double the infrastructure briefly. **Canary** shifts a small percentage of traffic to the new version first, watches error rate/latency, then ramps up — the best blast-radius control of the three, at the cost of needing weighted routing (ALB weighted target groups, or a service mesh) and good enough monitoring to actually trust the canary signal before promoting. In a pipeline, the deploy stage typically drives this through the platform's native primitive — ECS's own deployment configuration for rolling, or a scripted target-group swap for blue-green — gated on a health check or a manual approval step before full cutover."}, {"id": "tf-1", "section": "terraform", "q": "What is Terraform state, and why does remote state matter?", "a": "State is Terraform's record of what it believes exists — the mapping from your resource blocks to real-world resource IDs — and every plan/apply diffs your config against it, not against reality directly. Local state is fine solo, but it's a liability the moment more than one person or one pipeline runs Terraform: two people apply from stale local state and silently fight each other, or a laptop dies and the team loses the source of truth. **Remote state** (S3 as the backend, with DynamoDB for locking) fixes both — shared, durable state, and the lock table prevents two concurrent applies from corrupting it. Losing or hand-editing the state file is one of the most common ways teams get into a genuinely bad Terraform incident, which is why controlling who can run `terraform apply` and against which state matters as much as the code itself."}, {"id": "tf-2", "section": "terraform", "q": "How do you structure Terraform modules for reuse across environments?", "a": "A module wraps a coherent unit of infrastructure (a VPC, an ECS service, an RDS instance) behind input variables and output values, so the same tested module gets called with different variables per environment instead of copy-pasting HCL three times. Good module design keeps the interface small and stable (only expose what callers actually need to vary) and avoids baking environment-specific values inside the module itself — those belong in the calling root module's `.tfvars`. Versioning matters once a module is shared across teams: pin consumers to a module version (via a Git tag or a registry version constraint) so a change to the module doesn't silently ripple into every environment on the next apply.", "code": "module \"ecs_service\" {\n  source  = \"git::https://github.com/org/tf-modules.git//ecs-service?ref=v2.3.0\"\n  name        = \"payments-api\"\n  cluster_arn = module.ecs_cluster.arn\n  cpu         = 512\n  memory      = 1024\n  desired_count = var.environment == \"prod\" ? 6 : 2\n}"}, {"id": "tf-3", "section": "terraform", "q": "Terraform workspaces vs. separate state files per environment — which do you use, and why?", "a": "Workspaces (`terraform workspace new prod`) share the same config and backend but keep separate state per workspace — quick to set up, but the config is identical across environments by design, which becomes awkward the moment prod genuinely needs a different instance count, a different module version, or a different account entirely. The more common pattern at scale is **separate root modules or separate state files per environment** (often per-environment directories or a wrapper like Terragrunt), each with its own backend key and its own `.tfvars` — more files, but explicit, reviewable differences between environments and no risk of accidentally applying against the wrong workspace because someone forgot to `workspace select` first. For a straightforward dev/staging/prod split with genuinely parallel infrastructure, I'd default to separate state per environment for that safety margin, and reserve workspaces for short-lived, truly identical environments like per-PR preview stacks."}, {"id": "tf-4", "section": "terraform", "q": "Walk through the plan/apply workflow you'd want in a CI/CD pipeline, and how you review a plan safely.", "a": "On a PR: `terraform fmt -check` and `terraform validate` run first as cheap sanity checks, then `terraform plan` runs and its output posts back to the PR (via a comment) so reviewers see the actual infrastructure diff alongside the code diff, not just trust the code. `apply` only runs after merge to main, ideally gated by a manual approval step for anything touching prod, and always using the **exact plan file** generated in the plan stage (`terraform apply tfplan`) rather than re-planning at apply time — closing the window where the two could diverge if someone else applied in between. Reviewing the plan itself means reading past the noise for the operations that actually matter: any `-/+` (destroy and recreate) on a stateful resource like a database is the one to stop and question, since that's the difference between a safe change and data loss."}, {"id": "tf-5", "section": "terraform", "q": "How do you detect and handle infrastructure drift?", "a": "Drift is when real-world infrastructure no longer matches state — usually from a manual console change, an out-of-band script, or another tool touching the same resources. `terraform plan` itself is the detection mechanism (it refreshes state against real infra before diffing), so running plan on a schedule in CI against every environment and alerting on unexpected diffs catches drift before someone else's Terraform apply 'fixes' it destructively. To reconcile: if the manual change should be kept, update the Terraform code to match reality and apply so state converges without changing the actual resource; if it shouldn't be kept, apply normally to revert it. The longer-term fix is process, not tooling — locking down console/CLI write access to Terraform-managed resources so drift stops recurring in the first place."}, {"id": "tf-6", "section": "terraform", "q": "Explain state locking and how you'd resolve a stuck lock.", "a": "With an S3+DynamoDB backend, Terraform writes a lock item to the DynamoDB table before any plan/apply that could modify state, and releases it when the operation finishes — this stops two concurrent applies from racing and corrupting the state file. A lock gets 'stuck' when an apply is killed mid-run (a CI job cancelled, a network drop, someone Ctrl-C'ing) without a chance to release it cleanly. The fix is `terraform force-unlock <LOCK_ID>` — but only after confirming no other apply is actually still running, since force-unlocking a genuinely active operation is exactly the corruption scenario locking exists to prevent. In a CI/CD pipeline, this is also a good reason to keep apply jobs from being cancellable mid-flight, or at least to alert if one is force-killed."}, {"id": "tf-7", "section": "terraform", "q": "When and how do you use terraform import to bring existing resources under management?", "a": "`terraform import` is for the case where a resource already exists in AWS — created manually, by a previous tool, or before Terraform adoption — and you want Terraform to manage it going forward without recreating it. The workflow: write a resource block matching the real resource's expected configuration, run `terraform import aws_instance.web i-0abc123` to map that resource address to the real ID in state, then run `terraform plan` and iterate on the HCL until the plan shows no changes — meaning your code now accurately describes what's already running. It's a manual, resource-by-resource process (Terraform 1.5+'s `import` block helps declare imports as code instead of a one-off CLI command), and it's common during a migration to Terraform where legacy infrastructure gets brought in incrementally rather than all at once."}, {"id": "tf-8", "section": "terraform", "q": "Provisioners vs. external data sources vs. null_resource — when should you actually reach for a provisioner, if ever?", "a": "HashiCorp's own guidance is to treat provisioners (`local-exec`, `remote-exec`) as a last resort — they're imperative in a declarative tool, they don't participate cleanly in plan (Terraform can't know what a script will do), and they make state and reality diverge in ways that are hard to reason about. Almost everything people reach for a provisioner to do has a better-modeled alternative: instance bootstrapping belongs in `user_data` or a golden AMI baked with Packer, not a `remote-exec` SSH script; pulling external data belongs in a `data` source or `external` data source, not a `local-exec` writing to a file Terraform then reads. The rare legitimate case is a genuinely one-off, non-idempotent action with no Terraform-native equivalent — even then, a `null_resource` with `triggers` to control exactly when it re-runs, rather than an inline provisioner on a real resource."}, {"id": "tf-9", "section": "terraform", "q": "Show me a Terraform snippet you'd actually write for provisioning part of this stack — say, an Auto Scaling Group behind an ALB.", "a": "Here's the shape I'd write: a launch template referencing a module-sourced AMI and an instance profile, an ASG using target-tracking scaling, and the target group wired to the ALB — with everything parameterized so the same module serves dev and prod at different sizes.", "code": "resource \"aws_launch_template\" \"app\" {\n  name_prefix   = \"app-\"\n  image_id      = data.aws_ami.app.id\n  instance_type = var.instance_type\n  iam_instance_profile { name = aws_iam_instance_profile.app.name }\n  vpc_security_group_ids = [aws_security_group.app.id]\n}\n\nresource \"aws_autoscaling_group\" \"app\" {\n  name                = \"app-asg\"\n  vpc_zone_identifier = var.private_subnet_ids\n  min_size            = var.min_size\n  max_size            = var.max_size\n  desired_capacity    = var.desired_capacity\n  target_group_arns   = [aws_lb_target_group.app.arn]\n  health_check_type   = \"ELB\"\n\n  launch_template {\n    id      = aws_launch_template.app.id\n    version = \"$Latest\"\n  }\n}\n\nresource \"aws_autoscaling_policy\" \"cpu_target\" {\n  name                   = \"app-cpu-target\"\n  autoscaling_group_name = aws_autoscaling_group.app.name\n  policy_type            = \"TargetTrackingScaling\"\n  target_tracking_configuration {\n    predefined_metric_specification { predefined_metric_type = \"ASGAverageCPUUtilization\" }\n    target_value = 60.0\n  }\n}"}, {"id": "chef-1", "section": "chef", "q": "Explain the Chef architecture — server, client, workstation, knife — and how they interact.", "a": "The **Chef Server** is the central hub storing cookbooks, roles, environments, and node data. **Chef Client** runs on every managed node, periodically pulls its assigned configuration (its run-list, resolved through roles/environments) from the server, and converges the node's actual state to match — this pull-based, idempotent model is the core of how Chef keeps drift in check. The **Workstation** is where an engineer authors and tests cookbooks locally before uploading them. **knife** is the CLI that bridges workstation and server — uploading cookbooks, managing node/role/environment data, bootstrapping new nodes into Chef management. The typical loop: author a cookbook on the workstation, test it, `knife cookbook upload` to the server, then nodes pick up the change on their next `chef-client` run (or immediately if you trigger one manually for a deploy)."}, {"id": "chef-2", "section": "chef", "q": "What's the relationship between cookbooks, recipes, and resources?", "a": "A **resource** is the smallest unit — a declarative statement of desired state for one thing, like 'this package should be installed' or 'this service should be running.' A **recipe** is a collection of resources, written in Ruby DSL, that together configure one aspect of a node (e.g. `nginx::default` installs and configures nginx). A **cookbook** is the packaging unit — one or more recipes plus supporting files: templates (ERB config files), attributes (tunable defaults), custom resources, and metadata declaring dependencies on other cookbooks. So the hierarchy is: cookbook contains recipes, recipes contain resources, and a node's run-list is an ordered list of which recipes (from which cookbooks) should apply to it."}, {"id": "chef-3", "section": "chef", "q": "How does Chef target the right configuration to the right nodes — run-lists, roles, and environments?", "a": "A **run-list** is the explicit, ordered list of recipes/roles a specific node should converge to — set directly on the node or, more commonly, inherited from a **role**. A **role** groups a run-list plus default/override attributes under a reusable name (`webserver`, `db-primary`) so you assign nodes to a role rather than hand-building each node's run-list. An **environment** (`dev`, `staging`, `production`) layers environment-specific attribute overrides and can pin cookbook version constraints, so the same role behaves correctly differently per environment — for example, a smaller connection-pool size in dev than prod, without forking the cookbook. In combination: a node is assigned a role and an environment, and Chef resolves the final run-list and attributes from all three layers (node, role, environment) with environment/role overrides taking precedence per Chef's defined precedence order."}, {"id": "chef-4", "section": "chef", "q": "Why does idempotency matter in Chef, and how is it actually implemented in a resource?", "a": "Idempotency means running the same recipe repeatedly produces the same end state without unintended side effects on a run where nothing needs to change — critical because `chef-client` runs on every node continuously (every 30 minutes by default in most setups), not just once at provision time. It's implemented at the resource level: a `package` resource checks whether the package is already installed at the right version before acting; a `service` resource checks current running state before starting/stopping; a `template` resource only rewrites the file if the rendered content actually differs (and Chef reports that as an updated resource in the run's output, which is exactly how you'd notice an unintended drift or an unexpected change during a run). The failure mode to watch for is a custom resource or a shelled-out `execute` block that isn't guarded with a `not_if`/`only_if` — that one runs every single convergence, which both wastes time and can actively cause harm on an already-converged node.", "code": "execute 'enable_custom_repo' do\n  command 'add-apt-repository -y ppa:example/repo && apt-get update'\n  not_if \"grep -q 'example/repo' /etc/apt/sources.list.d/*.list\"\nend"}, {"id": "chef-5", "section": "chef", "q": "Chef vs. Terraform — where does each fit, and how do teams typically use them together?", "a": "Terraform is for **provisioning** — creating the EC2 instance, the VPC, the load balancer, the RDS instance; it manages cloud resources through the provider's API. Chef is for **configuration management** — once a machine exists, Chef installs packages, manages config files, ensures services run, and keeps the OS-level state converged over the machine's lifetime. The common pattern: Terraform creates the instance (and often triggers the bootstrap via `user_data` or a `remote-exec`-free approach like baking Chef Client into the AMI), and Chef then owns everything that happens on that box afterward, on its own recurring convergence schedule, independent of whether Terraform ever runs again. They're complementary, not competing — trying to make Terraform do Chef's job (managing in-OS config drift over time) or vice versa (having Chef create cloud resources) works against what each tool is actually built for."}, {"id": "chef-6", "section": "chef", "q": "How do you test a Chef cookbook before it hits production nodes?", "a": "**Test Kitchen** spins up an isolated instance (via Vagrant, Docker, or a cloud driver) per test suite/platform combination, converges the cookbook against it exactly as it would run on a real node, and tears it down after — catching 'works on paper, fails on a real box' problems before they reach production. **ChefSpec** is a fast unit-testing layer that runs the recipe's resources against a fake Chef run without actually converging a machine, good for quick feedback on resource logic during development. **InSpec** tests the *outcome* — after convergence, does the box actually satisfy the intended state (is the service listening on the right port, is the config file's content correct) — which is also the tool of choice for compliance/audit checks independent of Chef itself. A reasonable pipeline runs ChefSpec on every commit for speed, and Test Kitchen + InSpec before merge or on a schedule as the higher-fidelity check."}, {"id": "chef-7", "section": "chef", "q": "A chef-client run failed on a node — walk through how you'd troubleshoot it.", "a": "Start with the run's own output/log — `chef-client` reports exactly which resource failed and the underlying error (a package not found, a template referencing an undefined attribute, a permissions issue), which is usually enough to point at the cause directly. If it's not obvious, `chef-client -z -l debug` runs in local (zero) mode with verbose logging against the local cookbook without needing a real server round-trip, which is faster for iterating on a fix. `chef-client --why-run` (why-run mode) shows what *would* change without actually converging, useful for validating a fix is going to do what you expect before running it for real on a node that's already in a partially-failed state. Common root causes in practice: an attribute that's `nil` because an expected role/environment override wasn't applied, a cookbook dependency version mismatch after an upload, or a resource that worked on the last OS version but hits a real difference (a renamed package, a changed service manager) on this node's platform."}, {"id": "script-1", "section": "scripting", "q": "What defensive practices do you always build into a Bash script meant to run unattended in automation?", "a": "`set -euo pipefail` at the top — exit on any command failure (`-e`), treat unset variables as an error (`-u`), and make a pipeline fail if any stage fails rather than only the last (`-o pipefail`) — because the default Bash behavior of silently continuing past a failed command is exactly wrong for automation. A `trap` on `EXIT`/`ERR` for cleanup (removing temp files, releasing a lock) so a failure partway through doesn't leave junk behind. Explicit exit codes so a calling pipeline (Jenkins, cron, systemd) can actually distinguish success from failure rather than just checking stdout. And logging with timestamps to somewhere a human or an alerting system will actually see it later — a script that fails silently at 3 AM is worse than one that fails loudly.", "code": "#!/usr/bin/env bash\nset -euo pipefail\ntrap 'echo \"[ERROR] line $LINENO\" >&2' ERR\n\nLOG=/var/log/cleanup.log\nlog() { echo \"$(date -u +'%Y-%m-%dT%H:%M:%SZ') $*\" | tee -a \"$LOG\"; }\n\nlog \"Starting cleanup\"\nfind /data/tmp -type f -mtime +7 -delete\nlog \"Cleanup complete\""}, {"id": "script-2", "section": "scripting", "q": "Write a short Bash example — say, a script that finds and reports stopped ECS tasks, or something similarly practical for daily ops.", "a": "A quick health sweep across ECS services, flagging any with running count below desired — the kind of thing that runs on a schedule (cron or a scheduled Lambda/EventBridge rule) to catch drift before an alert would otherwise fire.", "code": "#!/usr/bin/env bash\nset -euo pipefail\nCLUSTER=\"prod-cluster\"\n\nfor svc in $(aws ecs list-services --cluster \"$CLUSTER\" --query 'serviceArns[]' --output text); do\n  read -r desired running < <(aws ecs describe-services \\\n    --cluster \"$CLUSTER\" --services \"$svc\" \\\n    --query 'services[0].[desiredCount,runningCount]' --output text)\n  if [ \"$running\" -lt \"$desired\" ]; then\n    echo \"DEGRADED: $svc  desired=$desired running=$running\"\n  fi\ndone"}, {"id": "script-3", "section": "scripting", "q": "How do you use Python with boto3 for infra automation — walk through a practical example.", "a": "boto3 is the AWS SDK for Python, and the pattern that comes up constantly is: paginate through a resource type, filter for a condition worth acting on, and either report or remediate. A common toil-reduction example is sweeping for unattached EBS volumes that are quietly costing money — list volumes, filter to `available` (meaning not attached to anything), and either report them for review or, in an automated cleanup with appropriate guardrails, snapshot-then-delete after an age threshold.", "code": "import boto3\nfrom datetime import datetime, timezone\n\nec2 = boto3.client('ec2')\npaginator = ec2.get_paginator('describe_volumes')\n\nfor page in paginator.paginate(Filters=[{'Name': 'status', 'Values': ['available']}]):\n    for vol in page['Volumes']:\n        age_days = (datetime.now(timezone.utc) - vol['CreateTime']).days\n        if age_days > 14:\n            print(f\"Orphaned: {vol['VolumeId']}  {vol['Size']}GB  idle {age_days}d\")"}, {"id": "script-4", "section": "scripting", "q": "Where does PowerShell fit for someone primarily working AWS/Linux infra, and what would a simple example look like?", "a": "PowerShell earns its place wherever there's Windows infrastructure in the mix — Windows EC2 fleets, Active Directory-adjacent automation, or IIS-hosted apps — where it's the native, most capable option, the same role Bash plays on Linux. It's also relevant beyond Windows now: **PowerShell Core** is cross-platform and has first-class AWS Tools for PowerShell, so it shows up in mixed-OS shops as a common automation language across both. A simple, realistic example is a Windows service health check across a fleet, similar in spirit to the Bash ECS example but against `Get-Service` and remote sessions.", "code": "$servers = Get-Content .\\\\prod-windows-hosts.txt\nforeach ($server in $servers) {\n    $svc = Invoke-Command -ComputerName $server -ScriptBlock {\n        Get-Service -Name 'MyAppService' | Select-Object Status\n    }\n    if ($svc.Status -ne 'Running') {\n        Write-Warning \"$server : MyAppService is $($svc.Status)\"\n    }\n}"}, {"id": "script-5", "section": "scripting", "q": "What does 'writing idempotent automation scripts' mean in practice, regardless of language?", "a": "It means running the script twice (or a hundred times) in a row produces the same end state as running it once, with no duplicated side effects — check before you act, rather than assuming a clean slate. Concretely: before creating a resource, check whether it already exists; before appending a line to a config file, check whether it's already there; a cleanup script should be safe to re-run on a schedule without accumulating errors from 'this thing I already deleted last time.' This matters most for anything that runs unattended and repeatedly (a cron job, a CI pipeline step, a Chef/Terraform-adjacent bootstrap script) — a script that only works correctly the first time it runs is a script that will eventually run a second time, by accident, at the worst moment."}, {"id": "script-6", "section": "scripting", "q": "How do you handle errors and logging in an automation script so failures are actually actionable?", "a": "Every failure path needs a **distinct, meaningful exit code** — 0 for success, and different non-zero codes for different failure categories where that distinction matters to whatever calls the script, so a wrapper (Jenkins, cron, a monitoring check) can react appropriately rather than treating every failure identically. Logging should be structured enough to grep and, ideally, ship somewhere centralized (CloudWatch Logs, Splunk) rather than living only in a file on the box that ran it — a script that failed on a host nobody's looking at might as well not have logged at all. And critically: a script's failure should usually *alert*, not just log — writing to a log file that nobody's watching is functionally silent failure, which is one of the more common causes of 'how did nobody notice this was broken for three weeks.'"}, {"id": "script-7", "section": "scripting", "q": "Cron vs. a Jenkins-triggered job vs. a Lambda on a schedule — how do you choose where a piece of automation runs?", "a": "**Cron** is simplest for something that only needs to run on a specific host and doesn't need visibility beyond that host's own logs — fine for truly local housekeeping, but it's a blind spot: no central record of whether it ran, no easy alerting on failure, and it dies with the host. A **Jenkins scheduled job** gives you execution history, logs, and failure notification for free, and fits naturally if the automation is already conceptually a 'job' alongside your other pipelines — but it means Jenkins (and its agent capacity) is a dependency for something that might not need CI infrastructure at all. A **Lambda on an EventBridge schedule** is the best fit for something short-running, stateless, and infrastructure-light — no host to patch or lose, scales to zero cost when idle, and has native CloudWatch visibility — but it's a poor fit for anything long-running (past the timeout ceiling) or needing access to something not reachable from Lambda's network context without extra VPC configuration."}, {"id": "script-8", "section": "scripting", "q": "Parsing JSON from a CLI tool — jq in shell vs. Python's json module. When would you reach for each?", "a": "`jq` wins for anything inline in a shell pipeline — piping `aws ... | jq '.Reservations[].Instances[].InstanceId'` is faster to write and read than spinning up Python for a one-liner, and it composes naturally with the rest of a Bash script's flow. Python's `json` module wins once the logic gets past simple filtering — multi-step transformation, combining data from several API calls, real error handling, or anything that's going to be maintained and tested as actual code rather than a throwaway one-off. The rule of thumb: if it fits on one `jq` line and I'd never need to unit test it, jq; if it's becoming a script with branching logic, Python from the start rather than a jq expression nobody can read six months later.", "code": "# jq: quick extraction in a pipeline\naws ec2 describe-instances | jq -r '.Reservations[].Instances[] | select(.State.Name==\"running\") | .InstanceId'\n\n# Python: same data, but going on to do something with it\nimport json, subprocess\ndata = json.loads(subprocess.check_output(['aws', 'ec2', 'describe-instances']))\nrunning = [i['InstanceId'] for r in data['Reservations'] for i in r['Instances'] if i['State']['Name'] == 'running']"}, {"id": "script-9", "section": "scripting", "q": "Give an example of a real toil-reduction script — something that turned a repetitive manual task into automation.", "a": "A concrete pattern that comes up constantly: cleaning up stopped/dangling Docker resources on build or ECS host fleets, which otherwise quietly fills disk over weeks until something pages at 2 AM. Wrapping it as a scheduled script (cron, or a scheduled ECS task on the hosts themselves) turns a recurring manual 'disk's full again, go clean it up' ticket into something nobody thinks about.", "code": "#!/usr/bin/env bash\nset -euo pipefail\necho \"Before: $(docker system df --format '{{.Size}}' | head -1)\"\n\ndocker container prune -f --filter 'until=24h'\ndocker image prune -af --filter 'until=72h'\ndocker volume prune -f\n\necho \"After: $(docker system df --format '{{.Size}}' | head -1)\""}, {"id": "ecs-1", "section": "ecs", "q": "Explain ECS's core building blocks — cluster, task definition, task, and service — and how they relate.", "a": "A **cluster** is the logical grouping of compute capacity (EC2 instances or Fargate). A **task definition** is the blueprint — a JSON spec of one or more containers, their images, CPU/memory, networking, environment, and IAM roles — analogous to a Kubernetes pod spec. A **task** is a running instance of that task definition — the actual container(s) executing. A **service** wraps a task definition with a desired count and keeps that many tasks running continuously, replacing any that stop, and it's what integrates with a load balancer's target group and with auto scaling — running a bare task directly (without a service) is more for one-off or batch jobs that aren't meant to be long-lived."}, {"id": "ecs-2", "section": "ecs", "q": "EC2 launch type vs. Fargate — how do you decide?", "a": "**Fargate** removes the underlying instance entirely — you specify task-level CPU/memory and AWS runs it, no patching, no capacity planning, billed per task's actual resource allocation. It's the default choice for most services now because it removes a whole category of ops work. **EC2 launch type** means you manage the underlying instances (an ASG of container instances) yourself, which makes sense when you need something Fargate doesn't support well — GPU workloads, very specific instance types, tighter bin-packing for cost at large scale (EC2 can be materially cheaper than Fargate at high, steady utilization), or reserved/Spot capacity for cost optimization on predictable workloads. The practical framing in an interview: default to Fargate, justify EC2 with a specific constraint Fargate doesn't meet, not the other way around."}, {"id": "ecs-3", "section": "ecs", "q": "How does an ECS service's deployment configuration control a rolling update, and what do minimum/maximum healthy percent actually do?", "a": "On a deploy, the service replaces old tasks with new ones according to **minimum healthy percent** (the floor for how many tasks of the *old* or already-updated set must stay healthy during the rollout — e.g. 100% means never drop below the current desired count, so it starts new tasks before stopping old ones) and **maximum healthy percent** (the ceiling on how far above desired count the service can go while both old and new tasks briefly coexist — e.g. 200% means it can fully double up before cutting over). A common production setting is 100%/200% — zero-downtime, no dip in capacity, at the cost of briefly running double the tasks during rollout. The service also respects each task's health check (container health check or ALB target group health check) before considering a new task 'up' and proceeding with the rest of the rollout, so a bad new version stalls the deployment rather than fully replacing a healthy fleet."}, {"id": "ecs-4", "section": "ecs", "q": "Walk through the pieces of an ECS task definition and how secrets/config get into a container.", "a": "Key fields: the container definitions (image, port mappings, log configuration — typically the `awslogs` driver shipping straight to CloudWatch Logs), CPU/memory at the task level and optionally per-container, the **task role** (IAM permissions the *application* uses at runtime, e.g. to call S3 or DynamoDB) versus the **task execution role** (permissions ECS itself needs to pull the image and write logs — a distinction that trips people up early on), and networking mode. For config: plain environment variables for non-sensitive values, and for secrets, the `secrets` field pulls directly from Secrets Manager or SSM Parameter Store at task launch and injects them as environment variables — the actual secret value never sits in the task definition itself, only an ARN reference, which also means it doesn't leak into `describe-task-definition` output or version history the way a hardcoded value would."}, {"id": "ecs-5", "section": "ecs", "q": "How does ECS networking work with awsvpc mode, and what changes about security groups?", "a": "`awsvpc` network mode (required for Fargate, optional but standard for EC2 launch type) gives **each task its own elastic network interface** with its own private IP, rather than sharing the host's network namespace the way `bridge` mode does. That means security groups attach at the task level, not the host level — you can give a payments service task a tighter security group than a general web-tier task on the same cluster, which isn't possible under `bridge` mode where everything on the host shares one network identity. It also means service discovery and cross-task communication behave more like separate hosts talking to each other than like traditional Docker container linking. For service-to-service discovery within the cluster, **AWS Cloud Map** integration gives each service a DNS name resolvable from other tasks in the same namespace, without hardcoding IPs."}, {"id": "ecs-6", "section": "ecs", "q": "How does load balancing work with ECS, and what's dynamic port mapping?", "a": "An ECS service registers its running tasks as targets in an ALB (or NLB) target group, and ECS keeps that registration in sync automatically as tasks start, stop, or get replaced — no manual target management. **Dynamic port mapping** solves the problem of running multiple tasks of the same service on the same EC2 host under the `bridge` network mode: instead of every container claiming a fixed host port (which would collide), the host assigns an ephemeral port per task and the ALB target group tracks which port belongs to which task. With `awsvpc` mode this is less of a concern since every task already has its own IP and can use the container's actual port directly, which is one more reason `awsvpc` has become the default."}, {"id": "ecs-7", "section": "ecs", "q": "How do you set up auto scaling for an ECS service?", "a": "Through **Application Auto Scaling**, registering the ECS service as a scalable target and attaching a scaling policy — most commonly target tracking on `ECSServiceAverageCPUUtilization` or `ECSServiceAverageMemoryUtilization`, or a custom CloudWatch metric (like ALB request count per target, or a queue depth for a worker service) when CPU/memory don't actually reflect the real load driver. The service's own min/max task count bounds define the floor and ceiling the scaling policy operates within. It's worth pairing this with cluster-level capacity planning — if EC2 launch type, the underlying ASG needs its own scaling (or Cluster Auto Scaling via a capacity provider) so there's actual host capacity for ECS to place new tasks onto; with Fargate this concern disappears since there's no underlying instance layer to scale."}, {"id": "ecs-8", "section": "ecs", "q": "An ECS task keeps stopping shortly after starting, or gets stuck in PENDING — how do you debug it?", "a": "Start with **ECS service events** (`describe-services` or the console's Events tab) — ECS surfaces a human-readable reason for most failures there first: 'unable to place a task' points at capacity or resource-constraint issues on the cluster; a repeated stop-and-restart loop points at the container itself failing. For a container that starts and then dies, **CloudWatch Logs** via the `awslogs` driver usually shows the application's own crash output directly. Common root causes in practice: the container's health check failing (app takes longer to become healthy than the health check's start period allows), insufficient CPU/memory reservation causing an OOM kill, a missing IAM permission on the task role surfacing as an application-level access-denied error, or — for PENDING specifically — the execution role lacking permission to pull the image or read a referenced secret, which fails before the container ever starts and so produces no application logs at all, only an ECS-level event."}, {"id": "ecs-9", "section": "ecs", "q": "ECS vs. EKS — when would you actually pick one over the other?", "a": "ECS is the simpler operational model — AWS-native, no Kubernetes control plane to reason about, faster to onboard a team onto, and a very good fit if the workload is straightforward services-behind-a-load-balancer without a need for the broader Kubernetes ecosystem. EKS makes sense when you need things ECS doesn't give you natively: portability across clouds/on-prem, the CNCF ecosystem (Helm charts, operators, service mesh, a specific tool your org already standardized on), more fine-grained scheduling and multi-tenancy controls, or when the org already has Kubernetes expertise and infrastructure elsewhere and wants one consistent platform rather than two. In practice it's also a talent and complexity trade-off — ECS is meaningfully less for a team to operate and hire for; EKS earns its added complexity when the ecosystem or portability actually gets used, not just because it's the more talked-about option."}, {"id": "mon-1", "section": "monitoring", "q": "Explain the Splunk data flow — forwarders, indexers, search heads.", "a": "**Forwarders** (Universal Forwarders, lightweight, or Heavy Forwarders, which can also parse/filter before sending) sit on source hosts and ship raw log data toward Splunk rather than Splunk pulling from each host. **Indexers** receive that data, parse it into events, extract timestamps and fields, and store it in indexes optimized for fast search. **Search heads** are where users and dashboards actually run searches (SPL queries) — they distribute the search across the relevant indexers and merge results back. At any real scale this is a distributed setup (indexer clusters for resilience and search-head clusters for HA/load), but the conceptual flow — forward, index, search — holds regardless of scale."}, {"id": "mon-2", "section": "monitoring", "q": "Write a simple SPL search you'd actually use to find an error pattern.", "a": "A common shape: search a time range and sourcetype, filter to error-level events, then aggregate to see which host or service is generating the most — this is usually the first query during triage, before drilling into any individual event's detail.", "code": "index=prod sourcetype=app_logs level=ERROR\n| stats count by host, error_code\n| sort -count\n| head 20"}, {"id": "mon-3", "section": "monitoring", "q": "How does the Datadog Agent collect metrics, traces, and logs, and how do integrations fit in?", "a": "A single unified Agent runs per host (or as a DaemonSet in Kubernetes/a sidecar in ECS) and handles all three signal types: it collects host-level metrics (CPU, memory, disk) natively, ships application traces via APM instrumentation (auto-instrumentation libraries or OpenTelemetry), and tails/forwards logs when log collection is enabled for a given source. **Integrations** are pre-built checks for specific technologies (PostgreSQL, Nginx, AWS services via the API-based integration rather than the Agent) that the Agent runs on a schedule to pull technology-specific metrics without writing custom collection code — enabling one is usually just a config file drop and an Agent restart, which is a big part of why Datadog's time-to-first-dashboard is fast compared to building the same coverage in a pure OSS Prometheus stack."}, {"id": "mon-4", "section": "monitoring", "q": "What are the main Datadog monitor types, and how do you route alerts sensibly?", "a": "**Metric monitors** alert on a threshold or anomaly against a metric (CPU above X for Y minutes). **APM monitors** watch service-level indicators like error rate or latency percentiles directly from trace data. **Log monitors** alert on the rate of logs matching a query (a spike in ERROR-level logs). **Composite monitors** combine several underlying monitors with boolean logic — useful for reducing noise by only paging when multiple related signals fire together, rather than getting three separate pages for one underlying incident. Routing goes through notification channels tied to the monitor — Slack for lower-urgency, PagerDuty/Opsgenie for anything that should wake someone up — and tagging monitors by service/team means routing (and later, filtering dashboards) follows ownership automatically instead of being hardcoded per monitor."}, {"id": "mon-5", "section": "monitoring", "q": "What would you actually put on a core SRE dashboard for a production service?", "a": "The RED method covers request-driven services well: **Rate** (requests per second), **Errors** (error rate/count), **Duration** (latency, as percentiles — p50/p95/p99, not just an average, since an average hides the tail that's actually hurting users). For the infrastructure underneath, the USE method fills the gap: **Utilization**, **Saturation**, **Errors** per resource (CPU, memory, disk, network, connection pools). Together those answer 'is the service serving traffic well' and 'is the infrastructure underneath it about to become the bottleneck' — which is a more actionable pairing than a dashboard that's just a wall of every metric the Agent happens to emit."}, {"id": "mon-6", "section": "monitoring", "q": "How do you set an alert threshold that's actually actionable instead of contributing to alert fatigue?", "a": "Start from user impact, not a round number that felt reasonable — a latency alert should reflect the point past which users actually notice or an SLO is at risk, not an arbitrary '500ms.' Require sustained breach over a window (e.g. 5 minutes above threshold) rather than firing on a single noisy data point, and prefer a percentile over an average so one slow outlier doesn't either trigger a false alarm or get diluted into invisibility. Where the metric's normal range genuinely varies by time of day or season, anomaly/forecast-based alerting beats a static threshold that's either too tight overnight or too loose at peak. And critically: every alert should map to something a human can actually do — if the runbook for an alert is 'nothing, it always looks like this and resolves itself,' that alert should be deleted or its threshold fixed, not left to keep paging."}, {"id": "mon-7", "section": "monitoring", "q": "Walk through how you'd correlate logs, metrics, and traces to root-cause a live incident.", "a": "Start from the metric that told you something's wrong — say, a latency spike on a specific service — and use that to narrow the time window and the affected service. From there, traces (if APM is instrumented) show exactly which downstream call within a request is slow — a specific database query, a specific external API — narrowing from 'the service is slow' to 'this dependency is slow.' Logs then fill in the *why* for that specific narrowed component — an error message, a connection pool exhaustion warning, a deploy marker that lines up suspiciously well with when the metric turned. The whole point of having all three in one platform (which is a lot of Datadog's pitch, and achievable with Splunk plus a metrics/APM layer too) is being able to pivot from a dashboard straight into the logs/traces for that exact time window and service, instead of manually correlating timestamps across three separate tools during an active incident."}, {"id": "mon-8", "section": "monitoring", "q": "Splunk and Datadog can overlap — practically, where does each tend to be the stronger tool?", "a": "Splunk's roots and strongest use case are log-centric — deep, flexible search across huge volumes of raw log/event data, and it's very commonly the tool of record for security/SIEM use cases and compliance-driven log retention, which is a big part of why it shows up in regulated environments. Datadog's strength is full-stack observability that ties infrastructure metrics, APM traces, and logs together with less setup effort, and its dashboarding/alerting UX is generally faster to get real-time operational visibility from. In practice, a lot of orgs run both for different jobs rather than picking one — Datadog for day-to-day operational monitoring and incident response, Splunk for security/audit-log search and long-term compliance retention — rather than treating it as a strict either/or."}, {"id": "mon-9", "section": "monitoring", "q": "How would you set up synthetic monitoring and tie it back to an SLO?", "a": "Synthetic checks (Datadog Synthetics, or an equivalent) simulate real user paths on a schedule from multiple regions — a login flow, a critical API endpoint — catching outages even when there's zero real traffic to generate a metric-based alert, which matters for low-traffic periods or services with no organic load at 3 AM. Tied to an SLO, the synthetic check's success rate becomes an input to (or a proxy for) availability — if the SLO is '99.9% successful checkout requests,' the synthetic can be the canary that fires *before* the SLO's error budget actually burns meaningfully, giving an earlier warning than waiting for the aggregate real-traffic metric to cross a threshold. The practical setup: run the check frequently enough (every 1-5 minutes) to catch a real outage quickly, from more than one region so a single region's network blip doesn't false-positive, and alert on consecutive failures rather than a single miss."}, {"id": "art-1", "section": "artifactory", "q": "What is JFrog Artifactory, and where does it sit in the release process?", "a": "Artifactory is a **universal artifact repository manager** — the single place build outputs land after CI produces them, and the single place deployments pull from, for essentially any package type: Maven/Gradle jars, npm packages, PyPI wheels, Docker images, generic binaries, Helm charts. It sits between 'CI just finished building this' and 'this is now deployable' — the artifact repository is what makes 'build once, deploy many' actually possible, since every environment pulls the identical, versioned artifact from one trusted source rather than each environment rebuilding from source or pulling from wherever a developer happens to have it."}, {"id": "art-2", "section": "artifactory", "q": "Explain local, remote, and virtual repositories in Artifactory, and how they combine.", "a": "A **local repository** holds artifacts your org actually builds and owns — your Docker images, your internal libraries. A **remote repository** is a caching proxy in front of an external repository (Docker Hub, npmjs.org, Maven Central) — the first request for a package fetches and caches it, and every subsequent request (from any build, anywhere) is served from that local cache, which is both faster and a resilience win if the upstream public registry has an outage or, worse, someone yanks a package version out from under you. A **virtual repository** is an aggregation layer presenting several local and remote repos under a single URL/endpoint, so a build tool only needs one repository configured instead of separately pointing at 'our internal repo' and 'the public proxy' — Artifactory resolves the request against whichever underlying repo actually has the artifact."}, {"id": "art-3", "section": "artifactory", "q": "Describe an artifact promotion workflow — moving a build from dev through to a production-ready release.", "a": "The pattern is: CI builds and publishes the artifact once into a non-production repository (say, `libs-snapshot-local` or a `dev` Docker repo), tagged with a build number or commit SHA. As that specific artifact passes each gate — staging deployment, QA sign-off, security scan — it gets **promoted**, not rebuilt: either moved/copied to the next repository (`libs-release-local`, a `prod` Docker repo) or re-tagged, via the JFrog CLI, REST API, or a CI plugin step. The artifact's binary content never changes across this process — only its location/tag changes to reflect what's been validated — which is the actual mechanism behind 'the thing in staging is provably the same thing you're about to put in production.' Release repositories are typically configured **immutable** — once published, that version can't be overwritten, so a version number always means exactly one specific build, forever."}, {"id": "art-4", "section": "artifactory", "q": "How does Artifactory work as a Docker registry, and how does that integrate with ECS/CI?", "a": "Artifactory exposes Docker repositories that behave like any standard
